<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">A0 Arkade — separate sources, shared observation plane, typed return</title>
  <desc id="desc">Four distinct source systems enter a shared observation plane through declared views. A boundary band separates visible change from source identity. Every route returns to its native record.</desc>
  <defs>
    <radialGradient id="field" cx="50%" cy="50%" r="64%"><stop offset="0" stop-color="#24355d"/><stop offset=".42" stop-color="#0c2432"/><stop offset="1" stop-color="#06141d"/></radialGradient>
    <linearGradient id="spectrum" x1="0" x2="1"><stop stop-color="#f2bf4e"/><stop offset=".25" stop-color="#f05a9d"/><stop offset=".52" stop-color="#7969f3"/><stop offset=".76" stop-color="#34d1cc"/><stop offset="1" stop-color="#76d79a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.white{fill:#edf5f7}.muted{fill:#91a9b7}.gold{fill:#f2bf4e}.cyan{fill:#4bd6ea}.pink{fill:#ef5aa7}.line{fill:none;stroke:#436579;stroke-width:2}.dash{fill:none;stroke:#5c7f91;stroke-width:2;stroke-dasharray:7 11}.small{font-size:16px;letter-spacing:2px}.label{font-size:18px;font-weight:700;letter-spacing:1px}.body{font-size:19px}.big{font-size:48px;font-weight:700}.card{fill:#0a1c26;stroke:#315469;stroke-width:2}.chip{fill:#102a38;stroke:#416b7f;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#06141d"/>
  <rect x="30" y="30" width="1540" height="900" rx="26" fill="url(#field)" stroke="#355568" stroke-width="2"/>
  <text x="78" y="95" class="sans small gold">A0 SCIENCE DESK · PARKED INTAKE · 25.10.2026</text>
  <text x="78" y="155" class="sans big white">BOUNDARY / TRANSITION STORY</text>
  <text x="78" y="194" class="sans body muted">Separate sources. Declared views. Shared comparison. Native return.</text>

  <!-- sources -->
  <g transform="translate(76 258)">
    <text class="mono small muted" x="0" y="-24">01 · SOURCE CONTRACTS</text>
    <rect class="card" x="0" y="0" width="300" height="112" rx="14"/>
    <text class="sans label gold" x="24" y="38">12.6 → 13.7 → 14.8</text><text class="mono small muted" x="24" y="72">DECIMAL-CARRY · EXACT</text><text class="mono small muted" x="24" y="96">Y(n)=21n+76</text>
    <rect class="card" x="0" y="132" width="300" height="112" rx="14"/>
    <text class="sans label pink" x="24" y="170">7.83</text><text class="mono small muted" x="24" y="204">VISUAL ADDRESS</text><text class="mono small muted" x="24" y="228">NOT CALIBRATED</text>
    <rect class="card" x="0" y="264" width="300" height="112" rx="14"/>
    <text class="sans label cyan" x="24" y="302">BLACK SHADOW</text><text class="mono small muted" x="24" y="336">FINITE MASK / HOLD</text><text class="mono small muted" x="24" y="360">BOUND ≠ NOTHING</text>
    <rect class="card" x="0" y="396" width="300" height="112" rx="14"/>
    <text class="sans label white" x="24" y="434">ARKADE WORLDS</text><text class="mono small muted" x="24" y="468">SEPARATE STATE + CLOCK</text><text class="mono small muted" x="24" y="492">COMMON CHOREOGRAPHY</text>
  </g>

  <!-- connectors -->
  <path d="M376 314 C475 314 485 420 600 420" class="line"/>
  <path d="M376 446 C475 446 485 454 600 454" class="line"/>
  <path d="M376 578 C475 578 485 488 600 488" class="line"/>
  <path d="M376 710 C475 710 485 522 600 522" class="line"/>
  <circle cx="470" cy="314" r="5" fill="#f2bf4e"/><circle cx="470" cy="446" r="5" fill="#ef5aa7"/><circle cx="470" cy="578" r="5" fill="#4bd6ea"/><circle cx="470" cy="710" r="5" fill="#edf5f7"/>

  <!-- shared plane -->
  <g>
    <text x="604" y="234" class="mono small muted">02 · DECLARED VIEW</text>
    <ellipse cx="844" cy="480" rx="258" ry="258" fill="#081821" stroke="#4bd6ea" stroke-width="2" opacity=".96"/>
    <ellipse cx="844" cy="480" rx="220" ry="220" fill="none" stroke="#ef5aa7" stroke-width="2" opacity=".55"/>
    <ellipse cx="844" cy="480" rx="180" ry="180" fill="none" stroke="#f2bf4e" stroke-width="2" opacity=".55"/>
    <circle cx="844" cy="480" r="112" fill="#02070b" stroke="url(#spectrum)" stroke-width="10" filter="url(#glow)"/>
    <path d="M603 480 C680 352 759 352 844 480 C929 608 1008 608 1085 480 C1008 352 929 352 844 480 C759 608 680 608 603 480Z" fill="#10152d" stroke="url(#spectrum)" stroke-width="4" opacity=".9"/>
    <circle cx="844" cy="480" r="54" fill="#010507" stroke="#f4d77e" stroke-width="4"/>
    <circle cx="844" cy="480" r="9" fill="#f2bf4e"/>
    <text x="844" y="388" text-anchor="middle" class="sans label white">SHARED OBSERVATION PLANE</text>
    <text x="844" y="625" text-anchor="middle" class="mono small cyan">VIEW · APERTURE · MASK · CLOCK</text>
    <text x="844" y="653" text-anchor="middle" class="mono small muted">COMPARABLE ≠ IDENTICAL</text>
  </g>

  <!-- boundary and return -->
  <path d="M1118 278 C1265 355 1265 605 1118 682" class="dash"/>
  <g transform="translate(1170 274)">
    <text class="mono small muted" x="0" y="-24">03 · BOUNDARY</text>
    <rect class="chip" x="0" y="0" width="330" height="86" rx="12"/><text class="sans label white" x="22" y="34">Transition criterion</text><text class="mono small muted" x="22" y="62">WHAT CHANGES CLASS?</text>
    <rect class="chip" x="0" y="104" width="330" height="86" rx="12"/><text class="sans label white" x="22" y="138">Invariant / residual</text><text class="mono small muted" x="22" y="166">WHAT REMAINS?</text>
    <rect class="chip" x="0" y="208" width="330" height="86" rx="12"/><text class="sans label white" x="22" y="242">Non-identity controls</text><text class="mono small muted" x="22" y="270">WHAT MUST FAIL?</text>
    <rect x="0" y="326" width="330" height="144" rx="14" fill="#241326" stroke="#ef5aa7" stroke-width="2"/>
    <text class="mono small pink" x="22" y="360">04 · TYPED RETURN</text>
    <text class="sans label white" x="22" y="398">Restore by native record</text>
    <text class="mono small muted" x="22" y="430">SOURCE · OPERATOR · CLOCK</text>
    <text class="mono small muted" x="22" y="458">WITNESS · REPLAY · STOP</text>
  </g>

  <path d="M1335 760 C1190 878 388 878 226 790" fill="none" stroke="url(#spectrum)" stroke-width="5"/>
  <polygon points="218,776 244,790 220,804" fill="#f2bf4e"/>
  <text x="788" y="855" text-anchor="middle" class="mono small white">RETURN TO ORIGINAL SOURCE AUTHORITY</text>
  <text x="788" y="890" text-anchor="middle" class="mono small muted">ARKADE = SWITCHBOARD · NOT A UNIVERSAL OPERATOR</text>
</svg>
