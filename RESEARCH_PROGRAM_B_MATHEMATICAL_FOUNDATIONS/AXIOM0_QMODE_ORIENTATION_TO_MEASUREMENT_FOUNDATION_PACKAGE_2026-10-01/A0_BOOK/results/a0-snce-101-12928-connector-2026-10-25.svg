<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">A0 101 dyadic and additive source reconciliation</title>
  <desc id="desc">Comparison of the additive 101n digit family and the dyadic 101 times two to the k sequence, with the decimal cut 1, 292, 8 and a typed boundary to the separate NCS 292 source.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#101929"/></linearGradient>
    <style>
      .t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#eef6ff}.s{font-family:system-ui,sans-serif;fill:#9fb3c8}.g{fill:#d9b56f}.c{fill:#49c8dd}.p{fill:#c58cff}.r{fill:#ff778f}.box{fill:#0c1826;stroke:#2d485d;stroke-width:2}.dash{fill:none;stroke:#6f8192;stroke-width:2;stroke-dasharray:9 8}.line{stroke:#3e6177;stroke-width:2}.thin{stroke:#345064;stroke-width:1}.small{font-size:18px}.mid{font-size:24px}.big{font-size:42px;font-weight:700}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="70" y="70" class="s small">NEXAH · A0 NUMBER VIEW · SOURCE-BOUND RECONCILIATION · 2026-10-25</text>
  <text x="70" y="125" class="t big">101·n  /  101·2ᵏ  /  1│292│8</text>
  <text x="70" y="158" class="s small">same decimal rule · two different families · typed source boundaries</text>

  <rect x="70" y="205" width="1300" height="150" rx="18" class="box"/>
  <text x="100" y="245" class="s small">ADDITIVE DIGIT FAMILY · 101n = n0n · n=1…9</text>
  <g class="t mid">
    <text x="110" y="305" class="c">101</text><text x="235" y="305" class="c">202</text><text x="360" y="305">303</text><text x="485" y="305" class="c">404</text><text x="610" y="305">505</text><text x="735" y="305">606</text><text x="860" y="305">707</text><text x="985" y="305" class="c">808</text><text x="1110" y="305">909</text>
  </g>
  <text x="1230" y="305" class="s small">cyan = intersection</text>

  <rect x="70" y="385" width="1300" height="195" rx="18" class="box"/>
  <text x="100" y="425" class="s small">DYADIC SNCE SPINE · cₖ = 101·2ᵏ · k=0…12</text>
  <path d="M115 485H1320" class="line"/>
  <g class="t small" text-anchor="middle">
    <text x="115" y="477" class="c">101</text><text x="215" y="525" class="c">202</text><text x="315" y="477" class="c">404</text><text x="415" y="525" class="c">808</text>
    <text x="515" y="477" class="p">1616</text><text x="615" y="525" class="p">3232</text><text x="715" y="477" class="p">6464</text><text x="815" y="525" class="g">12928</text>
    <text x="915" y="477">25856</text><text x="1015" y="525">51712</text><text x="1115" y="477">103424</text><text x="1215" y="525">206848</text><text x="1315" y="477" class="r">413696</text>
  </g>
  <g fill="#3e6177">
    <circle cx="115" cy="485" r="6"/><circle cx="215" cy="485" r="6"/><circle cx="315" cy="485" r="6"/><circle cx="415" cy="485" r="6"/><circle cx="515" cy="485" r="6"/><circle cx="615" cy="485" r="6"/><circle cx="715" cy="485" r="6"/><circle cx="815" cy="485" r="8" fill="#d9b56f"/><circle cx="915" cy="485" r="6"/><circle cx="1015" cy="485" r="6"/><circle cx="1115" cy="485" r="6"/><circle cx="1215" cy="485" r="6"/><circle cx="1315" cy="485" r="8" fill="#ff778f"/>
  </g>
  <text x="100" y="555" class="s small">zero visible through 808</text><text x="480" y="555" class="s small">repeated blocks</text><text x="760" y="555" class="s small">first overlap · no carry</text><text x="1160" y="555" class="s small">first carry</text>

  <rect x="70" y="610" width="780" height="220" rx="18" class="box"/>
  <text x="100" y="650" class="s small">UNCHANGED RULE · 101q = 100q + q</text>
  <text x="115" y="715" class="t big">12800 + 00128 = 12928</text>
  <text x="115" y="770" class="t big"><tspan class="g">1</tspan>│<tspan class="g">292</tspan>│<tspan class="g">8</tspan></text>
  <text x="410" y="765" class="s small">292=4·73 · palindrome · 12928 mod 292 = 80</text>
  <text x="410" y="800" class="s small">substring / place-value cut — not an NCS identity</text>

  <rect x="900" y="610" width="470" height="220" rx="18" class="box"/>
  <text x="930" y="650" class="s small">SEPARATE TYPED SOURCES</text>
  <text x="930" y="700" class="t mid">SNCE 12928: k=7 · (u,ε)=(3,1)</text>
  <text x="930" y="745" class="t mid">NCS 292: SCC-003 / A0-BL-023</text>
  <path d="M935 775H1330" class="dash"/>
  <text x="930" y="810" class="s small">no adapter · no equality · no imported mechanism</text>

  <text x="70" y="875" class="s small">LIGHT + SPACE / REAL MIRROR / UV-Hg: retained as Owner readings; projection, shadow and physical light remain distinct.</text>
</svg>
