    &lt;div class=&quot;protocol-stop&quot;&gt;&lt;b&gt;BOUNDARY:</b&gt; Magische Summen, Dezimalquersummen, Scrabblewerte, Farbrollen und Cube-Geometrie sind verschiedene Typen. Gleiche Zahlen oder ähnliche Bilder erzeugen weder eine neue Relation noch einen Geometriebeweis. Dieses Fenster bindet vorhandene Prüfstände; es startet keinen neuen Run.&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;protocol-section&quot; id=&quot;h4-h5-two-hand-bridge&quot; aria-labelledby=&quot;two-hand-title&quot;&gt;
    &lt;div class=&quot;two-hand-bridge&quot;&gt;
      &lt;div class=&quot;two-hand-head&quot;&gt;
        &lt;div&gt;&lt;h2 id=&quot;two-hand-title&quot;&gt;H4 × H5 · Two Hands Turn One Cube&lt;/h2&gt;&lt;p&gt;Zwei vorhandene A0-Instrumente bedienen denselben Janus-Träger aus verschiedenen Richtungen. Die linke Hand führt den gerichteten C5-Kantenschritt aus dem Orientation Controller Bench; die rechte Hand schaltet eine vorab sichtbare Prime-/Composite-Kandidatenfolge nach dem Mapping- und Kontrollprinzip des Tessarec Blue Body Lab. Erst der gemeinsame Zustandsrecord darf als Return gelesen werden.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;two-hand-contract&quot;&gt;LEFT · H4 · C5 EDGE&lt;br&gt;RIGHT · H5 · FOLD CANDIDATE&lt;br&gt;JOINT RETURN · LCM(5,4)=20&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;two-hand-stage&quot;&gt;
        &lt;article class=&quot;hand-panel left&quot;&gt;&lt;h3&gt;LEFT HAND · H4&lt;/h3&gt;&lt;p&gt;Gerichteter Zustand &lt;code&gt;(a→b)&lt;/code&gt;. Der Schritt &lt;code&gt;+2 mod 5&lt;/code&gt; vermeidet auf der deklarierten Rosenroute die unmittelbare Rückkante.</p&gt;
          &lt;div class=&quot;hand-buttons&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;two-hand-left-step&quot;&gt;EDGE +2 ↗&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;two-hand-left-reset&quot;&gt;RESET C5&lt;/button&gt;&lt;/div&gt;
          &lt;div class=&quot;hand-readout&quot; id=&quot;two-hand-left-readout&quot;&gt;0→2 · EDGE 0/5&lt;/div&gt;
          &lt;p&gt;&lt;a href=&quot;../A0_ORIENTATION_CONTROLLER_BENCH.html&quot;&gt;Source instrument ↗&lt;/a&gt;&lt;/p&gt;
        &lt;/article&gt;
        &lt;div class=&quot;two-hand-cube&quot;&gt;
          &lt;svg class=&quot;two-hand-svg&quot; viewBox=&quot;0 0 420 270&quot; role=&quot;img&quot; aria-labelledby=&quot;two-hand-svg-title two-hand-svg-desc&quot;&gt;
            &lt;title id=&quot;two-hand-svg-title&quot;&gt;Two hands rotate one Janus cube&lt;/title&gt;&lt;desc id=&quot;two-hand-svg-desc&quot;&gt;A cyan left arrow and a pink right arrow act on one cube. A shared state label records edge and fold phases.&lt;/desc&gt;
            &lt;polygon class=&quot;cube-face top&quot; points=&quot;210,42 318,98 210,154 102,98&quot;&gt;&lt;/polygon&gt;
            &lt;polygon class=&quot;cube-face&quot; points=&quot;102,98 210,154 210,246 102,190&quot;&gt;&lt;/polygon&gt;
            &lt;polygon class=&quot;cube-face right&quot; points=&quot;210,154 318,98 318,190 210,246&quot;&gt;&lt;/polygon&gt;
            &lt;path class=&quot;turn-arrow left&quot; id=&quot;two-hand-left-arrow&quot; d=&quot;M65 193 C25 139 40 67 108 37&quot;&gt;&lt;/path&gt;&lt;path d=&quot;M99 29 L113 36 L102 47&quot; fill=&quot;none&quot; stroke=&quot;var(--viz-series-1)&quot; stroke-width=&quot;4&quot;&gt;&lt;/path&gt;
            &lt;path class=&quot;turn-arrow right&quot; id=&quot;two-hand-right-arrow&quot; d=&quot;M355 193 C395 139 380 67 312 37&quot;&gt;&lt;/path&gt;&lt;path d=&quot;M321 29 L307 36 L318 47&quot; fill=&quot;none&quot; stroke=&quot;var(--viz-series-4)&quot; stroke-width=&quot;4&quot;&gt;&lt;/path&gt;
            &lt;text x=&quot;53&quot; y=&quot;214&quot;&gt;H4 · EDGE&lt;/text&gt;&lt;text x=&quot;303&quot; y=&quot;214&quot;&gt;H5 · FOLD&lt;/text&gt;
            &lt;text x=&quot;210&quot; y=&quot;126&quot; text-anchor=&quot;middle&quot; id=&quot;two-hand-cube-record&quot;&gt;E0 · P13&lt;/text&gt;
            &lt;text x=&quot;210&quot; y=&quot;178&quot; text-anchor=&quot;middle&quot;&gt;JANUS · SAME CARRIER&lt;/text&gt;
          &lt;/svg&gt;
          &lt;div class=&quot;two-hand-actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;two-hand-coupled-step&quot;&gt;BOTH HANDS · +1&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;two-hand-run-return&quot;&gt;RUN TO RETURN&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;two-hand-reset&quot;&gt;RESET BOTH&lt;/button&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;article class=&quot;hand-panel right&quot;&gt;&lt;h3&gt;RIGHT HAND · H5&lt;/h3&gt;&lt;p&gt;Vier deklarierte Kandidaten, darunter die Composite-Kontrolle &lt;code&gt;C21&lt;/code&gt;. Der Player zeigt eine Auswahl; er beweist keine Prime-Folding-Regel.&lt;/p&gt;
          &lt;div class=&quot;hand-buttons&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;two-hand-right-step&quot;&gt;NEXT FOLD ↗&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;two-hand-right-reset&quot;&gt;RESET FOLD&lt;/button&gt;&lt;/div&gt;
          &lt;div class=&quot;hand-readout&quot; id=&quot;two-hand-right-readout&quot;&gt;P13 · 13³=2197 · 0/4&lt;/div&gt;
          &lt;p&gt;&lt;a href=&quot;../A0_TESSAREC_BLUE_BODY_LAB.html&quot;&gt;Source instrument ↗&lt;/a&gt;&lt;/p&gt;
        &lt;/article&gt;
      &lt;/div&gt;
      &lt;div class=&quot;two-hand-metrics&quot;&gt;
        &lt;div class=&quot;two-hand-metric&quot;&gt;&lt;small&gt;COUPLED TICK&lt;/small&gt;&lt;b id=&quot;two-hand-tick&quot;&gt;0 / 20&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;two-hand-metric&quot;&gt;&lt;small&gt;H4 PERIOD&lt;/small&gt;&lt;b&gt;5 · C5&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;two-hand-metric&quot;&gt;&lt;small&gt;H5 DISPLAY PERIOD&lt;/small&gt;&lt;b&gt;4 · 3P+1C&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;two-hand-metric pass&quot; id=&quot;two-hand-return-card&quot;&gt;&lt;small&gt;JOINT RETURN&lt;/small&gt;&lt;b id=&quot;two-hand-return&quot;&gt;SOURCE · CLOSED&lt;/b&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;two-hand-boundary&quot; id=&quot;two-hand-boundary&quot;&gt;&lt;b&gt;R0 / TWO-SOURCE LENS:&lt;/b&gt; Exakt ist nur der endliche Controller: C5 besitzt Periode 5, die vierteilige Kandidatenanzeige Periode 4 und ihr gekoppeltes Produkt Periode 20. H4 bleibt offen über diese lokale C5-Instanz hinaus. H5 bleibt offen, weil die Folge P13/P17/P23/C21 gesetzt und nicht aus einer vorab validierten Prime-Folding-Regel vorhergesagt wird. Die Riemann-/Ihara-Gegenüberstellung ist Beobachtergeschichte, keine Identität.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;protocol-section&quot; id=&quot;h8-record-deck-mode-lens&quot; aria-labelledby=&quot;h8-title&quot;&gt;
    &lt;div class=&quot;h8-deck-lens&quot;&gt;
      &lt;div class=&quot;h8-head&quot;&gt;
        &lt;div&gt;&lt;h2 id=&quot;h8-title&quot;&gt;H8 · Record Deck / Club Mode Stack&lt;/h2&gt;&lt;p&gt;Das vorhandene A0-Plattendeck wird als getypter Sechser-Stack gelesen: drei moderne Vinylpositionen, zwei Grammophon-/Schellackpositionen und eine digitale Klasse. Newton, Leibniz und Goethe liegen als unabhängige AM/VM/PM-Beobachterlinsen darüber. Medium, Tempo, Linse, Adresse und Stack-Platte bleiben getrennte Felder.&lt;/p&gt;&lt;/div&gt;
        &lt;div class=&quot;h8-contract&quot;&gt;3 VINYL + 2 SHELLAC + 1 DIGITAL&lt;br&gt;N·AM + L·VM + G·PM&lt;br&gt;ONE DECK · NO SHARED CLOCK&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;h8-layout&quot;&gt;
        &lt;article class=&quot;h8-panel&quot;&gt;&lt;h3&gt;MODE STACK · 3 + 2 + 1&lt;/h3&gt;
          &lt;div class=&quot;h8-mode-stack&quot; role=&quot;group&quot; aria-label=&quot;Sechs deklarierte H8 Deckpositionen&quot;&gt;
            &lt;button type=&quot;button&quot; data-h8-mode=&quot;vinyl-lp&quot; aria-pressed=&quot;true&quot;&gt;&lt;b&gt;V1 · LP&lt;/b&gt;VINYL · 12″ · 33⅓&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-h8-mode=&quot;vinyl-single&quot; aria-pressed=&quot;false&quot;&gt;&lt;b&gt;V2 · SINGLE / EP&lt;/b&gt;VINYL · 7″ · 45&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-h8-mode=&quot;vinyl-manual&quot; aria-pressed=&quot;false&quot;&gt;&lt;b&gt;V3 · MANUAL&lt;/b&gt;VINYL · FORMAT × UI TEMPO&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-h8-mode=&quot;shellac-78&quot; aria-pressed=&quot;false&quot;&gt;&lt;b&gt;S1 · SCHELLACK&lt;/b&gt;GRAMMOPHON · 10″ · 78&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-h8-mode=&quot;shellac-manual&quot; aria-pressed=&quot;false&quot;&gt;&lt;b&gt;S2 · HAND / MANUAL&lt;/b&gt;GRAMMOPHON · WIND / READ&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-h8-mode=&quot;digital&quot; aria-pressed=&quot;false&quot;&gt;&lt;b&gt;D1 · DIGITAL&lt;/b&gt;CD · TRACK / STREAM · QUEUE&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;h8-readout&quot; id=&quot;h8-mode-readout&quot; aria-live=&quot;polite&quot;&gt;V1 · LP · VINYL · 12″ · 33⅓ · ANALOG&lt;/div&gt;
        &lt;/article&gt;
        &lt;article class=&quot;h8-panel&quot;&gt;&lt;h3&gt;THREE SPECTRA · INDEPENDENT VIEW LENSES&lt;/h3&gt;
          &lt;div class=&quot;h8-spectrum&quot; role=&quot;group&quot; aria-label=&quot;Newton Leibniz Goethe Leselinse&quot;&gt;
            &lt;button type=&quot;button&quot; data-h8-spectrum=&quot;newton&quot; aria-pressed=&quot;false&quot;&gt;&lt;b&gt;N · AM&lt;/b&gt;NEWTON · decomposition&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-h8-spectrum=&quot;leibniz&quot; aria-pressed=&quot;true&quot;&gt;&lt;b&gt;L · VM&lt;/b&gt;LEIBNIZ · relation/order&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-h8-spectrum=&quot;goethe&quot; aria-pressed=&quot;false&quot;&gt;&lt;b&gt;G · PM&lt;/b&gt;GOETHE · boundary/appearance&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;h8-readout&quot; id=&quot;h8-spectrum-readout&quot; aria-live=&quot;polite&quot;&gt;L · VM · LEIBNIZ · RELATIONAL ORDER · VIEW ONLY&lt;/div&gt;
        &lt;/article&gt;
      &lt;/div&gt;
      &lt;div class=&quot;h8-binary&quot; aria-label=&quot;Vier getrennte 101-Lesarten&quot;&gt;
        &lt;div&gt;&lt;b&gt;I | O | I&lt;/b&gt;&lt;span&gt;binary / glyph rail&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;A | O | A′&lt;/b&gt;&lt;span&gt;source / pin / return&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;1 | 0 | 1&lt;/b&gt;&lt;span&gt;declared number projection&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;Α → Λ → Ω&lt;/b&gt;&lt;span&gt;Owner mnemonic progression&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;h8-source-grid&quot;&gt;
        &lt;a href=&quot;../A0_CURSOR_HANDOFF_CLICKDUMMY.html#performanceConsole&quot;&gt;&lt;b&gt;PLATTENDECK ↗&lt;/b&gt;Profile, Presets, RPM-/Formatlabels und AM/VM/PM-Mixer.&lt;/a&gt;
        &lt;a href=&quot;../DRAFTS/A0_FAMILY_NAVIGATOR_DEMO.html#club-deck-room&quot;&gt;&lt;b&gt;CLUB MACHINE ↗&lt;/b&gt;Dieselbe lazy Deck-Instanz; kein kopierter Player.&lt;/a&gt;
        &lt;a href=&quot;../DRAFTS/A0_FAMILY_NAVIGATOR_DEMO.html#control-room&quot;&gt;&lt;b&gt;CONTROL ROOM ↗&lt;/b&gt;Read-only 20er-Grid desselben bestätigten Trägers; keine zweite Uhr.&lt;/a&gt;
        &lt;a href=&quot;../A0_ORIENTATION_CONTROLLER_BENCH.html#apertureStackCalibration&quot;&gt;&lt;b&gt;APERTURE STACK ↗&lt;/b&gt;EP·SI·LP·SH·RT·RETURN als getrennte Sechs-Platten-Fixture.&lt;/a&gt;
      &lt;/div&gt;
      &lt;div class=&quot;h8-boundary&quot; id=&quot;h8-boundary&quot;&gt;&lt;b&gt;SOURCE-BOUND / NON-IDENTITY:&lt;/b&gt; Die 3+2+1-Gruppierung ist eine deklarierte H8-Lesekarte über vorhandenen Playerzuständen. 33⅓, 45 und 78 bleiben UI-Tempo-/Formatlabels, keine Messung. Newton/Leibniz/Goethe und AM/VM/PM sind lokale Beobachterrollen, keine historischen Identitäten. Der Aperture Stack &lt;code&gt;EP–SI–LP–SH–RT–RETURN&lt;/code&gt; besitzt keine automatische zeilenweise Zuordnung zu den sechs Deckpositionen. &lt;code&gt;I–O–I&lt;/code&gt;, &lt;code&gt;A–O–A′&lt;/code&gt;, &lt;code&gt;1–0–1&lt;/code&gt; und &lt;code&gt;Α–Λ–Ω&lt;/code&gt; sind vier getrennte Projektionen; Gleichheit ist nicht behauptet.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;protocol-section&quot; id=&quot;protocol-ledger&quot; aria-labelledby=&quot;protocol-ledger-title&quot;&gt;
    &lt;div class=&quot;protocol-head&quot;&gt;&lt;div class=&quot;protocol-no&quot;&gt;04 / LEDGER&lt;/div&gt;&lt;div&gt;&lt;h2 id=&quot;protocol-ledger-title&quot;&gt;Beobachtungen und Ideenstand&lt;/h2&gt;&lt;p&gt;Das Ledger hält fest, was in dieser Sitzung sichtbar wurde. Reihenfolge bedeutet Entstehungsgeschichte, nicht Beweisstärke.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;protocol-ledger&quot;&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-01&lt;/b&gt;&lt;strong&gt;Leaf / Fold&lt;/strong&gt;&lt;span&gt;A und A′ liegen symmetrisch um O; die Betragsansicht 1|0|1 verliert links/rechts. Ein eindeutiger Return benötigt Zusatzinformation.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-02&lt;/b&gt;&lt;strong&gt;Alpha × Number&lt;/strong&gt;&lt;span&gt;Ein A–D × 1–4-Grid trägt zwei Diagonalen, eine vierzellige Mittelnaht und die getrennten Zählungen 1-2-3-4 / 3-2-1-0 / Pascal 1-3-3-1.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-03&lt;/b&gt;&lt;strong&gt;Front / Back&lt;/strong&gt;&lt;span&gt;AOA′=17, AOB′=18, BOA′=18 und BOB′=19. Die beiden 18er-Records sind numerisch gleich, aber seitenverschieden; C=L/R hält diese Differenz.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-04&lt;/b&gt;&lt;strong&gt;Alphabet / Silbe&lt;/strong&gt;&lt;span&gt;Die deklarierte 5V/19K-Partition erzeugt die Modellzählungen 100 und 120. Sie ist eine kombinatorische Arbeitsfläche, noch keine natürliche Sprachgrammatik.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-05&lt;/b&gt;&lt;strong&gt;Q-Cut / O-Ring&lt;/strong&gt;&lt;span&gt;q=18° teilt den Richtungsring in 20 Schritte; fünf Schritte ergeben Q90. O bleibt gemeinsamer Pin, Beobachtungspunkt und Return-Basis aller orientierten Schnitte.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-06&lt;/b&gt;&lt;strong&gt;Vinyl Format Lens&lt;/strong&gt;&lt;span&gt;Drehzahl, Durchmesser und Spielform sind getrennte Felder: typische historische Paare sind 7″/45 RPM, 10″/78 RPM und 12″/33⅓ RPM; sie sind nicht absolut. Die Ganzzahladdition 33+45=78=80−2 ist eine Owner-Überlagerung, keine Formatgeschichte.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-07&lt;/b&gt;&lt;strong&gt;EP / Extended Play&lt;/strong&gt;&lt;span&gt;Eine kleine 7″-Extended-Play-45 ist historisch belegt. Die Lesung als „Galgen“ sowie II=VM=Võ und AM/VM/PM bleiben lokale Owner-Mnemoniken und werden nicht in Industrieterminologie umgeschrieben.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-08&lt;/b&gt;&lt;strong&gt;Existing Club / Cut-Q Return&lt;/strong&gt;&lt;span&gt;OPIUM bindet Plattenspieler und Relations Player bereits zusammen; der vorhandene Cut/Q-Adapter führt 7|8|9 → AM|VM|PM und das mittlere 8→VM/YZ. Galgen/7 und AM/VM/PM sind daher keine in diesem Draft neu erfundenen Motive, sondern eine neue Perspektive auf vorhandene Records.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-09&lt;/b&gt;&lt;strong&gt;Binomial Cube · 11³&lt;/strong&gt;&lt;span&gt;(10+1)³ zerlegt 1,331 Einheitswürfel exakt als 1,000 + 300 + 30 + 1: ein Base Cube, drei Face Slabs, drei Edge Bars und ein Corner Cube. Das ist die räumliche Pascal-Zeile 1–3–3–1.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-10&lt;/b&gt;&lt;strong&gt;Centered Shell · 1+9+1&lt;/strong&gt;&lt;span&gt;Derselbe 11³-Träger zerfällt nach Entfernen eines Randfelds auf beiden Seiten exakt als 9³ + 6·9² + 12·9 + 8 = 729 + 486 + 108 + 8 = 1,331. Die äußere Flächendiagonale belegt 11 Rasterfelder; die Innenfläche ist 9×9.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-11&lt;/b&gt;&lt;strong&gt;Projection / Render Split&lt;/strong&gt;&lt;span&gt;T/Y ist eine kameraabhängige Projektion der drei Corner-Richtungen. Black Split, White Highlight und Glow sind zunächst Schatten-, Reflexions- und Materialrollen und keine zusätzlichen Volumenterme. 11|12|13 bleibt eine deklarierte View-Adressierung.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-12&lt;/b&gt;&lt;strong&gt;Separate Q-Bit-Linse&lt;/strong&gt;&lt;span&gt;Der andere 3×3-Permutationscube zerlegt seine 54 sichtbaren Facelets als 8×3 + 12×2 + 6×1. Sein binärer Six-Face-Record besitzt 2⁶=64 Zustände; er ist nicht der 11×11×11-Binomial-Cube.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-13&lt;/b&gt;&lt;strong&gt;Two-Face Return&lt;/strong&gt;&lt;span&gt;Das vorhandene finite Cube-Audit schließt den vollständigen 54-Facelet-Record für den Kommutator [R,U]=R U R⁻¹ U⁻¹ nach sechs Ticks beziehungsweise 24 Vierteldrehungen. Dieser Permutationsreturn gehört zur separaten Q-Bit-Linse.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-14&lt;/b&gt;&lt;strong&gt;Even/Odd Center Bridge&lt;/strong&gt;&lt;span&gt;Eine gerade 10×10-Fläche besitzt vier zentrale Zellen um den geometrischen Mittelpunkt O; eine ungerade 11×11-Fläche besitzt genau ein zentrales Feld. &lt;code&gt;4+O→1&lt;/code&gt; bezeichnet diesen Paritätswechsel, nicht eine arithmetische Gleichung.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-15&lt;/b&gt;&lt;strong&gt;PINKY / Two-Channel Test&lt;/strong&gt;&lt;span&gt;Die Projektion von &lt;code&gt;P(i)&lt;/code&gt; und &lt;code&gt;N(k)&lt;/code&gt; auf einen nackten Wert kollidiert im Bereich i=1…8, k=1…20 achtmal. Ein P/N-Typmarker trennt diese zwei Herkunftskanäle vollständig. Das bestehende TESA-4×7-Paar (row,column) adressiert alle 28 Innenzellen eindeutig; ein universelles „immer zwei“ folgt daraus nicht.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-16&lt;/b&gt;&lt;strong&gt;Power / Carrier Type Bench&lt;/strong&gt;&lt;span&gt;Für Q≥2 und positive ganze a,b gilt exakt &lt;code&gt;(Qᵃ)ᵇ=Qᵃᵇ=(Qᵇ)ᵃ&lt;/code&gt;. Daher ist &lt;code&gt;1000²=100³=10⁶&lt;/code&gt;, obwohl die geordneten Pack-Records (3,2) und (2,3) verschieden sind. Zwölf Dezimalnullen lassen sich exakt als &lt;code&gt;(10³)⁴=(10⁴)³=(10²)⁶=(10⁶)²=10¹²&lt;/code&gt; gruppieren; die Records (3,4), (4,3), (2,6) und (6,2) bleiben verschieden.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-17&lt;/b&gt;&lt;strong&gt;UDF Rule / Materialization Witness&lt;/strong&gt;&lt;span&gt;Ein kanonischer JSON-Regelrecord erzeugt für TESA28, Cube 11³, PINKY320 oder einen begrenzten Qᵈ-Pack zweimal denselben unkomprimierten JSON-Adresslisten-Witness. UTF-8-Bytes, lokale Laufzeit und FNV-1a-Return werden gemessen; oberhalb von 50.000 Zuständen wird die Entfaltung explizit übersprungen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-18&lt;/b&gt;&lt;strong&gt;KV Codec / Return Ladder&lt;/strong&gt;&lt;span&gt;Unter dem festgelegten A–Z-Vertrag mit V={A,E,I,O,U} bildet AOK auf VVK ab. Diese Typfolge besitzt 525 mögliche A–Z-Sequenzen; mit dem A–L/M–Z-Seitenrecord bleiben 54. Die vollständige TESA28-Adresse rekonstruiert AOK eindeutig. Y bleibt ein explizit schaltbarer Modellparameter.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-19&lt;/b&gt;&lt;strong&gt;Janus 7 / 3D Chess Compass&lt;/strong&gt;&lt;span&gt;Die endliche lokale 3×3×3-Nachbarschaft zerfällt als 1 Zentrum + 6 Achsennachbarn + 12 Flächendiagonalen + 8 Raumecken = 27. Pferdeziele sind die 24 Vorzeichen und Permutationen von (2,1,0). Der 4×7-Pack ist als vier View-Sektoren mal sieben Kompassrollen deklariert; Fugen bleiben Grenzen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-20&lt;/b&gt;&lt;strong&gt;ILAU / Octant-to-Face Embedding&lt;/strong&gt;&lt;span&gt;Die drei Binärpaare I/A, L/R und O/U erzeugen 2³=8 Oktanten. Ihre Einbettung in den Six-Face-Raum wählt genau eine Fläche pro Gegenpaar und aktiviert daher drei von sechs Bits. ALU wird als ILAU-Endrecord B=011001 festgelegt: im gleichgewichteten 64er-Raum besitzt B Gewicht 1/64, im konditionierten Oktantteilraum 1/8.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-21&lt;/b&gt;&lt;strong&gt;Game of Worlds / Addressable GLB Projection&lt;/strong&gt;&lt;span&gt;Der gemeinsame 11er-Träger ist als reproduzierbarer GLB mit 461 benannten Nodes, neunzehn Meshes und acht Animationen exportiert. Number, Word, Graph und World bleiben Projektionen; Riemann/Ecke, Ihara/Kante, Euler/Fläche und Fibonacci/45° bleiben getrennte Beobachterrollen. Der ALU-B-Record, die ½-Ebene und P13→41 liegen als Node-extras vor.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-22&lt;/b&gt;&lt;strong&gt;Legend Solo Focus / Three-Pulse Inspection&lt;/strong&gt;&lt;span&gt;A, L und U sind als genau drei aktive ILAU-Endknoten mit einem vom B-Corner getrennten Material adressierbar. Ein Klick auf eine der elf Legenden-Gruppen dimmt alle anderen Gruppen, pulsiert die Auswahl dreimal und hält sie anschließend im Solo-Fokus; ALL ON rekonstruiert die vollständige Ansicht. Das verändert ausschließlich Kamera und Materialemission, weder GLB-State noch wissenschaftliche Aktivierung.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-23&lt;/b&gt;&lt;strong&gt;Violet / Red / Ghost 3+1 Clips&lt;/strong&gt;&lt;span&gt;Violet bindet den vorhandenen HALF_PLANE_PULSE an seine Legendenwahl. Red besitzt einen eigenen RED_CORNER_WITNESS_PULSE. Ghost 3+1 ergänzt fünf Nodes: eine Gruppennode, World im Zentrum sowie Sun, Moon und Star als drei Glyphen; GHOST_3_PLUS_1_PULSE skaliert sie sequenziell, ohne Translation oder Orbitbahn.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-24&lt;/b&gt;&lt;strong&gt;Outside / Inside Room Views&lt;/strong&gt;&lt;span&gt;Der Player besitzt drei explizite Kamerapresets: Outside zeigt den Carrier von außen; Inside 15H und Inside 21H setzen die Kamera nahe an O und unterscheiden zwei um 90° versetzte Innenraumrichtungen. Der Wechsel verändert weder GLB-Geometrie noch Material-, Record- oder World-State.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-25&lt;/b&gt;&lt;strong&gt;Inside–Out Fuge / White–Orange Pair&lt;/strong&gt;&lt;span&gt;RETURN_WHITE umfasst die drei korrespondierenden weißen Return-Felder der sichtbaren Außenflächen. O0_CENTER besitzt nun das getrennte Material O0_INSIDE_ORANGE. FUGE_INSIDE_OUT_PULSE skaliert zuerst außen, dann innen; der zehnte Legendeneintrag macht beide Rollen gemeinsam adressierbar.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-26&lt;/b&gt;&lt;strong&gt;Q Address Overlay / Rosenbrücke / Ghost Addresses&lt;/strong&gt;&lt;span&gt;Der Player besitzt eine explizit schaltbare, rein zweidimensionale Adresslinse. Exakt ist 2501×2=5002. Q AXIS, T/Rosenbrücke, Ghostgons 17·19·29 und EG|1 sind deklarierte View-Labels. 7.83 ist als FREQUENCY·UNBOUND markiert und wird weder geometrisch noch physikalisch aus dem Cube abgeleitet.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-27&lt;/b&gt;&lt;strong&gt;Edelweiss L-Frame Wobble / Mirror Return&lt;/strong&gt;&lt;span&gt;Der sechste GLB-Clip besitzt 33 Transform-Tracks: zwei gegenphasige Quaternion-Tracks für das obere rechte L-Frame, sieben Außenfeld-Pulse, elf Front-Lift-Pulse, elf gespiegelte Right-Return-Pulse, einen Binder-Scale-Puls und einen O₀-Return-Puls. B_CORNER_ALU verändert dabei seine Position nicht.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-28&lt;/b&gt;&lt;strong&gt;Ihara × Rose C5 / Inside–Fuge–Inside′&lt;/strong&gt;&lt;span&gt;Fünf Frontfelder werden auf die vorhandene Rosenroute 0→2→4→1→3→0 abgebildet. Die fünf geometrischen Kanten besitzen zehn gerichtete Zustände; der dargestellte Hashimoto-Walk hat null unmittelbare Rückläufe. Der Clip führt anschließend über drei weiße Return-Felder zu O₀ Orange und den vier Ghost-Witnesses. AM/XY, VM/YZ und PM/ZX wählen Inside, gerichtete Fuge und Inside′. H5 bleibt unverändert Prime Foldings.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-29&lt;/b&gt;&lt;strong&gt;Game of Numbers / A0–101 Breath&lt;/strong&gt;&lt;span&gt;Der vorhandene A–O–A′-Fold erhält einen benutzergesteuerten 6-Sekunden-Anzeigezyklus: CARO expandiert und faltet, CON–DAO hält die 0-Fuge, AU–NA führt den Return und DAO markiert den Stillpunkt. Die Zuordnung A | O | A′ → 1 | 0 | 1 ist eine deklarierte Zahlenprojektion; sie behauptet weder A=1 als natürliche Identität noch einen biologischen, zeitlichen oder physikalischen Atemmechanismus. CARO, CON–DAO, AU–NA und DAO werden ausschließlich als bereits vorhandenes Owner-Vokabular wiederverwendet.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-30&lt;/b&gt;&lt;strong&gt;Deck ↔ Cube Deterministic Audit&lt;/strong&gt;&lt;span&gt;Der deklarierte 54er-Record bildet 48 Nicht-Anker-Karten auf 24 Corner- und 24 Edge-Facelets sowie vier Asse plus zwei Joker auf sechs feste Zentren ab. R,L,U,D,F,B permutieren alle 54 Slots und erfüllen einzeln q⁴=id. Der Schnitt 9|11 ist involutiv, aber nicht typidentisch mit 8 Ecken | 12 Kanten; mindestens ein Cubie kreuzt die Typgrenze.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-31&lt;/b&gt;&lt;strong&gt;Base Translation / Prime Address Pair&lt;/strong&gt;&lt;span&gt;Exakt sind 13³=2197₁₀=1331₁₂, 23³=12167₁₀=2F87₁₆, 97=p₂₅, 67=p₁₉, 83=p₂₃ und 23³−13³=9970=10·p₁₆₈. Die Kette über 2|19|7, Primindizes, 184−101 und 12|1|67 ist eine deklarierte Dezimaladressierung. Der eingefrorene n≤100-Suffixscan besitzt acht Treffer und widerlegt Einzigartigkeit.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-32&lt;/b&gt;&lt;strong&gt;H4 × H5 / Two-Hand Source Lens&lt;/strong&gt;&lt;span&gt;Der Orientation Controller Bench liefert die linke C5-/Hashimoto-Hand; das Tessarec Blue Body Lab liefert die rechte Mapping-/Kontrollhand. Im lokalen Demonstrator hat der C5-Kanal Periode 5 und die gesetzte Kandidatenanzeige P13|P17|P23|C21 Periode 4; ihr gekoppelter Displayrecord kehrt nach 20 Ticks zurück. Das schließt weder H4 noch H5 wissenschaftlich.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-33&lt;/b&gt;&lt;strong&gt;H8 / Record Deck · Club · Control · Stack&lt;/strong&gt;&lt;span&gt;Das bestehende Deck erlaubt eine deklarierte 3+2+1-Lesung aus drei Vinylpositionen, zwei Grammophon-/Schellackpositionen und einer Digital-Klasse. Newton/AM, Leibniz/VM und Goethe/PM bleiben unabhängige Beobachterlinsen. Club nutzt dieselbe Deck-Instanz; Control Room liest denselben bestätigten Carrier ohne zweite Uhr. Der Aperture Stack EP|SI|LP|SH|RT|RETURN ist eine separate Sechs-Platten-Fixture ohne automatische Zeilenabbildung auf die Deckmodi.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-34&lt;/b&gt;&lt;strong&gt;Leaf Fold Demo / Open Book Return Route&lt;/strong&gt;&lt;span&gt;Eine siebenstufige Tour verbindet Source/101, Q-Cut, die eigenständige IOI/Q90×Prime-Foldings-Open-Book-Komposition, den Cube-Pivot, die Zwei-Hand-Linse, H8 und das Ledger. Die beiden HTML-Dateien besitzen einen bidirektionalen Rückweg; ihre Identitäten, Claim Boundaries und Quellrollen bleiben getrennt.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-35&lt;/b&gt;&lt;strong&gt;Q4 Antipode / Window Return&lt;/strong&gt;&lt;span&gt;Dürers &lt;code&gt;R180&lt;/code&gt;-Komplement und das toroidale Khajuraho-&lt;code&gt;T(2,2)&lt;/code&gt;-Komplement sind als zwei getrennte Carrierverträge angeschlossen. Khajuraho besteht die uniforme 2×2-Fensterprüfung; Dürer liefert die beabsichtigte Negativkontrolle.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-36&lt;/b&gt;&lt;strong&gt;LUX / PINK / BLUE Projection Fixtures&lt;/strong&gt;&lt;span&gt;Die drei Wörter sind jetzt im vorhandenen KV-/TESA-Codec direkt wählbar. A1Z26 und deutsche Scrabble-Punkte ohne Bonusfeld werden parallel ausgegeben; Pink und Blue bleiben zugleich verschiedene Wortrecords und zwei Ansichten eines gebundenen Körpers.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-37&lt;/b&gt;&lt;strong&gt;Keystone 9 / White–ALU–Yellow Return&lt;/strong&gt;&lt;span&gt;KEYSTONE_9_WHITE_ALU_PULSE führt als reine Scale-Animation von den drei weißen r8c8-Feldern über A, L, U und den pinken B/ALU-Witness zum gelben Euler-Flächenwitness und zurück nach Weiß. Die Paketrolle 9 kodiert ausschließlich 8·64=512 plus ein mittleres 64er-Paket = 576; sie erzeugt weder eine neue Identität noch einen physikalischen Pulse.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-38&lt;/b&gt;&lt;strong&gt;Keystone Address Card / Algo-L Seam&lt;/strong&gt;&lt;span&gt;Die source-bound Kartenansicht verbindet exakt 121 sichtbare Felder einer 11×11-Fläche, die ersten Primwerte 2,3,5 auf der vorhandenen P13→41-Diagonale, die zwei hervorgehobenen Randsegmente als ↑/→-L-Naht und White r8c8 als Return-Gate. Schwarze Schlitze bleiben Sichtzwischenräume; O₀/Red Balloon bleibt eine offene Owner-Lesung und erzeugt weder neue Zustände noch eine neue Source-Graph-Identität.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-39&lt;/b&gt;&lt;strong&gt;Corner Coordinate Layer / Navigation Order&lt;/strong&gt;&lt;span&gt;Die Navigation ist nach Camera, Maps, Sheets, Paths &amp; Pulses und Inspect sortiert. Acht Model-Viewer-Hotspots adressieren die semantischen Cube-Ecken im Register C=(IA,LR,OU); O₀ ist der Mittelpunkt. ALU=(---) wird über J(v)=−v auf den vorhandenen geometrischen B-Witness (+++) abgebildet. Diese Janus-Brücke ist ein Display-/Adressadapter und weder neue Geometrie noch Zahlenidentität.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-40&lt;/b&gt;&lt;strong&gt;Cube Navigation Rail / Red Balloon Shadow Lens&lt;/strong&gt;&lt;span&gt;Eine horizontale Box direkt unter dem Cube führt BODY/45°, AM/XY, VM/YZ, PM/ZX und RB/O₀ SHADOW. AM bleibt Inside/O₀-Quelle, VM die gerichtete Fuge und PM Inside′/Ghost. Red Balloon bleibt gegenüber diesen drei Sheet-Registern unzugeordnet und bündelt ausschließlich als View-Layer Blue Body, schwarze Zwischenräume, gelbe Adressschicht und roten Schatten. Neue GLB-Geometrie, neue Identität, Relation und physikalischer Schatten-Claim bleiben 0.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-41&lt;/b&gt;&lt;strong&gt;Labelled Cube Tour / Wide Reading Record&lt;/strong&gt;&lt;span&gt;Die linke Cube-Spalte führt eine manuelle Acht-Schritt-Tour BODY → MAP → AM → VM → PM → RED BALLOON → CORNERS → KEYSTONE RETURN. Jeder Schritt hat eine explizite Beschriftung und nutzt nur vorhandene Kamera-, Clip-, Overlay- und Materialzustände. Face Record, Full/Octant, Observers, Grid, Grenztext und Receipt-Links wurden aus der schmalen rechten Bedienleiste in ein breites linkes Leseregister verlegt. Diese redaktionelle Umordnung erzeugt weder Geometrie noch Study, Finding, Identität oder Relation.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-42&lt;/b&gt;&lt;strong&gt;Cube Intro / Primary Tour Entry&lt;/strong&gt;&lt;span&gt;Ein source-bound Intro vor dem Cube erklärt den einen bleibenden 11/9-Träger, die getrennten Farbrollen und die Reihenfolge Schauen → Führen lassen → Prüfen. Der primäre Einstieg startet direkt Schritt 1 der vorhandenen Acht-Schritt-Tour; der zweite Einstieg kehrt in den 101/A0-Kontext zurück. Diese Überleitung ist redaktionelle Orientierung und verändert weder Modellzustand noch Identität, Relation, Claim oder GLB-Geometrie.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;OBS-43&lt;/b&gt;&lt;strong&gt;Slash Window / Shutter Pulse&lt;/strong&gt;&lt;span&gt;Die gemeinsame 101/A0-Startseite liest den Slash als endliche Navigationsfolge 2 → 1 → 2: zwei getrennte Quellfenster öffnen, ein einzelnes Cube-/Münz-/Slash-Pivotfenster übernimmt, danach öffnen die zwei Quellen wieder getrennt. Schwarz markiert ausschließlich den geschlossenen Shutter-Zustand, Gelb den offenen Pivot-Durchgang. Die Folge zählt UI-Fenster und ist weder Division noch Cube-Flächensatz, Merge, neue Identität oder physikalischer Puls.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;protocol-section&quot; aria-labelledby=&quot;hypothesis-title&quot;&gt;
    &lt;div class=&quot;protocol-head&quot;&gt;&lt;div class=&quot;protocol-no&quot;&gt;05 / STATUS&lt;/div&gt;&lt;div&gt;&lt;h2 id=&quot;hypothesis-title&quot;&gt;Hypothesen sind nicht alle gleich weit.&lt;/h2&gt;&lt;p&gt;Der Status bezieht sich nur auf dieses deklarierte Modell. „Exakt“ bedeutet nicht automatisch neu, bedeutsam oder außerhalb der Konstruktion gültig.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;hypothesis-table&quot; role=&quot;table&quot; aria-label=&quot;Hypothesenstatus&quot;&gt;
      &lt;div class=&quot;hypothesis-row head&quot; role=&quot;row&quot;&gt;&lt;span&gt;ID&lt;/span&gt;&lt;span&gt;Status&lt;/span&gt;&lt;span&gt;Aussage&lt;/span&gt;&lt;span&gt;Nächster Test&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H1&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXAKT / LOKAL&lt;/span&gt;&lt;span&gt;Die Summe 18 allein unterscheidet AOB′ und BOA′ nicht; ein Seitenbit rekonstruiert den Record.&lt;/span&gt;&lt;span&gt;Injektivität der vollständigen Encode-/Decode-Map formal notieren.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H2&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXAKT / DEFINIERT&lt;/span&gt;&lt;span&gt;Im gewählten 20er-Ring gilt q=18°, Q90=5q und Q360=20q.&lt;/span&gt;&lt;span&gt;Unterscheiden, welche Orientierungen als Linie und welche als gerichteter Strahl zählen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H3&lt;/b&gt;&lt;span class=&quot;status-model&quot;&gt;MODELL&lt;/span&gt;&lt;span&gt;5V/19K und Short/Long Hundred bilden eine nützliche Silben-Arbeitsfläche.&lt;/span&gt;&lt;span&gt;Alphabet, Tokenregel, Nullmodell und reale Vergleichskorpora vorab festlegen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H4&lt;/b&gt;&lt;span class=&quot;status-open&quot;&gt;OFFEN · LOCAL C5 WITNESS&lt;/span&gt;&lt;span&gt;Die an O gebundenen Wege besitzen möglicherweise eine formal sinnvolle Ihara-nahe Graphlesung. Lokal existiert bereits ein deklarierter C5-Walk mit zehn gerichteten Zuständen und ohne unmittelbaren Rücklauf; das ist ein endlicher Witness, keine allgemeine Ihara-Aussage.&lt;/span&gt;&lt;span&gt;Die vollständige Graphfamilie G, gerichtete Kanten, reduzierte Zyklen, Spektrum und Returnbegriff vorab definieren; Tree-, Permutations- und Composite-Kontrollen dagegen testen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H5&lt;/b&gt;&lt;span class=&quot;status-open&quot;&gt;OFFEN · PREREGISTRATION GATE&lt;/span&gt;&lt;span&gt;Prime Foldings liefern möglicherweise mehr als eine nachträgliche Auswahl schöner Winkel oder Adressen. P13|P17|P23|C21 ist im Zwei-Hand-Player nur eine sichtbare Kandidaten-/Kontrollfolge und keine daraus hergeleitete Prime-Regel.&lt;/span&gt;&lt;span&gt;Selektor, Winkel-/Basisraum, Baseline, Composite-Negativfälle, Vorhersage und Erfolgsmaß vor dem ersten Ergebnis einfrieren; danach blind gegen dieselben Adressen auswerten.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H6&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;HISTORISCH / GEBUNDEN&lt;/span&gt;&lt;span&gt;Drehzahl, Durchmesser und Spielform lassen sich als getypter Record statt als einzelne Zahl führen.&lt;/span&gt;&lt;span&gt;Record als (RPM, Zoll, Release-Klasse, Material, Epoche) formulieren; Ausnahmen ausdrücklich erhalten.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H7&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXISTING VIEW / REUSE&lt;/span&gt;&lt;span&gt;7|8|9 → AM|VM|PM und das Six-Bit Gate sind bereits gebundene A0-View-Verträge.&lt;/span&gt;&lt;span&gt;Die vorhandenen Bench-Receipts zitieren; keine neue Alias- oder Graphrelation erzeugen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H8&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;SOURCE-BOUND MODE LENS&lt;/span&gt;&lt;span&gt;Das vorhandene Plattendeck, die Club-Einbettung und der lesende Control Room tragen eine 3+2+1-Mode-Karte. N/AM, L/VM und G/PM sind wählbare Linsen; I–O–I, A–O–A′ und 1–0–1 bleiben getrennte Projektionen.&lt;/span&gt;&lt;span&gt;Die 3+2+1-Gruppierung gegen den Player-Snapshot prüfen; keinen Deckmodus mit EP|SI|LP|SH|RT|RETURN, einer historischen Spektrentheorie oder einer zweiten Uhr identifizieren. Α→Λ→Ω bleibt Owner-Mnemonik.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H9&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXAKT / BINOMIAL&lt;/span&gt;&lt;span&gt;Für a=10 und b=1 gilt 11³=10³+3·10²·1+3·10·1²+1³=1,000+300+30+1=1,331.&lt;/span&gt;&lt;span&gt;Die allgemeine Identität für weitere ganzzahlige a,b im interaktiven Rechner prüfen; geometrische Rollen und Koeffizienten getrennt halten.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H10&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXAKT / CENTERED SHELL&lt;/span&gt;&lt;span&gt;Für jede Außenkante n≥2 gilt n³=(n−2)³+6(n−2)²+12(n−2)+8; bei n=11 entsteht der 9³-Kern mit 6 Flächen-, 12 Kanten- und 8 Corner-Rollen.&lt;/span&gt;&lt;span&gt;One-sided und centered als zwei verschiedene Partitionen desselben Gesamtvolumens erhalten; ihre Teile nicht identifizieren.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H11&lt;/b&gt;&lt;span class=&quot;status-open&quot;&gt;VIEW / PROJECTION&lt;/span&gt;&lt;span&gt;T/Y, Black Split und 11|12|13 können eine nützliche Glyphen- und Seitenadressierung bilden.&lt;/span&gt;&lt;span&gt;Kamerawinkel, sichtbare Äste und Adressregel einfrieren; Schatten und Highlight als Renderkontrollen führen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H12&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;SEPARATE VIEW&lt;/span&gt;&lt;span&gt;54=8×3+12×2+6×1 und ein binäres Six-Face Gate besitzt 2⁶=64 Records, aber diese zählen einen anderen Cube-Typ.&lt;/span&gt;&lt;span&gt;Keine Übertragung von Rubik-Facelets, Q-Bits oder Zugfolgen auf die Binomialzerlegung ohne explizite Map.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H13&lt;/b&gt;&lt;span class=&quot;status-open&quot;&gt;MECHANICAL LENS / OPEN&lt;/span&gt;&lt;span&gt;Sechs feste Flächenzentren plus ein inneres Center-Joint ergeben im separaten Permutationscube eine Kompass-/Zenith-/Nadir-Lesung.&lt;/span&gt;&lt;span&gt;Nicht auf den 11³-Binomial-Cube projizieren; konkrete Bauform und Mapping separat dokumentieren.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H14&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXISTING FINITE AUDIT&lt;/span&gt;&lt;span&gt;Für das geordnete Wort [R,U] besitzt die separate 54-Facelet-Permutation Ordnung 6; der sechste Tick ist vollständiger Return.&lt;/span&gt;&lt;span&gt;Als Kontrollfall erhalten, nicht als Return-Operator des Binomial Cube lesen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H15&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXAKT / PARITÄT&lt;/span&gt;&lt;span&gt;Bei geradem n liegt das Rasterzentrum am gemeinsamen Vertex von vier Zellen; bei ungeradem n im Zentrum genau einer Zelle.&lt;/span&gt;&lt;span&gt;Koordinaten für n=10 und n=11 explizit notieren und O unabhängig von der Zellenadresse führen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H16&lt;/b&gt;&lt;span class=&quot;status-open&quot;&gt;MODEL / ALIGNMENT&lt;/span&gt;&lt;span&gt;Das feste Mittelfeld einer 3×3-Rubik-Schablone kann als Kompassmarker an O ausgerichtet werden.&lt;/span&gt;&lt;span&gt;Eine explizite Abbildung von 3×3-Zellen auf 10×10- beziehungsweise 11×11-Koordinaten definieren oder die Einbettung verwerfen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H17&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXAKT / BOUNDED TEST&lt;/span&gt;&lt;span&gt;Für zwei mögliche Herkunftskanäle genügt ein binärer Tag zur Rekonstruktion; für m mögliche Herkunftstypen werden mindestens m Tags beziehungsweise ⌈log₂m⌉ Bits benötigt.&lt;/span&gt;&lt;span&gt;Weitere P/N/V/K/Y-Kanäle nur nach eingefrorener Typmenge ergänzen; TESA 4×7 nicht mit dem separaten 4|7-Cut identifizieren.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H18&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXAKT / POWER LAW&lt;/span&gt;&lt;span&gt;Verschachtelte ganzzahlige Pack-Dimensionen multiplizieren ihre Exponenten; die Wertprojektion ist unter Vertauschung von a,b gleich, der Operatorrecord jedoch nur für a=b identisch.&lt;/span&gt;&lt;span&gt;Für Fold, Prime, TESA und Sprachrecords jeweils Domain, Pack-Operator und inverse Typinformation deklarieren, bevor dieselbe Grammatik behauptet wird.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H19&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;LOCAL WITNESS / CONTRACT&lt;/span&gt;&lt;span&gt;Unter dem deklarierten JSON-Adresslistenvertrag ist der Regelrecord kleiner als seine vollständig entfalteten Witnesses und reproduziert sie bytegleich; der gemessene Faktor ist format- und witnessabhängig.&lt;/span&gt;&lt;span&gt;Historische UDF-, NXA- und SCARAB-Dateien nur mit echten Generator-/Exportpaaren, identischem Inhalt und kryptographischen Hashes benchmarken; keine Illustrationsfaktoren übernehmen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H20&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXACT / FINITE CODEC&lt;/span&gt;&lt;span&gt;KV ist eine verlustbehaftete Klassenprojektion; KV plus ein A–L/M–Z-Seitenbit reduziert, beseitigt aber die Faser nicht. Eine vollständige A1Z26- beziehungsweise TESA28-Adresse ist auf A–Z injektiv und besitzt einen eindeutigen Return.&lt;/span&gt;&lt;span&gt;Gegen zufällige Wörter gleicher Länge testen; Y-, Umlaut- und Tokenregeln vor jedem Korpusvergleich einfrieren.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H21&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXACT VECTORS / MODEL VIEW&lt;/span&gt;&lt;span&gt;Die Bewegungsmengen 6, 12, 8 und 24 sowie der inverse Rotationsreturn sind endlich und exakt. T/Y, vier View-Sektoren, FE/EL und Sichtbarkeit sind deklarierte Projektionsmodelle und folgen nicht allein aus dem Logo.&lt;/span&gt;&lt;span&gt;Eine Sichtbarkeitsregel für einen opaken Cube und eine explizite T/Y-Glyphenmetrik definieren; danach Projektion gegen Vollvektor-Return vergleichen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H22&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXACT EMBEDDING / DECLARED B&lt;/span&gt;&lt;span&gt;Die acht Oktanten bilden eine injektive Teilmenge des 64er-Six-Face-Raums. Die Mischung 63/64 zu 1/64 gilt genau dann, wenn B ein einzelner festgelegter Face-Record und A sein 63-elementiges Komplement ist; nach Konditionierung auf Oktanten wird daraus 7/8 zu 1/8.&lt;/span&gt;&lt;span&gt;Prüfen, ob B=ALU aus einer unabhängigen Regel folgt oder nur als ILAU-Endzustand gewählt wurde; Carrier, Sichtbarkeit und Wahrscheinlichkeit getrennt halten.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H23&lt;/b&gt;&lt;span class=&quot;status-open&quot;&gt;R0 GLB / VIEW CONTRACT&lt;/span&gt;&lt;span&gt;Ein gemeinsamer adressierbarer 3D-Träger kann die vier Lesarten synchron zeigen, ohne ihre Operatoren zu identifizieren. Der GLB beweist nur seine eigene endliche Node-, Mesh-, Animations- und Metadatenstruktur.&lt;/span&gt;&lt;span&gt;Für einen späteren dynamischen Test einen Source Record einfrieren, alle vier Views daraus erzeugen und die eindeutige Rückrekonstruktion getrennt prüfen; keine Ansicht darf eine eigene undeclarierte Clock erhalten.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H24&lt;/b&gt;&lt;span class=&quot;status-open&quot;&gt;RAMANUJAN 1729 / ORBIT OPEN&lt;/span&gt;&lt;span&gt;Exakt ist 1729 = 1³+12³ = 9³+10³ sowie die Existenz der drei ausgewählten A-L-U-Endknoten. Nicht etabliert sind die Abbildung „72 in 19“, ihre Identität mit Ramanujan und eine Orbitbahn durch diese Nodes.&lt;/span&gt;&lt;span&gt;Vor einer Orbit-Animation müssen Adressraum, Zuordnung 1729→Nodes, Schrittoperator, Richtung, Periodizität, Return und Negativkontrolle separat deklariert werden. Bis dahin bleibt ORBIT=OFF.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H25&lt;/b&gt;&lt;span class=&quot;status-open&quot;&gt;GHOST 3+1 / VIEW GLYPHS&lt;/span&gt;&lt;span&gt;Die lokale Lesart WORLD₀ + {SUN, MOON, STAR} kann die Mitte und drei Außenrollen als gut unterscheidbare Aktivierungsfolge darstellen. Gezeigt wird nur eine sequenzielle Skalierung an festen Positionen; keine Astronomie, keine Gravitation und kein Orbit.&lt;/span&gt;&lt;span&gt;Für eine spätere Game-Mechanik Rollen, Aktivierungsreihenfolge, Zustandsübergang, Erfolgskriterium und Return definieren. Positionsbewegung bleibt bis zu einem expliziten Operatorvertrag ausgeschaltet.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H26&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;CAMERA VIEW / SAME OBJECT&lt;/span&gt;&lt;span&gt;Outside, Inside 15H und Inside 21H sind drei Kamerapresets desselben GLB. Die beiden Inside-Ansichten machen die zwei Raumrichtungen und ihre Fugen vergleichbar; sie schließen oder öffnen den Cube nicht mechanisch.&lt;/span&gt;&lt;span&gt;Für einen späteren Sichtbarkeitstest Kameramatrix, Near/Far-Clipping, opake Seiten und die exakte Zuordnung 15H/21H zu einer festen Weltachse einfrieren.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H27&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;INSIDE–OUT / VIEW PAIR&lt;/span&gt;&lt;span&gt;Das weiße Return-Feld außen und O₀ Orange innen sind zwei getrennte Material- und Node-Rollen, die im Player als alternierende Fuge A↔B gelesen werden können. Der Puls visualisiert eine Zuordnung, nicht automatisch einen mathematischen Operator.&lt;/span&gt;&lt;span&gt;Vor einer OKO- oder Algo-Lesung Quelle, Alphabet, Richtung, Involution und Return-Regel deklarieren; bis dahin bleiben diese Namen offene Owner-Mnemoniken.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H28&lt;/b&gt;&lt;span class=&quot;status-open&quot;&gt;ADDRESS OVERLAY / OWNER MAP&lt;/span&gt;&lt;span&gt;Die Q-Achse kann 2501 als Source in der Mitte und 5002 als gedoppelten oberen Return darstellen. Rosenbrücke, Ghost 17|19|29, Floor-Origin und 7.83 bleiben getrennte getypte Adressfelder; ihre gemeinsame Dynamik ist nicht etabliert.&lt;/span&gt;&lt;span&gt;Vor der Einladung von Game of Words in World of Games ein Wortrecord-, Token-, Positions-, Übergangs- und Return-Schema festlegen und das Address Overlay nur als lesende Projektion verwenden.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H29&lt;/b&gt;&lt;span class=&quot;status-open&quot;&gt;EDELWEISS / VIEW CLIP&lt;/span&gt;&lt;span&gt;Die sichtbare Folge Binder→7 außen→11 Lift→11 Spiegelreturn→O₀ kann als kontrollierte Animation vorhandener Nodes dargestellt werden. Sie belegt weder eine NLK Shell noch einen physikalischen Seilzug oder einen neuen Operator.&lt;/span&gt;&lt;span&gt;Vor einer Game-Mechanik Zustände, Nachbarschaft, Phasenlage, Amplitude, Return-Kriterium und Negativkontrolle einfrieren; Edelweiß bis dahin als Owner-Mnemonik und View-Clip führen.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H30&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;FINITE VIEW ADAPTER&lt;/span&gt;&lt;span&gt;Unter der deklarierten Fünffeld-Map ist +2 mod 5 eine geschlossene C5-Route, und ihre gewählte Orientierung erfüllt die lokale Hashimoto-Regel ohne unmittelbaren Rücklauf. White→O₀→Ghost und AM/VM/PM sind anschließend gesetzte View- und Seitenrollen, keine Folge des Ihara-Operators.&lt;/span&gt;&lt;span&gt;Vor einer Game- oder Sprachkopplung die fünf Feldadressen, Seitencodierung, Startkante, akzeptierten Zyklen, Tree-/Permutation-Negativkontrollen und eindeutigen Return einfrieren. H5 bleibt eine getrennte offene Prime-Foldings-Hypothese.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H31&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;DISPLAY LOOP / DECLARED PROJECTION&lt;/span&gt;&lt;span&gt;Der 101-Atem ist ein endlicher View-Controller über demselben Fold-Träger: 0° → 90° → 0° mit getrennten Haltephasen. O→0 und A–O–A′→1–0–1 sind gesetzte Darstellungsregeln; der Seitenbit-Verlust bleibt sichtbar und der Slider kann den Zyklus jederzeit unterbrechen.&lt;/span&gt;&lt;span&gt;Vor einer Spielregel die vier Phasenendpunkte, 2200/800/2200/800-ms-Zeiten, Seitenbit-Encode/Decode, Nullfugen-Highlight und Negativkontrollen ohne Aliasnamen einfrieren. Keine natürliche A=1-, Atem-, CD- oder AUNA-Identität ableiten.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H32&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;FINITE BIJECTION / EXPECTED NON-IDENTITY&lt;/span&gt;&lt;span&gt;Die Karten↔Facelet-Map und die vierfache Rückkehr jedes elementaren Quarter-Turns sind im deklarierten Record exakt. Gleiche Mächtigkeit erzeugt keine natürliche Karten-Cube-Identität; 9|11 bleibt von 8|12 typverschieden.&lt;/span&gt;&lt;span&gt;Nur mit einer vorab eingefrorenen Kartenordnung, Zugfolge und Decode-Regel als späteren Spielcodec weiterverwenden. Der 33ᵣ-Operator bleibt undefiniert.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H33&lt;/b&gt;&lt;span class=&quot;status-model&quot;&gt;POST-HOC PRIME ADDRESS / FINITE CENSUS&lt;/span&gt;&lt;span&gt;Die ausgewählte 13³→23³-Kette ist unter ihren deklarierten Dezimalsplits und Primindexoperationen rechnerisch geschlossen. Der n≤100-Scan liefert jedoch acht Treffer für die allgemeinere …|1|Prime-Regel; weder Einzigartigkeit noch eine basisunabhängige Prime-Mechanik folgt.&lt;/span&gt;&lt;span&gt;Vor jeder Erweiterung Parser, Basis, Splitposition, Suchfenster, Subtraktionskonstante und Kontrollfamilie präregistrieren. Prime-Wert, Prime-Index, Basisziffer und Cube-Kapazität getrennte Typen halten.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;hypothesis-row&quot; role=&quot;row&quot;&gt;&lt;b&gt;H34&lt;/b&gt;&lt;span class=&quot;status-exact&quot;&gt;EXACT / TYPED PROJECTIONS&lt;/span&gt;&lt;span&gt;LUX, PINK und BLUE besitzen unter eingefrorenem Alphabet reproduzierbare A1Z26-, KV-, TESA- und deutsche Scrabble-Readouts. Unterschiedliche Scores widersprechen der gemeinsamen Blue/Pink-Carrierrolle nicht, weil Wortrecord und Körperansicht verschiedene Typen sind.&lt;/span&gt;&lt;span&gt;Sprachversion, Steinwerte, Bonusfelder und Tokenisierung vor jedem Vergleich deklarieren; keine Semantik oder Geometrie aus gleicher oder verschiedener Punktzahl ableiten.&lt;/span&gt;&lt;/div&gt;

  &lt;section class=&quot;protocol-section&quot; aria-labelledby=&quot;next-tests-title&quot;&gt;
    &lt;div class=&quot;protocol-head&quot;&gt;&lt;div class=&quot;protocol-no&quot;&gt;06 / NEXT&lt;/div&gt;&lt;div&gt;&lt;h2 id=&quot;next-tests-title&quot;&gt;Nächste erlaubte Prüfungen&lt;/h2&gt;&lt;p&gt;Dies sind Spezifikationsschritte für ein mögliches späteres Intake – keine autorisierten Science-Lab-Runs.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;protocol-grid&quot;&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Next block&lt;/span&gt;&lt;h3&gt;Game of Words → World of Games&lt;/h3&gt;&lt;p&gt;Der Cube-/Pack-/Prime-Block ist dokumentarisch geschlossen. Ein späterer Wortspiel-Intake beginnt separat mit eingefrorenem Alphabet, Tokenrecord, Boardadresse, Zugoperator, Erfolgskriterium und eindeutigem Return; keine automatische Aktivierung.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Formalize&lt;/span&gt;&lt;h3&gt;State Contract&lt;/h3&gt;&lt;p&gt;Zustandsmenge, Flip-Operation, Projektion, Residual/Side-Bit und inverse Map vollständig als endliche Tabelle definieren.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Compare&lt;/span&gt;&lt;h3&gt;Grid Families&lt;/h3&gt;&lt;p&gt;4×4, 5×5, 8×8 und 20×20 anhand derselben Kriterien vergleichen: Zentrum, Diagonalen, Mittelnaht, Rotation und Informationsverlust.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Falsify&lt;/span&gt;&lt;h3&gt;Nullmodelle&lt;/h3&gt;&lt;p&gt;Zufällige Buchstabenbelegung, permutierte Zahlachsen und alternative V/K-Partitionen gegen dieselben Muster- und Return-Kriterien testen.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Expand&lt;/span&gt;&lt;h3&gt;Binomial Cube Family&lt;/h3&gt;&lt;p&gt;(a+b)³ für weitere a,b vergleichen: Volumen, 1–3–3–1-Rollen und den besonderen b³-Corner getrennt ausgeben. 10+1→11 bleibt der Referenzfall.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Discriminate&lt;/span&gt;&lt;h3&gt;Projection / Render Audit&lt;/h3&gt;&lt;p&gt;Dieselbe Cube-Geometrie unter festen Kamerawinkeln und Lichtkontrollen vergleichen: T versus Y, Black Split, White Highlight, Glow und 11|12|13-Adressen getrennt protokollieren.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Type the cube&lt;/span&gt;&lt;h3&gt;Q-Bit Contract&lt;/h3&gt;&lt;p&gt;Sechs Flächenbits als eigenen 64er-Record definieren und explizit vom 54-Facelet-Ledger, ternären 729er-Raum, vollständigen Rubik-Zustand und innerer Mechanik trennen.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Compare words&lt;/span&gt;&lt;h3&gt;Two-Face Orders&lt;/h3&gt;&lt;p&gt;Ausgewählte Zwei-Flächen-Wörter getrennt notieren und ihre Ordnung im vorhandenen Cube-Runner messen. [R,U]⁶ bleibt der gebundene Kontrollfall; keine Periode aus „zwei Seiten“ allein ableiten.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Map centers&lt;/span&gt;&lt;h3&gt;Center Alignment Codec&lt;/h3&gt;&lt;p&gt;10×10-Zellkoordinaten, den zwischenliegenden Punkt O, das 11×11-Mittelfeld und die optionale 3×3-Schablone in einem getypten Mapping einfrieren. &lt;code&gt;11|0&lt;/code&gt; und &lt;code&gt;10|1|0&lt;/code&gt; als verschiedene Cuts testen.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Type origins&lt;/span&gt;&lt;h3&gt;PINKY Channel Cardinality&lt;/h3&gt;&lt;p&gt;Die erlaubten Herkunftstypen von &lt;code&gt;P(i)·N(k)·Y(y)&lt;/code&gt; vorab deklarieren und für jede Projektion messen, wie viele Records auf denselben sichtbaren Wert fallen. Benötigte Tag-Bits aus dieser maximalen Fasergröße bestimmen.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Test operators&lt;/span&gt;&lt;h3&gt;Pack Grammar Crosswalk&lt;/h3&gt;&lt;p&gt;Für jede bestehende A0-Linse prüfen, ob tatsächlich ein kartesischer Pack, eine Iteration, eine geometrische Dimension, eine Flächenzählung oder nur eine visuelle Projektion vorliegt. Nur typgleiche Operatoren dürfen dieselbe Kompositionsregel teilen.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Benchmark pairs&lt;/span&gt;&lt;h3&gt;Historical UDF Pairing&lt;/h3&gt;&lt;p&gt;Ein reales historisches Regel-/Seed-File, den zuständigen Player und einen daraus erzeugten Export als unverändertes Tripel binden. Bytes, Laufzeit, SHA256 und semantische Gleichheit messen; NXA/SCARAB-Provenienz nicht mit dem lokalen JSON-Witness vermischen.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Falsify language&lt;/span&gt;&lt;h3&gt;KV Null Model&lt;/h3&gt;&lt;p&gt;Für echte und zufällig permutierte Wörter gleicher Länge KV-, KV+Seite- und Volladress-Kollisionen vergleichen. Y und Normalisierung vorab einfrieren; keine semantische oder silbische Aussage aus einem bloßen Return ableiten.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Formalize projection&lt;/span&gt;&lt;h3&gt;3D Move / Visibility Contract&lt;/h3&gt;&lt;p&gt;Kameramatrix, opake Flächen, verdeckte Nodes, Fugen, T/Y-Kriterium und inverse Information getrennt definieren. Turm, Flächenläufer, Raumdiagonale und Pferd als verschiedene Generatorfamilien erhalten.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;Test the singleton&lt;/span&gt;&lt;h3&gt;ILAU B-State Null Model&lt;/h3&gt;&lt;p&gt;Den ausgezeichneten Record B vor dem Vergleich einfrieren und gegen alle 63 Alternativen sowie gegen die sieben anderen Oktanten testen. Eine beobachtete Häufigkeit nicht mit der uniformen Zählwahrscheinlichkeit verwechseln.&lt;/p&gt;&lt;/article&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;ioi-leaf-fold&#x27;);
      const slider = root.querySelector(&#x27;#ioi-fold-angle&#x27;);
      const value = root.querySelector(&#x27;#ioi-angle-value&#x27;);
      const state = root.querySelector(&#x27;#ioi-fold-state&#x27;);
      const left = root.querySelector(&#x27;#ioi-left-leaf&#x27;);
      const right = root.querySelector(&#x27;#ioi-right-leaf&#x27;);
      const leftDiag = root.querySelector(&#x27;#ioi-left-diag&#x27;);
      const rightDiag = root.querySelector(&#x27;#ioi-right-diag&#x27;);
      const leftLabel = root.querySelector(&#x27;#ioi-left-label&#x27;);
      const rightLabel = root.querySelector(&#x27;#ioi-right-label&#x27;);
      const angleLabel = root.querySelector(&#x27;#ioi-angle-label&#x27;);
      const zeroSeam = root.querySelector(&#x27;#ioi-zero-seam&#x27;);
      const viewRecord = root.querySelector(&#x27;#ioi-view-record&#x27;);
      const breathButton = root.querySelector(&#x27;#number-game-breathe&#x27;);
      const phaseOutput = root.querySelector(&#x27;#number-game-phase&#x27;);
      const numberRecord = root.querySelector(&#x27;#number-game-record&#x27;);
      const phaseButtons = [...root.querySelectorAll(&#x27;[data-number-phase]&#x27;)];
      let breathFrame = 0;
      let breathStarted = 0;
      let breathing = false;

      function render(angle, save) {
        const radians = angle * Math.PI / 180;
        const halfWidth = 24 + 241 * Math.cos(radians);
        const lx = 360 - halfWidth;
        const rx = 360 + halfWidth;
        const lift = 24 * Math.sin(radians);
        left.setAttribute(&#x27;points&#x27;, `360,70 360,270 ${lx},${270-lift} ${lx},${70+lift}`);
        right.setAttribute(&#x27;points&#x27;, `360,70 ${rx},${70+lift} ${rx},${270-lift} 360,270`);
        leftDiag.setAttribute(&#x27;x1&#x27;, lx);
        leftDiag.setAttribute(&#x27;y1&#x27;, 70 + lift);
        rightDiag.setAttribute(&#x27;x2&#x27;, rx);
        rightDiag.setAttribute(&#x27;y2&#x27;, 270 - lift);
        leftLabel.setAttribute(&#x27;x&#x27;, lx);
        rightLabel.setAttribute(&#x27;x&#x27;, rx);
        value.textContent = `${angle}°`;
        angleLabel.textContent = `${angle}° · Diagonale / Fold`;
        const seamWeight = Math.max(.16, Math.min(1, .16 + .84 * angle / 90));
        zeroSeam.style.opacity = String(seamWeight);
        zeroSeam.style.filter = `drop-shadow(0 0 ${2 + 10 * angle / 90}px rgba(102, 238, 188, ${seamWeight}))`;
        state.setAttribute(&#x27;aria-label&#x27;, `Faltwinkel ${angle} Grad. A und A Strich liegen symmetrisch um den Pin O. Die deklarierte Zahlenprojektion ist 1 0 1.`);
        if (save &amp;&amp; window.openai &amp;&amp; window.openai.setWidgetState) {
          window.openai.setWidgetState({ modelContent: { foldAngle: angle }, privateContent: { foldAngle: angle } }).catch(() =&gt; {});
        }
      }

      const phaseDefinitions = {
        caro: { angle: 0, label: &#x27;CARO · EXPANSION / IN-BREATH&#x27;, record: &#x27;A | O | A′ → 1 | 0 | 1&#x27; },
        &#x27;con-dao&#x27;: { angle: 90, label: &#x27;CON–DAO · Θ / 0-FUGE&#x27;, record: &#x27;1 | [0] | 1 · O→0&#x27; },
        &#x27;au-na&#x27;: { angle: 0, label: &#x27;AU–NA · RETURN / OUT-BREATH&#x27;, record: &#x27;1 | 0 | 1 → A | O | A′&#x27; }
      };

      function selectPhase(key, label, record) {
        phaseButtons.forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.numberPhase === key)));
        phaseOutput.textContent = label;
        numberRecord.textContent = record;
        viewRecord.textContent = key === &#x27;au-na&#x27; ? &#x27;1 | 0 | 1 ↺&#x27; : &#x27;1 | 0 | 1&#x27;;
      }

      function stopBreath(manualLabel) {
        breathing = false;
        if (breathFrame) cancelAnimationFrame(breathFrame);
        breathFrame = 0;
        breathButton.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
        breathButton.textContent = &#x27;▶ 101 ATEM STARTEN&#x27;;
        if (manualLabel) {
          phaseButtons.forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
          phaseOutput.textContent = manualLabel;
          numberRecord.textContent = &#x27;A | O | A′ → 1 | 0 | 1&#x27;;
          viewRecord.textContent = &#x27;1 | 0 | 1&#x27;;
        }
      }

      function easeBreath(t) {
        return .5 - .5 * Math.cos(Math.PI * Math.max(0, Math.min(1, t)));
      }

      function breathe(now) {
        if (!breathing) return;
        const elapsed = (now - breathStarted) % 6000;
        let angle = 0;
        if (elapsed &lt; 2200) {
          angle = 90 * easeBreath(elapsed / 2200);
          selectPhase(&#x27;caro&#x27;, &#x27;CARO · IN-BREATH · EXPANSION → FOLD&#x27;, &#x27;A | O | A′ → 1 | 0 | 1&#x27;);
        } else if (elapsed &lt; 3000) {
          angle = 90;
          selectPhase(&#x27;con-dao&#x27;, &#x27;CON–DAO · Θ / ZERO HINGE&#x27;, &#x27;1 | [0] | 1 · O→0&#x27;);
        } else if (elapsed &lt; 5200) {
          angle = 90 * (1 - easeBreath((elapsed - 3000) / 2200));
          selectPhase(&#x27;au-na&#x27;, &#x27;AU–NA · OUT-BREATH / RETURN&#x27;, &#x27;1 | 0 | 1 → A | O | A′&#x27;);
        } else {
          angle = 0;
          selectPhase(&#x27;&#x27;, &#x27;DAO · STILLPOINT · 101 RETURN&#x27;, &#x27;A | O | A′ ⇄ 1 | 0 | 1&#x27;);
        }
        const rounded = Math.round(angle);
        slider.value = String(rounded);
        render(rounded, false);
        breathFrame = requestAnimationFrame(breathe);
      }

      const saved = window.openai &amp;&amp; window.openai.widgetState &amp;&amp; window.openai.widgetState.privateContent;
      const initial = saved &amp;&amp; Number.isFinite(Number(saved.foldAngle)) ? Number(saved.foldAngle) : 45;
      slider.value = String(Math.max(0, Math.min(90, initial)));
      render(Number(slider.value), false);
      slider.addEventListener(&#x27;input&#x27;, () =&gt; {
        stopBreath(`MANUAL · ${slider.value}° FOLD`);
        render(Number(slider.value), true);
      });
      breathButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (breathing) {
          stopBreath(`PAUSE · ${slider.value}° FOLD`);
          return;
        }
        breathing = true;
        breathStarted = performance.now();
        breathButton.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
        breathButton.textContent = &#x27;Ⅱ 101 ATEM PAUSIEREN&#x27;;
        breathFrame = requestAnimationFrame(breathe);
      });
      phaseButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const key = button.dataset.numberPhase;
        const next = phaseDefinitions[key];
        if (!next) return;
        stopBreath();
        slider.value = String(next.angle);
        render(next.angle, true);
        selectPhase(key, next.label, next.record);
      }));
      window.addEventListener(&#x27;openai:set_globals&#x27;, event =&gt; {
        const next = event.detail &amp;&amp; event.detail.globals &amp;&amp; event.detail.globals.widgetState;
        const stored = next &amp;&amp; next.privateContent;
        if (stored &amp;&amp; Number.isFinite(Number(stored.foldAngle))) {
          stopBreath();
          slider.value = String(Math.max(0, Math.min(90, Number(stored.foldAngle))));
          render(Number(slider.value), false);
          phaseOutput.textContent = `RESTORED · ${slider.value}° FOLD`;
        }
      });

      const extensionStates = {
        source: { left: &#x27;A&#x27;, right: &#x27;A′&#x27;, record: &#x27;A | O | A′&#x27;, sum: 17, side: &#x27;—&#x27; },
        right: { left: &#x27;A&#x27;, right: &#x27;B′&#x27;, record: &#x27;A | O | B′&#x27;, sum: 18, side: &#x27;R&#x27; },
        left: { left: &#x27;B&#x27;, right: &#x27;A′&#x27;, record: &#x27;B | O | A′&#x27;, sum: 18, side: &#x27;L&#x27; },
        return: { left: &#x27;B&#x27;, right: &#x27;B′&#x27;, record: &#x27;B | O | B′&#x27;, sum: 19, side: &#x27;L+R&#x27; }
      };
      const extensionButtons = [...root.querySelectorAll(&#x27;.state-button&#x27;)];
      const extensionLeft = root.querySelector(&#x27;#extension-left-tile&#x27;);
      const extensionRight = root.querySelector(&#x27;#extension-right-tile&#x27;);
      const extensionRecord = root.querySelector(&#x27;#extension-record&#x27;);
      const extensionSum = root.querySelector(&#x27;#extension-sum&#x27;);
      const extensionSide = root.querySelector(&#x27;#extension-side&#x27;);

      function renderExtension(key) {
        const next = extensionStates[key];
        if (!next) return;
        extensionButtons.forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.state === key)));
        extensionLeft.textContent = next.left;
        extensionRight.textContent = next.right;
        extensionRecord.textContent = next.record;
        extensionSum.textContent = `Σ = ${next.sum}`;
        extensionSide.textContent = `C = ${next.side}`;
      }

      extensionButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; renderExtension(button.dataset.state)));

      const qcutStep = root.querySelector(&#x27;#qcut-step&#x27;);
      const qcutLine = root.querySelector(&#x27;#qcut-line&#x27;);
      const qcutLabel = root.querySelector(&#x27;#qcut-svg-label&#x27;);
      const qcutK = root.querySelector(&#x27;#qcut-k&#x27;);
      const qcutAngle = root.querySelector(&#x27;#qcut-angle&#x27;);
      const qcutPhase = root.querySelector(&#x27;#qcut-phase&#x27;);
      const qcutPresets = [...root.querySelectorAll(&#x27;[data-qstep]&#x27;)];

      function qcutPhaseName(step) {
        if (step === 0) return &#x27;D₀ · source axis&#x27;;
        if (step === 1) return &#x27;Q18 · first cut&#x27;;
        if (step === 2) return &#x27;Q36 · pentagonal bridge&#x27;;
        if (step === 5) return &#x27;Q90 · quarter turn&#x27;;
        if (step === 10) return &#x27;Q180 · counter-axis&#x27;;
        if (step === 20) return &#x27;Q360 · full return&#x27;;
        return `Q${step * 18} · oriented cut`;
      }

      function renderQCut(step) {
        const k = Math.max(0, Math.min(20, Number(step)));
        const degrees = k * 18;
        const radians = (-45 + degrees) * Math.PI / 180;
        const radius = 127;
        const dx = radius * Math.cos(radians);
        const dy = radius * Math.sin(radians);
        qcutLine.setAttribute(&#x27;x1&#x27;, String(160 - dx));
        qcutLine.setAttribute(&#x27;y1&#x27;, String(155 - dy));
        qcutLine.setAttribute(&#x27;x2&#x27;, String(160 + dx));
        qcutLine.setAttribute(&#x27;y2&#x27;, String(155 + dy));
        qcutStep.value = String(k);
        qcutK.textContent = `k = ${k} / 20`;
        qcutAngle.textContent = `θ = ${degrees}°`;
        qcutPhase.textContent = qcutPhaseName(k);
        qcutLabel.textContent = qcutPhaseName(k);
        qcutPresets.forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(Number(button.dataset.qstep) === k)));
      }

      qcutStep.addEventListener(&#x27;input&#x27;, () =&gt; renderQCut(qcutStep.value));
      qcutPresets.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; renderQCut(button.dataset.qstep)));
      renderQCut(1);

      const binomialBase = root.querySelector(&#x27;#binomial-base&#x27;);
      const binomialAddition = root.querySelector(&#x27;#binomial-addition&#x27;);
      const binomialFormat = new Intl.NumberFormat(&#x27;en-US&#x27;);
