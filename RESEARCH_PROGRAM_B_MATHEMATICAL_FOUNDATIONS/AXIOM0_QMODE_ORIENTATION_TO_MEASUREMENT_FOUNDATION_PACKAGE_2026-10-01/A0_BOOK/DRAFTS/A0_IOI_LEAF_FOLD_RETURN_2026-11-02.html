  &lt;section class=&quot;extension&quot; aria-labelledby=&quot;extension-title&quot;&gt;
    &lt;div class=&quot;extension-kicker&quot;&gt;PARKED READING LENS · EXISTING MISSION-CONTROL TITLE · NO ACTIVATION&lt;/div&gt;
    &lt;h2 id=&quot;extension-title&quot;&gt;IOI / Q90 × Prime Foldings · e&lt;span class=&quot;return-r&quot;&gt;R&lt;/span&gt;weiterung&lt;/h2&gt;
    &lt;p class=&quot;extension-lead&quot;&gt;Vorder- und Rückseite werden als gebundene Records gelesen: &lt;code&gt;A/A′&lt;/code&gt; vorne, &lt;code&gt;B/B′&lt;/code&gt; hinten. Die A1Z26-Summe ist exakt; Q90, Prime Foldings, CY-Track und das physische Wenden bleiben deklarierte Modell- und Leseebenen.&lt;/p&gt;

    &lt;div class=&quot;extension-layout&quot;&gt;
      &lt;div class=&quot;extension-panel&quot;&gt;
        &lt;h3&gt;17–18–19 · zwei Wege durch dieselbe Mitte&lt;/h3&gt;
        &lt;p&gt;Wähle einen Zustand. &lt;code&gt;AOB′&lt;/code&gt; und &lt;code&gt;BOA′&lt;/code&gt; besitzen beide die Summe 18; erst &lt;code&gt;C=R&lt;/code&gt; oder &lt;code&gt;C=L&lt;/code&gt; hält fest, welches Blatt gewendet wurde.&lt;/p&gt;

        &lt;div class=&quot;state-diamond&quot; role=&quot;group&quot; aria-label=&quot;Leaf-Fold-Zustände 17 bis 19&quot;&gt;
          &lt;button class=&quot;state-button&quot; type=&quot;button&quot; data-state=&quot;source&quot; aria-pressed=&quot;true&quot;&gt;AOA′ = 17&lt;small&gt;SOURCE · beide vorne&lt;/small&gt;&lt;/button&gt;
          &lt;button class=&quot;state-button&quot; type=&quot;button&quot; data-state=&quot;right&quot; aria-pressed=&quot;false&quot;&gt;AOB′ = 18&lt;small&gt;C=R · rechts gewendet&lt;/small&gt;&lt;/button&gt;
          &lt;button class=&quot;state-button&quot; type=&quot;button&quot; data-state=&quot;left&quot; aria-pressed=&quot;false&quot;&gt;BOA′ = 18&lt;small&gt;C=L · links gewendet&lt;/small&gt;&lt;/button&gt;
          &lt;button class=&quot;state-button&quot; type=&quot;button&quot; data-state=&quot;return&quot; aria-pressed=&quot;false&quot;&gt;BOB′ = 19&lt;small&gt;RETURN · beide hinten&lt;/small&gt;&lt;/button&gt;
        &lt;/div&gt;

        &lt;div class=&quot;flip-readout&quot; aria-live=&quot;polite&quot; aria-label=&quot;Gewählter Vorder- und Rückseitenrecord&quot;&gt;
          &lt;div class=&quot;flip-tile&quot; id=&quot;extension-left-tile&quot;&gt;A&lt;/div&gt;
          &lt;div class=&quot;flip-tile pin-tile&quot;&gt;O&lt;/div&gt;
          &lt;div class=&quot;flip-tile&quot; id=&quot;extension-right-tile&quot;&gt;A′&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;flip-meta&quot;&gt;
          &lt;span id=&quot;extension-record&quot;&gt;A | O | A′&lt;/span&gt;
          &lt;span id=&quot;extension-sum&quot;&gt;Σ = 17&lt;/span&gt;
          &lt;span id=&quot;extension-side&quot;&gt;C = —&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;extension-panel&quot;&gt;
        &lt;h3&gt;CY-Track · Side × Readout&lt;/h3&gt;
        &lt;p&gt;&lt;code&gt;C&lt;/code&gt; trägt die Seitenlage; &lt;code&gt;Y&lt;/code&gt; besitzt zwei deklarierte Displayzustände Yellow und Black. Das ergibt vier beobachtbare Kombinationen, ohne C oder Y als neue OLS-Semantik einzuführen.&lt;/p&gt;
        &lt;div class=&quot;cy-grid&quot; aria-label=&quot;Vier Zustände des CY-Tracks&quot;&gt;
          &lt;div class=&quot;cy-cell cy-yellow&quot;&gt;C&lt;sub&gt;L&lt;/sub&gt; × Y&lt;small&gt;links · yellow&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;cy-cell cy-black&quot;&gt;C&lt;sub&gt;L&lt;/sub&gt; × Bk&lt;small&gt;links · black&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;cy-cell cy-yellow&quot;&gt;C&lt;sub&gt;R&lt;/sub&gt; × Y&lt;small&gt;rechts · yellow&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;cy-cell cy-black&quot;&gt;C&lt;sub&gt;R&lt;/sub&gt; × Bk&lt;small&gt;rechts · black&lt;/small&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;math-stack&quot;&gt;
          &lt;div class=&quot;math-row&quot;&gt;&lt;b&gt;Short Hundred · Modellpartition&lt;/b&gt;&lt;code&gt;19K × 5V + 5V = 95 + 5 = 100&lt;/code&gt;&lt;/div&gt;
          &lt;div class=&quot;math-row&quot;&gt;&lt;b&gt;Long Hundred · erweiterte Silbenfläche&lt;/b&gt;&lt;code&gt;(19K + 5V) × 5V = 24 × 5 = 120&lt;/code&gt;&lt;/div&gt;
          &lt;div class=&quot;math-row&quot;&gt;&lt;b&gt;Gemeinsamer Zahlenträger&lt;/b&gt;&lt;code&gt;60 = 6×10 = 5×12 = 3×20 · 120 = 12×10 = 10×12 = 6×20 = 2×60&lt;/code&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;extension-boundary&quot;&gt;&lt;strong&gt;Boundary:&lt;/strong&gt; Exakt sind die endliche Zustandsmenge, die A1Z26-Summen &lt;code&gt;17/18/18/19&lt;/code&gt;, der Kollaps der beiden mittleren Records auf 18 und die angegebenen Produktzerlegungen. Nicht gezeigt sind eine natürliche Sprachgrammatik, eine bevorzugte Alphabetpartition, eine Q90-/Prime-Operatoridentität, eine physische Faltmechanik oder eine OLS-/ORION-Erweiterung.&lt;/div&gt;

    &lt;div class=&quot;qcut&quot; aria-labelledby=&quot;qcut-title&quot;&gt;
      &lt;div class=&quot;qcut-head&quot;&gt;
        &lt;div&gt;
          &lt;h3 id=&quot;qcut-title&quot;&gt;Q-Cut · Orientierung um den O-Ring&lt;/h3&gt;
          &lt;p&gt;Die 0°-Diagonale &lt;code&gt;D₀&lt;/code&gt; ist die Ausgangsachse. Ein Q-Schritt rotiert diese Achse um &lt;code&gt;q=18°&lt;/code&gt; um den festen Pin &lt;code&gt;O&lt;/code&gt;. Damit wird aus dem Fold zusätzlich eine Orientierungslinse: Alle Schnitte besitzen denselben Träger, aber eine unterscheidbare Richtung.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class=&quot;qcut-badge&quot;&gt;q = 360° / 20 = 18°&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;qcut-layout&quot;&gt;
        &lt;div class=&quot;qcut-stage&quot; aria-live=&quot;polite&quot;&gt;
          &lt;svg viewBox=&quot;0 0 320 310&quot; role=&quot;img&quot; aria-labelledby=&quot;qcut-svg-title qcut-svg-desc&quot;&gt;
            &lt;title id=&quot;qcut-svg-title&quot;&gt;Rotierender Q-Cut um O&lt;/title&gt;
            &lt;desc id=&quot;qcut-svg-desc&quot;&gt;Eine feste graue Ausgangsdiagonale und ein farbiger, in Schritten von 18 Grad um O rotierender Schnitt.&lt;/desc&gt;
            &lt;circle cx=&quot;160&quot; cy=&quot;155&quot; r=&quot;112&quot; fill=&quot;none&quot; stroke=&quot;var(--border)&quot; stroke-dasharray=&quot;2 8&quot;/&gt;
            &lt;line x1=&quot;70&quot; y1=&quot;245&quot; x2=&quot;250&quot; y2=&quot;65&quot; stroke=&quot;var(--muted-foreground)&quot; stroke-width=&quot;2&quot; opacity=&quot;.42&quot;/&gt;
            &lt;text x=&quot;250&quot; y=&quot;57&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;10&quot;&gt;D₀ · 0°&lt;/text&gt;
            &lt;line id=&quot;qcut-line&quot; x1=&quot;70&quot; y1=&quot;245&quot; x2=&quot;250&quot; y2=&quot;65&quot; stroke=&quot;var(--viz-series-3)&quot; stroke-width=&quot;4&quot; stroke-linecap=&quot;round&quot;/&gt;
            &lt;circle cx=&quot;160&quot; cy=&quot;155&quot; r=&quot;18&quot; fill=&quot;var(--background)&quot; stroke=&quot;var(--foreground)&quot; stroke-width=&quot;3&quot;/&gt;
            &lt;circle cx=&quot;160&quot; cy=&quot;155&quot; r=&quot;7&quot; fill=&quot;var(--viz-series-3)&quot;/&gt;
            &lt;text x=&quot;160&quot; y=&quot;159&quot; fill=&quot;var(--background)&quot; text-anchor=&quot;middle&quot; font-size=&quot;10&quot; font-weight=&quot;800&quot;&gt;O&lt;/text&gt;
            &lt;text id=&quot;qcut-svg-label&quot; x=&quot;160&quot; y=&quot;290&quot; fill=&quot;var(--foreground)&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;650&quot;&gt;Q18 · k=1&lt;/text&gt;
          &lt;/svg&gt;
        &lt;/div&gt;

        &lt;div class=&quot;qcut-controls&quot;&gt;
          &lt;label class=&quot;form-label&quot; for=&quot;qcut-step&quot;&gt;Q-Schritt &lt;span class=&quot;sr-only&quot;&gt;von null bis zwanzig&lt;/span&gt;&lt;/label&gt;
          &lt;input class=&quot;form-range&quot; id=&quot;qcut-step&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;20&quot; step=&quot;1&quot; value=&quot;1&quot;&gt;
          &lt;div class=&quot;qcut-presets&quot; aria-label=&quot;Markante Q-Cut-Schritte&quot;&gt;
            &lt;button type=&quot;button&quot; data-qstep=&quot;0&quot;&gt;D₀&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-qstep=&quot;1&quot; aria-pressed=&quot;true&quot;&gt;Q18&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-qstep=&quot;2&quot;&gt;Q36&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-qstep=&quot;5&quot;&gt;Q90&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-qstep=&quot;10&quot;&gt;Q180&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-qstep=&quot;20&quot;&gt;Q360&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;qcut-readout&quot;&gt;
            &lt;span id=&quot;qcut-k&quot;&gt;k = 1 / 20&lt;/span&gt;
            &lt;span id=&quot;qcut-angle&quot;&gt;θ = 18°&lt;/span&gt;
            &lt;span id=&quot;qcut-phase&quot;&gt;Q18 · first cut&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;qcut-equations&quot;&gt;
            &lt;div&gt;&lt;b&gt;Orientierter Schnitt&lt;/b&gt;&lt;code&gt;Dₖ = Rₒ(k · 18°) D₀&lt;/code&gt;&lt;/div&gt;
            &lt;div&gt;&lt;b&gt;Quarter / Return&lt;/b&gt;&lt;code&gt;Q90 = 5q · Q180 = 10q · Q360 = 20q&lt;/code&gt;&lt;/div&gt;
            &lt;div&gt;&lt;b&gt;Pentagonale Brücke&lt;/b&gt;&lt;code&gt;2q = 36° · 5q = 90°&lt;/code&gt;&lt;/div&gt;
            &lt;div&gt;&lt;b&gt;20er-Richtungsring&lt;/b&gt;&lt;code&gt;20q = 360° → vollständiger Return&lt;/code&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;qcut-ihara&quot;&gt;&lt;strong&gt;Ihara-like perspective — Analogie:&lt;/strong&gt; &lt;code&gt;O&lt;/code&gt; kann als gemeinsamer Basis- und Rückkehrpunkt mehrerer orientierter Wege gelesen werden. Gezeigt wird weder eine Ihara-Zetafunktion noch eine graphentheoretische Herleitung; die Analogie benennt nur die gemeinsame Bindung der Wege an O.&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;ampm-joint&quot; aria-labelledby=&quot;ampm-joint-title&quot;&gt;
        &lt;h3 id=&quot;ampm-joint-title&quot;&gt;Vinyl Format Lens · 33 + II + 45&lt;/h3&gt;
        &lt;p&gt;Historischer Träger und Owner-Lesart bleiben getrennt. &lt;code&gt;33⅓ / 45 / 78 RPM&lt;/code&gt; bezeichnen Drehzahlen; &lt;code&gt;7″ / 10″ / 12″&lt;/code&gt; Durchmesser; LP, Single und EP Spiel- beziehungsweise Veröffentlichungsformen. &lt;code&gt;AM / VM / PM&lt;/code&gt;, &lt;code&gt;Võ&lt;/code&gt; und der „Galgen“ sind die Owner-Perspektive dieses Protokolls, keine Begriffe der Plattenindustrie.&lt;/p&gt;
        &lt;div class=&quot;ampm-rail&quot; role=&quot;img&quot; aria-label=&quot;33 ein Drittel RPM ist über den vorläufigen Owner-Verbinder II VM Võ mit 45 RPM verbunden; die Owner-Addition ergibt 78&quot;&gt;
          &lt;div class=&quot;ampm-node&quot;&gt;&lt;strong&gt;33⅓&lt;/strong&gt;&lt;small&gt;RPM · OWNER LENS: AM&lt;/small&gt;&lt;/div&gt;
          &lt;span class=&quot;ampm-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
          &lt;div class=&quot;ampm-node connector&quot;&gt;&lt;strong&gt;II&lt;/strong&gt;&lt;small&gt;VM / Võ · CONNECTION ROLE&lt;/small&gt;&lt;/div&gt;
          &lt;span class=&quot;ampm-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
          &lt;div class=&quot;ampm-node&quot;&gt;&lt;strong&gt;45&lt;/strong&gt;&lt;small&gt;RPM · OWNER LENS: PM&lt;/small&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;vinyl-result&quot;&gt;&lt;strong&gt;Owner overlay: 33 + 45 = 78 = 80 − 2&lt;/strong&gt;&lt;span&gt;Exakte Ganzzahlarithmetik mit 33, nicht mit der tatsächlichen LP-Drehzahl 33⅓; keine historische Herleitung der 78-RPM-Norm.&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;vinyl-formats&quot;&gt;
          &lt;div class=&quot;vinyl-format&quot;&gt;&lt;b&gt;7″ · 45 RPM&lt;/b&gt;&lt;strong&gt;Single / historische EP&lt;/strong&gt;&lt;small&gt;Die 7″-Extended-Play-45 ist historisch belegt. „Galgen“ bleibt das lokale visuelle Mnemonic dieser Owner-Linse.&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;vinyl-format&quot;&gt;&lt;b&gt;10″ · 78 RPM&lt;/b&gt;&lt;strong&gt;übliche Zuordnung&lt;/strong&gt;&lt;small&gt;10″ und 78 RPM sind häufig gekoppelt. Historische 78er existieren jedoch auch in 12″; Größe und Drehzahl sind keine absolute Eins-zu-eins-Map.&lt;/small&gt;&lt;/div&gt;
          &lt;div class=&quot;vinyl-format&quot;&gt;&lt;b&gt;12″ · 33⅓ RPM&lt;/b&gt;&lt;strong&gt;LP · Long Play&lt;/strong&gt;&lt;small&gt;Die 12″-LP mit 33⅓ RPM ist der klassische Long-Play-Träger. 10″/12″ können als Short/Long-C-Arbeitspaar gelesen werden, aber nur innerhalb der Owner-Linse.&lt;/small&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;p class=&quot;vinyl-sources&quot;&gt;&lt;strong&gt;Existing NEXAH lineage:&lt;/strong&gt; &lt;a href=&quot;../A0_OPIUM.html&quot;&gt;OPIUM / CLUB · Plattenspieler und Relations Player&lt;/a&gt; · &lt;a href=&quot;../A0_ORIENTATION_CONTROLLER_BENCH.html#tesaLissajousWindowRouter&quot;&gt;Cut/Q + TESA · 7|8|9 → AM|VM|PM und Six-Bit Gate&lt;/a&gt;. Die Galgen-/7-Lesung wird als bereits vorhandene Owner-Lesung der geparkten IOI/Q90-Komposition zurückgebunden; das ursprüngliche Composition-HTML war im Repository-Abgleich nicht auffindbar, der Mission-Control-Parking-Record bleibt erhalten. &lt;strong&gt;Historical source notes:&lt;/strong&gt; &lt;a href=&quot;https://www.loc.gov/marc/bibliographic/bd007s.html&quot;&gt;Library of Congress · speed/diameter fields&lt;/a&gt; · &lt;a href=&quot;https://www.loc.gov/programs/national-recording-preservation-plan/tools-and-resources/historical-background/timeline/&quot;&gt;Library of Congress · recorded-sound timeline&lt;/a&gt; · &lt;a href=&quot;https://mads.si.edu/mads/id/NMAH-AC0808_Avakian_George_Transcript&quot;&gt;Smithsonian · 7″ extended-play 45&lt;/a&gt;.&lt;/p&gt;
      &lt;/div&gt;

      &lt;div class=&quot;cube-lens&quot; aria-labelledby=&quot;cube-lens-title&quot;&gt;
        &lt;h3 id=&quot;cube-lens-title&quot;&gt;Binomial Cube · der 11×11×11-Träger&lt;/h3&gt;
        &lt;p&gt;Das gemeinte Cube-Modell ist die räumliche Binomialzerlegung von &lt;code&gt;(a+b)³&lt;/code&gt;. Für &lt;code&gt;a=10&lt;/code&gt; und &lt;code&gt;b=1&lt;/code&gt; entsteht ein Würfel mit Kantenlänge 11: ein 10³-Base-Cube, drei 10²×1-Face-Slabs, drei 10×1²-Edge-Bars und ein 1³-Corner-Cube. Damit wird die Pascal-Zeile &lt;code&gt;1–3–3–1&lt;/code&gt; als Volumenaufteilung sichtbar.&lt;/p&gt;
        &lt;div class=&quot;binomial-cube&quot; aria-labelledby=&quot;binomial-cube-title&quot;&gt;
          &lt;div class=&quot;binomial-stage&quot;&gt;
            &lt;svg viewBox=&quot;0 0 420 330&quot; role=&quot;img&quot; aria-labelledby=&quot;binomial-cube-title binomial-cube-desc&quot;&gt;
              &lt;title id=&quot;binomial-cube-title&quot;&gt;Schematische Zerlegung des Binomial Cube 11 hoch 3&lt;/title&gt;
              &lt;desc id=&quot;binomial-cube-desc&quot;&gt;Ein Grundwürfel, drei cyanfarbene Flächenplatten, drei orange Kantenbalken und ein pinker Eckwürfel stellen die vier Terme der dritten binomischen Formel dar.&lt;/desc&gt;
              &lt;defs&gt;&lt;filter id=&quot;binomial-glow&quot;&gt;&lt;feGaussianBlur stdDeviation=&quot;7&quot; result=&quot;blur&quot;/&gt;&lt;feMerge&gt;&lt;feMergeNode in=&quot;blur&quot;/&gt;&lt;feMergeNode in=&quot;SourceGraphic&quot;/&gt;&lt;/feMerge&gt;&lt;/filter&gt;&lt;/defs&gt;
              &lt;polygon points=&quot;66,92 213,30 354,108 207,171&quot; fill=&quot;color-mix(in srgb,var(--green) 52%,#07131d)&quot; stroke=&quot;var(--green)&quot; stroke-width=&quot;2&quot;/&gt;
              &lt;polygon points=&quot;66,92 207,171 207,292 66,214&quot; fill=&quot;color-mix(in srgb,var(--blue) 32%,#07131d)&quot; stroke=&quot;var(--blue)&quot; stroke-width=&quot;2&quot;/&gt;
              &lt;polygon points=&quot;207,171 354,108 354,230 207,292&quot; fill=&quot;color-mix(in srgb,var(--green) 27%,#07131d)&quot; stroke=&quot;var(--green)&quot; stroke-width=&quot;2&quot;/&gt;
              &lt;path d=&quot;M76 98L344 224&quot; fill=&quot;none&quot; stroke=&quot;var(--background)&quot; stroke-width=&quot;8&quot; opacity=&quot;.72&quot;/&gt;
              &lt;path d=&quot;M221 174L339 124&quot; fill=&quot;none&quot; stroke=&quot;var(--foreground)&quot; stroke-width=&quot;5&quot; opacity=&quot;.9&quot; filter=&quot;url(#binomial-glow)&quot;/&gt;
              &lt;path d=&quot;M66 92L207 171L354 108M207 171V292M66 214L207 292L354 230&quot; fill=&quot;none&quot; stroke=&quot;var(--orange)&quot; stroke-width=&quot;12&quot; stroke-linecap=&quot;square&quot; opacity=&quot;.92&quot;/&gt;
              &lt;polygon points=&quot;194,162 207,156 220,163 220,179 207,185 194,178&quot; fill=&quot;var(--viz-series-4)&quot; stroke=&quot;color-mix(in srgb,var(--viz-series-4) 70%,white)&quot; stroke-width=&quot;2&quot;/&gt;
              &lt;path d=&quot;M207 171L270 153M207 171L252 214M207 171V246&quot; fill=&quot;none&quot; stroke=&quot;var(--background)&quot; stroke-width=&quot;7&quot; stroke-linecap=&quot;round&quot; opacity=&quot;.82&quot;/&gt;
              &lt;circle cx=&quot;207&quot; cy=&quot;171&quot; r=&quot;4&quot; fill=&quot;var(--foreground)&quot;/&gt;
              &lt;path d=&quot;M207 171L295 57&quot; fill=&quot;none&quot; stroke=&quot;var(--viz-series-4)&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;4 4&quot;/&gt;
              &lt;text x=&quot;300&quot; y=&quot;52&quot; fill=&quot;var(--viz-series-4)&quot; font-size=&quot;12&quot; font-weight=&quot;750&quot;&gt;CORNER · b³&lt;/text&gt;
              &lt;text x=&quot;300&quot; y=&quot;68&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;10&quot;&gt;pink / rot · 1³ = 1&lt;/text&gt;
              &lt;text x=&quot;92&quot; y=&quot;63&quot; fill=&quot;var(--green)&quot; font-size=&quot;11&quot; font-weight=&quot;750&quot;&gt;3 FACE SLABS&lt;/text&gt;
              &lt;text x=&quot;15&quot; y=&quot;249&quot; fill=&quot;var(--blue)&quot; font-size=&quot;11&quot; font-weight=&quot;750&quot;&gt;BASE&lt;/text&gt;
              &lt;text x=&quot;254&quot; y=&quot;286&quot; fill=&quot;var(--orange)&quot; font-size=&quot;11&quot; font-weight=&quot;750&quot;&gt;3 EDGE BARS&lt;/text&gt;
              &lt;text x=&quot;260&quot; y=&quot;222&quot; fill=&quot;var(--muted-foreground)&quot; font-size=&quot;10&quot; font-weight=&quot;750&quot;&gt;BLACK SPLIT · T / Y VIEW&lt;/text&gt;
              &lt;text id=&quot;binomial-edge-label&quot; x=&quot;210&quot; y=&quot;319&quot; fill=&quot;var(--foreground)&quot; text-anchor=&quot;middle&quot; font-size=&quot;13&quot; font-weight=&quot;750&quot;&gt;edge = 10 + 1 = 11&lt;/text&gt;
            &lt;/svg&gt;
          &lt;/div&gt;
          &lt;div class=&quot;binomial-control&quot;&gt;
            &lt;h4&gt;Pascal spatialisiert · 1 Cube + 3 Slabs + 3 Bars + 1 Corner&lt;/h4&gt;
            &lt;p&gt;Verändere Base und Addition. Die vier Summanden bleiben durch die Binomialkoeffizienten &lt;code&gt;1,3,3,1&lt;/code&gt; typisiert; nur ihre Volumina ändern sich.&lt;/p&gt;
            &lt;div class=&quot;binomial-modes&quot; role=&quot;group&quot; aria-label=&quot;Zwei Zerlegungen desselben Außenwürfels&quot;&gt;
              &lt;button type=&quot;button&quot; data-binomial-mode=&quot;one&quot; aria-pressed=&quot;true&quot;&gt;10+1 · ONE-SIDED&lt;/button&gt;
              &lt;button type=&quot;button&quot; data-binomial-mode=&quot;shell&quot; aria-pressed=&quot;false&quot;&gt;1+9+1 · CENTERED SHELL&lt;/button&gt;
            &lt;/div&gt;
            &lt;div class=&quot;binomial-sliders&quot;&gt;
              &lt;label for=&quot;binomial-base&quot;&gt;Base &lt;b id=&quot;binomial-base-value&quot;&gt;10&lt;/b&gt;&lt;input class=&quot;form-range&quot; id=&quot;binomial-base&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;20&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
              &lt;label for=&quot;binomial-addition&quot;&gt;Addition &lt;b id=&quot;binomial-addition-value&quot;&gt;1&lt;/b&gt;&lt;input class=&quot;form-range&quot; id=&quot;binomial-addition&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;10&quot; step=&quot;1&quot; value=&quot;1&quot;&gt;&lt;/label&gt;
            &lt;/div&gt;
            &lt;div class=&quot;binomial-identity&quot; id=&quot;binomial-identity&quot;&gt;11³ = (10 + 1)³ = 1,331&lt;/div&gt;
            &lt;div class=&quot;binomial-terms&quot;&gt;
              &lt;div class=&quot;binomial-term base&quot;&gt;&lt;small id=&quot;binomial-base-role&quot;&gt;1 · BASE CUBE&lt;/small&gt;&lt;b id=&quot;binomial-base-term&quot;&gt;10³&lt;/b&gt;&lt;strong id=&quot;binomial-base-result&quot;&gt;1,000&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;binomial-term slab&quot;&gt;&lt;small id=&quot;binomial-slab-role&quot;&gt;3 · FACE SLABS&lt;/small&gt;&lt;b id=&quot;binomial-slab-term&quot;&gt;3·10²·1&lt;/b&gt;&lt;strong id=&quot;binomial-slab-result&quot;&gt;300&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;binomial-term edge&quot;&gt;&lt;small id=&quot;binomial-edge-role&quot;&gt;3 · EDGE BARS&lt;/small&gt;&lt;b id=&quot;binomial-edge-term&quot;&gt;3·10·1²&lt;/b&gt;&lt;strong id=&quot;binomial-edge-result&quot;&gt;30&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;binomial-term corner&quot;&gt;&lt;small id=&quot;binomial-corner-role&quot;&gt;1 · CORNER CUBE&lt;/small&gt;&lt;b id=&quot;binomial-corner-term&quot;&gt;1³&lt;/b&gt;&lt;strong id=&quot;binomial-corner-result&quot;&gt;1&lt;/strong&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;binomial-addresses&quot; aria-live=&quot;polite&quot;&gt;&lt;span&gt;OUTER EDGE&lt;b id=&quot;binomial-outer-readout&quot;&gt;11&lt;/b&gt;&lt;/span&gt;&lt;span&gt;DIAGONAL CELLS&lt;b id=&quot;binomial-diagonal-readout&quot;&gt;11&lt;/b&gt;&lt;/span&gt;&lt;span&gt;INNER FACE&lt;b id=&quot;binomial-inner-readout&quot;&gt;10×10&lt;/b&gt;&lt;/span&gt;&lt;span&gt;VIEW ADDRESSES&lt;b&gt;11 | 12 | 13&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;binomial-boundary&quot; id=&quot;binomial-boundary&quot;&gt;&lt;strong&gt;Rote Kante / pinker Eckpunkt:&lt;/strong&gt; In der referenzierten App heißt der pinke 1×1×1-Block &lt;em&gt;Corner Cube&lt;/em&gt; und trägt &lt;code&gt;b³=1&lt;/code&gt;. Die drei orangefarbenen 10×1×1-Stäbe heißen &lt;em&gt;Edge Bars&lt;/em&gt; und tragen zusammen &lt;code&gt;3ab²=30&lt;/code&gt;. Die visuelle Naht verbindet beide Rollen, ersetzt ihre Typunterscheidung aber nicht.&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;cube-forensics&quot; aria-label=&quot;Getrennte Ebenen der Cube-Beobachtung&quot;&gt;
          &lt;div class=&quot;cube-forensic exact&quot;&gt;&lt;b&gt;EXACT · COUNT&lt;/b&gt;&lt;span&gt;Outer 11, Centered Core 9, Rasterdiagonale 11 Felder, 6 Flächeninnenräume, 12 Kanteninnenräume und 8 Ecken.&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;cube-forensic projection&quot;&gt;&lt;b&gt;PROJECTION · T / Y&lt;/b&gt;&lt;span&gt;Drei räumliche Richtungen treffen am Corner. Die Kamera kann sie als T oder Y lesen; die Glyphe ist eine Ansicht, keine zusätzliche Komponente.&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;cube-forensic render&quot;&gt;&lt;b&gt;RENDER · BLACK / WHITE / GLOW&lt;/b&gt;&lt;span&gt;Black Split, weißes Highlight und Gegenglow stammen zunächst aus Schatten, Reflexion und Material. Sie werden nicht als algebraische Summanden gezählt.&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;cube-forensic address&quot;&gt;&lt;b&gt;ADDRESS · 11 / 12 / 13&lt;/b&gt;&lt;span&gt;11 bezeichnet die äußere Rasterkante. 12 und 13 bleiben zwei zusätzliche Corner-Seiten-/View-Adressen, nicht neue Kantenlängen.&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;section class=&quot;center-bridge&quot; aria-labelledby=&quot;center-bridge-title&quot;&gt;
          &lt;div class=&quot;center-bridge-head&quot;&gt;
            &lt;div&gt;&lt;h4 id=&quot;center-bridge-title&quot;&gt;Even/Odd Center Bridge · Blue Floor / Body&lt;/h4&gt;&lt;p&gt;Der blaue &lt;code&gt;10×10&lt;/code&gt;-Body besitzt kein einzelnes Mittelfeld: sein geometrischer Mittelpunkt &lt;code&gt;O&lt;/code&gt; liegt am gemeinsamen Eckpunkt von vier Zellen. Beim ungeraden &lt;code&gt;11×11&lt;/code&gt;-Raster wird daraus ein adressierbares Mittelfeld. Das 3×3-Rubik-Feld dient rechts nur als Orientierungsschablone.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;center-bridge-equation&quot;&gt;4 + O → 1&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;center-bridge-visual&quot;&gt;
            &lt;article class=&quot;center-panel&quot;&gt;&lt;h5&gt;EVEN · 10×10 BODY&lt;/h5&gt;&lt;p&gt;Vier zentrale Zellen um einen gemeinsamen geometrischen Mittelpunkt.&lt;/p&gt;&lt;div class=&quot;center-grid-wrap&quot;&gt;&lt;div class=&quot;center-grid even&quot; data-center-grid=&quot;even&quot; data-size=&quot;6&quot; aria-label=&quot;Schematisches gerades Raster mit vier zentralen Zellen&quot;&gt;&lt;/div&gt;&lt;span class=&quot;center-o&quot;&gt;O&lt;/span&gt;&lt;/div&gt;&lt;/article&gt;
            &lt;div class=&quot;center-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;small&gt;PARITY SHIFT&lt;/small&gt;&lt;/div&gt;
            &lt;article class=&quot;center-panel&quot;&gt;&lt;h5&gt;ODD · 11×11 OUTER&lt;/h5&gt;&lt;p&gt;Ein einzelnes Mittelfeld trägt dieselbe Zentrumslage als Zellenadresse.&lt;/p&gt;&lt;div class=&quot;center-grid-wrap&quot;&gt;&lt;div class=&quot;center-grid odd&quot; data-center-grid=&quot;odd&quot; data-size=&quot;5&quot; aria-label=&quot;Schematisches ungerades Raster mit einem zentralen Feld&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
            &lt;article class=&quot;center-panel&quot;&gt;&lt;h5&gt;MODEL · 3×3 COMPASS&lt;/h5&gt;&lt;p&gt;Rubik-Mitte auf O ausrichten; keine Gleichsetzung der Zellgrößen oder Cube-Typen.&lt;/p&gt;&lt;div class=&quot;center-grid-wrap&quot;&gt;&lt;div class=&quot;center-grid rubik&quot; data-center-grid=&quot;rubik&quot; data-size=&quot;3&quot; aria-label=&quot;Drei-mal-drei Orientierungsschablone mit festem Mittelfeld&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;
          &lt;/div&gt;
          &lt;div class=&quot;center-cuts&quot;&gt;
            &lt;div class=&quot;center-cut&quot;&gt;&lt;b&gt;CUT A · 11 | 0&lt;/b&gt;&lt;span&gt;Ungerade Außenkante plus Zentrumslage O: ein Mittelfeld auf der 11er-Fläche.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;center-cut&quot;&gt;&lt;b&gt;CUT B · 10 | 1 | 0&lt;/b&gt;&lt;span&gt;Gerader 10er-Body, additive 1er-Schale und geometrischer Orientierungspunkt O bleiben getrennte Typen.&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;center-color-rail&quot; role=&quot;img&quot; aria-label=&quot;Farbrail von blauem Körper über grün-cyanfarbene Fläche und orange-rote Kante zum pinken Eckwürfel&quot;&gt;&lt;span class=&quot;body&quot;&gt;BLUE BODY&lt;/span&gt;&lt;span class=&quot;face&quot;&gt;GREEN / CYAN FACE&lt;/span&gt;&lt;span class=&quot;edge&quot;&gt;ORANGE / RED EDGE&lt;/span&gt;&lt;span class=&quot;corner&quot;&gt;PINK CORNER&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;center-boundaries&quot;&gt;
            &lt;div&gt;&lt;b&gt;EXAKT:</b&gt; Bei gerader Kantenlänge liegt das Flächenzentrum zwischen vier Zellen; bei ungerader Kantenlänge ist es das Zentrum einer Zelle. Die verkleinerten Raster sind schematische Darstellungen dieser Parität.&lt;/div&gt;
            &lt;div&gt;&lt;b&gt;MODELL / OFFEN:</b&gt; Eine 3×3-Schablone kann ihr fixes Zentrum an O ausrichten. Daraus folgt weder, dass ein Rubik-Cube als identisches Zellraster im 10er-Body steckt, noch eine neue algebraische Identität.&lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;pinky-test&quot; aria-labelledby=&quot;pinky-test-title&quot;&gt;
          &lt;div class=&quot;pinky-head&quot;&gt;
            &lt;div&gt;&lt;h4 id=&quot;pinky-test-title&quot;&gt;PINKY / Two-Channel Distinction Test&lt;/h4&gt;&lt;p&gt;Der Test prüft die Vermutung „es braucht die 2 zur Unterscheidung“ an zwei endlichen Fällen: Ein nackter Zahlenwert kann seine Herkunft aus &lt;code&gt;P(i)&lt;/code&gt; oder &lt;code&gt;N(k)&lt;/code&gt; verlieren; im vorhandenen TESA-&lt;code&gt;4×7&lt;/code&gt;-Raster unterscheiden zwei Koordinaten alle 28 Innenadressen. &lt;code&gt;Y(y)&lt;/code&gt; bleibt ein zusätzlicher Displayzustand.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;pinky-badge&quot;&gt;P(i) · N(k) · Y(y)&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;pinky-layout&quot;&gt;
            &lt;article class=&quot;pinky-panel&quot;&gt;
              &lt;h5&gt;TEST A · PRIME / NUMBER COLLISION&lt;/h5&gt;
              &lt;p&gt;Wähle Prime-Index &lt;code&gt;i&lt;/code&gt; und Rohzahl &lt;code&gt;k&lt;/code&gt;. Wenn &lt;code&gt;pᵢ=k&lt;/code&gt;, ist die Projektion auf den bloßen Wert mehrdeutig; der Kanalmarker &lt;code&gt;P/N&lt;/code&gt; trennt beide Records.&lt;/p&gt;
              &lt;div class=&quot;pinky-controls&quot;&gt;
                &lt;label&gt;Prime-Index i · &lt;b id=&quot;pinky-i-value&quot;&gt;4&lt;/b&gt;&lt;input id=&quot;pinky-i&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;8&quot; step=&quot;1&quot; value=&quot;4&quot;&gt;&lt;/label&gt;
                &lt;label&gt;Number k · &lt;b id=&quot;pinky-k-value&quot;&gt;7&lt;/b&gt;&lt;input id=&quot;pinky-k&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;20&quot; step=&quot;1&quot; value=&quot;7&quot;&gt;&lt;/label&gt;
              &lt;/div&gt;
              &lt;div class=&quot;pinky-y&quot; role=&quot;group&quot; aria-label=&quot;PINKY Displayzustand&quot;&gt;&lt;button type=&quot;button&quot; data-pinky-y=&quot;Y&quot; aria-pressed=&quot;true&quot;&gt;Y · YELLOW&lt;/button&gt;&lt;button type=&quot;button&quot; data-pinky-y=&quot;Bk&quot; aria-pressed=&quot;false&quot;&gt;Y · BLACK&lt;/button&gt;&lt;/div&gt;
              &lt;div class=&quot;pinky-readouts&quot;&gt;&lt;span&gt;P-CHANNEL&lt;b id=&quot;pinky-p-readout&quot;&gt;P(4)=7&lt;/b&gt;&lt;/span&gt;&lt;span&gt;N-CHANNEL&lt;b id=&quot;pinky-n-readout&quot;&gt;N(7)=7&lt;/b&gt;&lt;/span&gt;&lt;span&gt;Y-STATE&lt;b id=&quot;pinky-y-readout&quot;&gt;Y&lt;/b&gt;&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;pinky-projection collision&quot; id=&quot;pinky-projection&quot; aria-live=&quot;polite&quot;&gt;UNTYPED: 7 = 7 · COLLISION&lt;/div&gt;
              &lt;div class=&quot;pinky-record&quot; id=&quot;pinky-record&quot;&gt;PINKY(4,7,Y) = [P|4→7] [N|7] [Y|Y]&lt;/div&gt;
            &lt;/article&gt;
            &lt;article class=&quot;pinky-panel&quot;&gt;
              &lt;h5&gt;TEST B · EXISTING TESA 4×7&lt;/h5&gt;
              &lt;p&gt;Das bestehende dokumentarische TESA-Raster besitzt vier Reihen, sieben Spalten und die festen Innenadressen 1–28. Klicke eine Zelle: Erst das Paar &lt;code&gt;(r,c)&lt;/code&gt; bestimmt die Position; bei eingefrorenem Carrier kann es verlustfrei zur Einzeladresse &lt;code&gt;a=7r+c+1&lt;/code&gt; flachgelegt werden.&lt;/p&gt;
              &lt;div class=&quot;tesa-mini&quot; id=&quot;pinky-tesa-grid&quot; aria-label=&quot;TESA vier mal sieben Adressraster&quot;&gt;&lt;/div&gt;
              &lt;div class=&quot;tesa-readout&quot; id=&quot;pinky-tesa-readout&quot;&gt;(r=0, c=0) ↔ address 1 / 28&lt;/div&gt;
              &lt;div class=&quot;pinky-record&quot; id=&quot;pinky-tesa-record&quot;&gt;TESA28:[0,0] → 1&lt;/div&gt;
            &lt;/article&gt;
          &lt;/div&gt;
          &lt;div class=&quot;pinky-results&quot;&gt;
            &lt;div class=&quot;pinky-result warn&quot;&gt;&lt;b&gt;SCALAR PROJECTION · FAILS&lt;/b&gt;&lt;span&gt;Im gefrorenen Bereich &lt;code&gt;i=1…8&lt;/code&gt;, &lt;code&gt;k=1…20&lt;/code&gt; gibt es acht Paare mit &lt;code&gt;pᵢ=k&lt;/code&gt;. Der nackte Wert rekonstruiert den Ursprung nicht.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;pinky-result pass&quot;&gt;&lt;b&gt;TWO-TYPE RECORD · PASSES&lt;/b&gt;&lt;span&gt;Für genau zwei mögliche Herkunftskanäle unterscheidet ein binärer Marker &lt;code&gt;P/N&lt;/code&gt; alle geprüften Kollisionen. Innerhalb TESA unterscheidet das Koordinatenpaar alle 28 Zellen.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;pinky-result warn&quot;&gt;&lt;b&gt;UNIVERSAL „2“ · REJECTED&lt;/b&gt;&lt;span&gt;Drei mögliche Herkunftstypen benötigen mindestens drei Tags beziehungsweise zwei Bits. Ein einzelnes Bit genügt daher nicht „immer“, sondern exakt für höchstens zwei Kandidaten.&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;pinky-boundary&quot;&gt;&lt;b&gt;IDENTITY BOUNDARY:&lt;/b&gt; Wiederverwendet wird &lt;code&gt;TESA · 4×7 + external 29 · candidate&lt;/code&gt; als dokumentarischer Adressträger. &lt;code&gt;PINKY&lt;/code&gt; ist hier nur der lokale Name des Testrecords &lt;code&gt;P(i)·N(k)·Y(y)&lt;/code&gt;; keine neue TESA-, Navigator-, Prime- oder Sprachidentität wird erzeugt. Der frühere &lt;code&gt;4|7&lt;/code&gt;-Cut bleibt eine getrennte Skizze und ist nicht das TESA-&lt;code&gt;4×7&lt;/code&gt;-Raster.&lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;power-bench&quot; aria-labelledby=&quot;power-bench-title&quot;&gt;
          &lt;div class=&quot;power-head&quot;&gt;
            &lt;div&gt;&lt;h4 id=&quot;power-bench-title&quot;&gt;Power / Carrier Type Bench · gepackte Dimensionen&lt;/h4&gt;&lt;p&gt;Der lokale Pack-Operator wird als &lt;code&gt;Pack_d(Q)=Q^d&lt;/code&gt; getestet. Verschachtelte Packs können denselben sichtbaren Wert erzeugen, obwohl ihre Operatorrecords verschieden sind. Geometrische Fläche, Volumen, sechs Oberflächen und sechs unabhängige Face-Zustände bleiben getrennte Typen.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;power-law&quot;&gt;(Qᵃ)ᵇ = Qᵃᵇ = (Qᵇ)ᵃ&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;power-controls&quot;&gt;
            &lt;label&gt;Carrier Q · &lt;b id=&quot;power-q-value&quot;&gt;10&lt;/b&gt;&lt;input id=&quot;power-q&quot; type=&quot;range&quot; min=&quot;2&quot; max=&quot;20&quot; step=&quot;1&quot; value=&quot;10&quot;&gt;&lt;/label&gt;
            &lt;label&gt;Inner Pack a · &lt;b id=&quot;power-a-value&quot;&gt;3&lt;/b&gt;&lt;input id=&quot;power-a&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;11&quot; step=&quot;1&quot; value=&quot;3&quot;&gt;&lt;/label&gt;
            &lt;label&gt;Outer Pack b · &lt;b id=&quot;power-b-value&quot;&gt;2&lt;/b&gt;&lt;input id=&quot;power-b&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;11&quot; step=&quot;1&quot; value=&quot;2&quot;&gt;&lt;/label&gt;
          &lt;/div&gt;
          &lt;div class=&quot;power-presets&quot; role=&quot;group&quot; aria-label=&quot;Power Bench presets&quot;&gt;
            &lt;button type=&quot;button&quot; data-power-preset=&quot;10,3,2&quot;&gt;1000² ↔ 100³&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-power-preset=&quot;11,3,1&quot;&gt;11³ · CUBE&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-power-preset=&quot;2,1,11&quot;&gt;Q¹ → Q¹¹&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-power-preset=&quot;10,2,6&quot;&gt;(100)⁶ · FACE STATES&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;power-equations&quot;&gt;
            &lt;article class=&quot;power-equation&quot;&gt;&lt;b&gt;RECORD A · INNER a, OUTER b&lt;/b&gt;&lt;code id=&quot;power-equation-a&quot;&gt;(10³)² = 10⁶&lt;/code&gt;&lt;span id=&quot;power-value-a&quot;&gt;1000² = 1,000,000&lt;/span&gt;&lt;/article&gt;
            &lt;article class=&quot;power-equation&quot;&gt;&lt;b&gt;RECORD B · INNER b, OUTER a&lt;/b&gt;&lt;code id=&quot;power-equation-b&quot;&gt;(10²)³ = 10⁶&lt;/code&gt;&lt;span id=&quot;power-value-b&quot;&gt;100³ = 1,000,000&lt;/span&gt;&lt;/article&gt;
          &lt;/div&gt;
          &lt;div class=&quot;power-verdict&quot;&gt;&lt;span class=&quot;value-pass&quot; id=&quot;power-value-verdict&quot;&gt;VALUE · EQUAL · Q⁶&lt;/span&gt;&lt;span class=&quot;record-warn&quot; id=&quot;power-record-verdict&quot;&gt;RECORD · DISTINCT · (3,2) ≠ (2,3)&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;dimension-ladder&quot; id=&quot;dimension-ladder&quot; role=&quot;group&quot; aria-label=&quot;Dimensionen eins bis elf&quot;&gt;&lt;/div&gt;
          &lt;div class=&quot;dimension-readout&quot; id=&quot;dimension-readout&quot;&gt;Pack₁(10) = 10¹ = 10 · LINE / ONE CHANNEL&lt;/div&gt;
          &lt;div class=&quot;power-types&quot;&gt;
            &lt;div class=&quot;power-type&quot;&gt;&lt;b&gt;SIX SURFACES&lt;/b&gt;&lt;code id=&quot;power-surface&quot;&gt;6·10² = 600&lt;/code&gt;&lt;span&gt;Sechs geometrische Flächen. Die 6 ist ein Koeffizient, kein Exponent.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;power-type&quot;&gt;&lt;b&gt;BODY / CUBE&lt;/b&gt;&lt;code id=&quot;power-volume&quot;&gt;10³ = 1,000&lt;/code&gt;&lt;span&gt;Dreidimensionales Zellvolumen mit Kantenlänge Q.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;power-type&quot;&gt;&lt;b&gt;SIX FACE STATES&lt;/b&gt;&lt;code id=&quot;power-face-states&quot;&gt;(10²)⁶ = 10¹²&lt;/code&gt;&lt;span&gt;Sechs unabhängig konfigurierbare Q²-Face-Records; kein Oberflächeninhalt.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;power-type&quot;&gt;&lt;b&gt;ELEVEN SLOTS&lt;/b&gt;&lt;code id=&quot;power-eleven&quot;&gt;10¹¹&lt;/code&gt;&lt;span&gt;Elffacher Produktraum. Nur Q³ ist im üblichen Sinn ein dreidimensionaler Cube.&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;base-prime-lens&quot; id=&quot;twelve-zero-pack&quot; aria-labelledby=&quot;twelve-zero-pack-title&quot;&gt;
            &lt;h5 id=&quot;twelve-zero-pack-title&quot;&gt;TWELVE-ZERO PACKAGE · SAME VALUE, DIFFERENT RECORDS&lt;/h5&gt;
            &lt;p&gt;Zwölf Dezimalnullen bilden denselben Wert unter vier sichtbaren Gruppierungen. Die Pack-Records bleiben verschieden; nur die Exponentenprodukte stimmen überein.&lt;/p&gt;
            &lt;div class=&quot;zero-pack-grid&quot;&gt;
              &lt;div class=&quot;zero-pack-card&quot;&gt;&lt;b&gt;4 × 3 ZEROS&lt;/b&gt;&lt;code&gt;1 | 000 | 000 | 000 | 000&lt;br&gt;(10³)⁴ = 1000⁴ = 10¹²&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;zero-pack-card&quot;&gt;&lt;b&gt;3 × 4 ZEROS&lt;/b&gt;&lt;code&gt;1 | 0000 | 0000 | 0000&lt;br&gt;(10⁴)³ = 10000³ = 10¹²&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;zero-pack-card&quot;&gt;&lt;b&gt;6 × 2 ZEROS&lt;/b&gt;&lt;code&gt;1 | 00 | 00 | 00 | 00 | 00 | 00&lt;br&gt;(10²)⁶ = 100⁶ = 10¹²&lt;/code&gt;&lt;/div&gt;
              &lt;div class=&quot;zero-pack-card&quot;&gt;&lt;b&gt;2 × 6 ZEROS&lt;/b&gt;&lt;code&gt;1 | 000000 | 000000&lt;br&gt;(10⁶)² = 1000000² = 10¹²&lt;/code&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;power-boundary&quot;&gt;&lt;b&gt;EXACT / BOUNDED:&lt;/b&gt; Für ganzzahliges &lt;code&gt;Q≥2&lt;/code&gt; und positive ganze &lt;code&gt;a,b&lt;/code&gt; gilt &lt;code&gt;(Qᵃ)ᵇ=Qᵃᵇ=(Qᵇ)ᵃ&lt;/code&gt;. Gleich ist der projizierte Wert; verschieden bleiben die geordneten Pack-Records, sofern &lt;code&gt;a≠b&lt;/code&gt;. Das bereits vorhandene Workdesk-Motiv &lt;code&gt;1000²=1 000 000&lt;/code&gt; wird wiederverwendet. Die Übertragung auf Fold, Prime, TESA, Sprache oder Physik ist damit nicht bewiesen.&lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;udf-bench&quot; aria-labelledby=&quot;udf-bench-title&quot;&gt;
          &lt;div class=&quot;udf-head&quot;&gt;
            &lt;div&gt;&lt;h4 id=&quot;udf-bench-title&quot;&gt;UDF · Rule vs Materialization Benchmark&lt;/h4&gt;&lt;p&gt;Ein kleiner kanonischer JSON-Record wird zweimal deterministisch in einen ausdrücklich deklarierten Adresslisten-Witness materialisiert. Gemessen werden UTF-8-Bytes, Zustandszahl, Laufzeit und ein lokaler FNV-1a-Return-Hash. Große Packs werden ab 50.000 Zuständen nicht entfaltet; ihre Größe bleibt eine berechnete Zustandsraumzahl.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;udf-contract&quot;&gt;RULE → GENERATE → HASH&lt;br&gt;→ REPEAT → RETURN&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;udf-presets&quot; role=&quot;group&quot; aria-label=&quot;UDF Benchmark Witnesses&quot;&gt;
            &lt;button type=&quot;button&quot; data-udf-preset=&quot;tesa&quot; aria-pressed=&quot;true&quot;&gt;TESA · 4×7 · 28&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-udf-preset=&quot;cube&quot; aria-pressed=&quot;false&quot;&gt;CUBE · 11³ · 1,331&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-udf-preset=&quot;pinky&quot; aria-pressed=&quot;false&quot;&gt;PINKY · 8×20×2 · 320&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-udf-preset=&quot;pack&quot; aria-pressed=&quot;false&quot;&gt;LIVE PACK · Qᵈ&lt;/button&gt;
          &lt;/div&gt;
          &lt;button class=&quot;udf-action&quot; id=&quot;udf-run&quot; type=&quot;button&quot;&gt;RUN DECLARED WITNESS × 2&lt;/button&gt;
          &lt;div class=&quot;udf-metrics&quot; aria-live=&quot;polite&quot;&gt;
            &lt;div class=&quot;udf-metric&quot;&gt;&lt;small&gt;RULE BYTES&lt;/small&gt;&lt;b id=&quot;udf-rule-bytes&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;udf-metric&quot;&gt;&lt;small&gt;STATES&lt;/small&gt;&lt;b id=&quot;udf-states&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;udf-metric&quot;&gt;&lt;small&gt;WITNESS BYTES&lt;/small&gt;&lt;b id=&quot;udf-material-bytes&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;udf-metric&quot;&gt;&lt;small&gt;BYTE RATIO&lt;/small&gt;&lt;b id=&quot;udf-ratio&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;udf-metric&quot;&gt;&lt;small&gt;GENERATE × 2&lt;/small&gt;&lt;b id=&quot;udf-time&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;udf-metric&quot; id=&quot;udf-return-card&quot;&gt;&lt;small&gt;HASH RETURN&lt;/small&gt;&lt;b id=&quot;udf-return&quot;&gt;—&lt;/b&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;udf-streams&quot;&gt;
            &lt;article class=&quot;udf-stream&quot;&gt;&lt;b&gt;CANONICAL RULE RECORD&lt;/b&gt;&lt;code id=&quot;udf-rule-preview&quot;&gt;—&lt;/code&gt;&lt;/article&gt;
            &lt;article class=&quot;udf-stream&quot;&gt;&lt;b&gt;MATERIALIZED ADDRESS-LIST WITNESS · PREVIEW&lt;/b&gt;&lt;code id=&quot;udf-material-preview&quot;&gt;—&lt;/code&gt;&lt;/article&gt;
          &lt;/div&gt;
          &lt;div class=&quot;udf-receipts&quot;&gt;
            &lt;div class=&quot;udf-receipt&quot;&gt;&lt;b&gt;EXISTING NXA JSON RECEIPT&lt;/b&gt;&lt;span&gt;22,693 bytes · SHA256 c72d8c6c…35ca4&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;udf-receipt&quot;&gt;&lt;b&gt;EXISTING SCARAB JSON RECEIPT&lt;/b&gt;&lt;span&gt;1,555,330 bytes · SHA256 8d23681d…f202e&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;udf-receipt&quot;&gt;&lt;b&gt;EXISTING UDF PRO PLAYER&lt;/b&gt;&lt;span&gt;19,663 bytes · SHA256 6c7327ac…c019&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;udf-boundary&quot;&gt;&lt;b&gt;BENCH BOUNDARY:&lt;/b&gt; Der Bytefaktor gilt ausschließlich zwischen dem hier gezeigten Regel-JSON und seinem unkomprimierten JSON-Adresslisten-Witness. Er misst weder PNG, WAV, GLB noch die historischen NXA-/SCARAB-Dateien. Laufzeit ist eine lokale UI-Beobachtung, FNV-1a ein schneller deterministischer Witness und kein kryptographischer Hash. Die vorhandenen SHA256-Receipts bleiben Provenienz, keine Regel-/Ergebnis-Paarung. Kein allgemeiner UDF-Kompressionsfaktor wird behauptet.&lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;kv-codec&quot; aria-labelledby=&quot;kv-codec-title&quot;&gt;
          &lt;div class=&quot;kv-head&quot;&gt;
            &lt;div&gt;&lt;h4 id=&quot;kv-codec-title&quot;&gt;AOK · KV Codec / Return Test&lt;/h4&gt;&lt;p&gt;Ein Wort wird normalisiert, als Vokal-/Konsonantenfolge projiziert, mit einem A–L/M–Z-Seitenbit ergänzt und schließlich über seine vollständigen 4×7-TESA-Adressen zurückgelesen. Die Kandidatenzahl zeigt den Informationsverlust jeder Stufe.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;kv-contract&quot;&gt;WORD → KV → KV+SIDE&lt;br&gt;→ 4×7 ADDRESS → RETURN&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;kv-controls&quot;&gt;
            &lt;label&gt;&lt;span class=&quot;sr-only&quot;&gt;Wort für KV-Codec&lt;/span&gt;&lt;input class=&quot;kv-input&quot; id=&quot;kv-input&quot; type=&quot;text&quot; value=&quot;AOK&quot; maxlength=&quot;18&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;&lt;/label&gt;
            &lt;div class=&quot;kv-y-toggle&quot; role=&quot;group&quot; aria-label=&quot;Klassifikation von Y&quot;&gt;&lt;button type=&quot;button&quot; data-kv-y=&quot;K&quot; aria-pressed=&quot;true&quot;&gt;Y = K&lt;/button&gt;&lt;button type=&quot;button&quot; data-kv-y=&quot;V&quot; aria-pressed=&quot;false&quot;&gt;Y = V&lt;/button&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;kv-presets&quot; role=&quot;group&quot; aria-label=&quot;KV-Testwörter&quot;&gt;
            &lt;button type=&quot;button&quot; data-kv-word=&quot;AOK&quot; aria-pressed=&quot;true&quot;&gt;AOK&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-kv-word=&quot;IOI&quot; aria-pressed=&quot;false&quot;&gt;IOI&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-kv-word=&quot;TESA&quot; aria-pressed=&quot;false&quot;&gt;TESA&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-kv-word=&quot;RECORD&quot; aria-pressed=&quot;false&quot;&gt;RECORD&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-kv-word=&quot;PINKY&quot; aria-pressed=&quot;false&quot;&gt;PINKY&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-kv-word=&quot;LUX&quot; aria-pressed=&quot;false&quot;&gt;LUX&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-kv-word=&quot;PINK&quot; aria-pressed=&quot;false&quot;&gt;PINK&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-kv-word=&quot;BLUE&quot; aria-pressed=&quot;false&quot;&gt;BLUE&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;kv-metrics&quot; aria-live=&quot;polite&quot;&gt;
            &lt;div class=&quot;kv-metric&quot;&gt;&lt;small&gt;NORMALIZED&lt;/small&gt;&lt;b id=&quot;kv-normalized&quot;&gt;AOK&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;kv-metric&quot;&gt;&lt;small&gt;KV SIGNATURE&lt;/small&gt;&lt;b id=&quot;kv-signature&quot;&gt;VVK&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;kv-metric loss&quot;&gt;&lt;small&gt;KV-ONLY CANDIDATES&lt;/small&gt;&lt;b id=&quot;kv-only-count&quot;&gt;525&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;kv-metric loss&quot;&gt;&lt;small&gt;KV + SIDE CANDIDATES&lt;/small&gt;&lt;b id=&quot;kv-side-count&quot;&gt;54&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;kv-metric&quot;&gt;&lt;small&gt;ADDRESS WORD&lt;/small&gt;&lt;b id=&quot;kv-address-word&quot;&gt;01·15·11&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;kv-metric&quot;&gt;&lt;small&gt;A1Z26 SUM&lt;/small&gt;&lt;b id=&quot;kv-a1z26-sum&quot;&gt;27&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;kv-metric&quot;&gt;&lt;small&gt;SCRABBLE · DE · NO BONUS&lt;/small&gt;&lt;b id=&quot;kv-scrabble-score&quot;&gt;7&lt;/b&gt;&lt;/div&gt;
            &lt;div class=&quot;kv-metric pass&quot; id=&quot;kv-return-card&quot;&gt;&lt;small&gt;FULL RETURN&lt;/small&gt;&lt;b id=&quot;kv-return&quot;&gt;PASS · AOK&lt;/b&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;kv-workbench&quot;&gt;
            &lt;div class=&quot;kv-grid-wrap&quot;&gt;&lt;b&gt;TESA28 · 4×7 ADDRESS GRID&lt;/b&gt;&lt;div class=&quot;kv-grid&quot; id=&quot;kv-grid&quot; aria-label=&quot;Vier mal sieben Buchstabengrid&quot;&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;kv-ledger&quot;&gt;&lt;b&gt;LETTER RECORDS · CHAR / A1Z26 / TYPE / SIDE / ADDRESS&lt;/b&gt;&lt;div class=&quot;kv-records&quot; id=&quot;kv-records&quot;&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;kv-boundary&quot; id=&quot;kv-boundary&quot;&gt;&lt;b&gt;RESULT:&lt;/b&gt; &lt;code&gt;AOK→VVK&lt;/code&gt; ist eine korrekte Typ-Projektion, aber kein invertierbarer Codec: 525 A–Z-Sequenzen besitzen dasselbe KV-Muster. Mit A–L/M–Z-Seite bleiben 54 Kandidaten. Erst die vollständigen TESA28-Adressen rekonstruieren AOK eindeutig. Y ist hier explizit schaltbar; Ä/Ö/Ü/ß werden als AE/OE/UE/SS normalisiert.&lt;/div&gt;
        &lt;/section&gt;
        &lt;section class=&quot;janus-compass&quot; aria-labelledby=&quot;janus-compass-title&quot;&gt;
          &lt;div class=&quot;janus-head&quot;&gt;
            &lt;div&gt;&lt;h4 id=&quot;janus-compass-title&quot;&gt;Janus 7 · Rotating Cube / 3D Chess Compass&lt;/h4&gt;&lt;p&gt;Drei gerichtete Achsenpaare und das Zentrum O bilden sieben Kompassrollen. Turm-, Läufer-, Raumdiagonal- und Pferdevektoren werden im selben drehbaren Cube projiziert; die inverse Rotation prüft den vollständigen Return.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;janus-contract&quot;&gt;VECTOR → ROTATE → PROJECT&lt;br&gt;→ INVERSE ROTATE → RETURN&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;janus-modes&quot; role=&quot;group&quot; aria-label=&quot;3D-Bewegungsklasse&quot;&gt;
            &lt;button type=&quot;button&quot; data-janus-mode=&quot;janus&quot; aria-pressed=&quot;true&quot;&gt;JANUS 7&lt;br&gt;6 + O&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-janus-mode=&quot;king&quot; aria-pressed=&quot;false&quot;&gt;KING 26&lt;br&gt;6+12+8&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-janus-mode=&quot;rook&quot; aria-pressed=&quot;false&quot;&gt;ROOK 6&lt;br&gt;AXES&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-janus-mode=&quot;bishop&quot; aria-pressed=&quot;false&quot;&gt;BISHOP 12&lt;br&gt;FACE DIAG&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-janus-mode=&quot;corner&quot; aria-pressed=&quot;false&quot;&gt;CORNER 8&lt;br&gt;SPACE DIAG&lt;/button&gt;
            &lt;button type=&quot;button&quot; data-janus-mode=&quot;knight&quot; aria-pressed=&quot;false&quot;&gt;KNIGHT 24&lt;br&gt;2·1·0&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;janus-views&quot; role=&quot;group&quot; aria-label=&quot;Projektionsansicht&quot;&gt;

        &lt;section class=&quot;ilau-bridge&quot; aria-labelledby=&quot;glb-world-title&quot;&gt;
          &lt;div class=&quot;ilau-head&quot;&gt;
            &lt;div&gt;&lt;h4 id=&quot;glb-world-title&quot;&gt;Game of Worlds · GLB Inspection Object&lt;/h4&gt;&lt;p&gt;Der IOI-/ILAU-Träger liegt jetzt zusätzlich als reproduzierbarer GLB vor. Number, Word, Graph und World bleiben benannte Projektionen eines gemeinsamen 11er-Carriers; Riemann/Ecke, Ihara/Kante, Euler/Fläche und Fibonacci/45° sind getrennte Beobachterrollen. Eine schaltbare Objektlegende trennt Körper, Rahmen, Kanten, B-Corner, drei aktive ILAU-Nodes, Adresslage, Schnitt, Beobachter und die pulsierende Ghost-3+1-Konstellation. Der Raumansicht-Schalter wechselt am selben Objekt zwischen Outside und zwei Inside-Kamerapresets bei 15H und 21H.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;glb-head-side&quot;&gt;&lt;div class=&quot;ilau-contract&quot;&gt;461 NODES · 19 MESHES&lt;br&gt;8 ANIMATIONS · REGENERATED&lt;/div&gt;&lt;button class=&quot;glb-open-large&quot; type=&quot;button&quot; data-player-fullscreen&gt;3D PLAYER GROSS / VOLLBILD ⛶&lt;/button&gt;&lt;/div&gt;

            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;ONE CARRIER · FOUR READINGS&lt;/b&gt;&lt;code&gt;NUMBER → WORD → GRAPH → WORLD&lt;/code&gt;&lt;span&gt;11×11 sichtbare Außenflächen, farblich abgesetzte 9×9-Innenfelder, 2×2-Zero-Core, grüner Rahmen, orange Kanten und pinker ALU-B-Corner.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;ADDRESSABLE GLB CONTRACT&lt;/b&gt;&lt;code&gt;ALU = 011001 = 25&lt;/code&gt;&lt;span&gt;Node-Namen und GLB-extras erhalten Record, Gewichte 1/64 und 1/8, P13→41, ½-Spiegelebene und die vier Beobachterpositionen.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;RAMANUJAN · OPEN ADDRESS CANDIDATE&lt;/b&gt;&lt;code&gt;1729 = 1³+12³ = 9³+10³&lt;/code&gt;&lt;span&gt;Die drei getrennt aktivierbaren pinken Endknoten sind exakt A, L und U. Ihre Lesart als 1729-/„72 in 19“-Adresse bleibt unkalibriert; der vermutete Orbit ist deshalb im R0-Player ausdrücklich OFF.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;GHOST 3+1 · PULSE CONSTELLATION&lt;/b&gt;&lt;code&gt;WORLD₀ + {SUN, MOON, STAR}&lt;/code&gt;&lt;span&gt;World sitzt als mittlerer Ghost-Node; Sun, Moon und Star sind drei getrennte Satellitenglyphen. Die gesamte Konstellation liegt als sichtbare View-Ebene vor der Frontfläche. Der Clip pulsiert die vier Nodes nacheinander, ohne ihre Positionen zu einer astronomischen Bahn zu verbinden.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;OUTSIDE / INSIDE · TWO ROOM VIEWS&lt;/b&gt;&lt;code&gt;OUTSIDE ↔ INSIDE₁₅H | INSIDE₂₁H&lt;/code&gt;&lt;span&gt;Outside zeigt den geschlossenen Carrier. Die beiden Inside-Presets setzen die Kamera nahe an O und drehen die Azimutrichtung um 90°: Viertel nach / Viertel vor beziehungsweise 15H / 21H. Sie sind zwei Kameraräume desselben GLB, keine zusätzlichen Worlds.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;INSIDE–OUT · FUGE A↔B&lt;/b&gt;&lt;code&gt;RETURN_WHITE außen ↔ O₀_ORANGE innen&lt;/code&gt;&lt;span&gt;Das bislang nur unter Blue Body geführte weiße Return-Feld besitzt nun gemeinsam mit dem separat adressierbaren orangefarbenen O₀-Center einen eigenen Legendeneintrag. Der Clip pulsiert erst die weißen Außenfelder, dann O₀ innen. „OKO“ bleibt bis zu einer formalen Definition eine offene Owner-Mnemonik.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;Q ADDRESS OVERLAY · VIEW ONLY&lt;/b&gt;&lt;code&gt;2501 × 2 = 5002&lt;/code&gt;&lt;span&gt;Ein schaltbares Player-Overlay legt 2501 in die Mitte und 5002 an den oberen Return, bezeichnet die Projektionsdiagonale als Q AXIS, T/Rosenbrücke links und Ghostgons 17·19·29 rechts. EG|1 bleibt ein Level-Origin-/Kontextbit; 7.83 bleibt eine ungebundene Frequenznotiz. Keine dieser Labels verändert GLB-Geometrie oder Game-State.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;EDELWEISS · L-FRAME WOBBLE / MIRROR RETURN&lt;/b&gt;&lt;code&gt;BINDER → 7 OUTER → 11 LIFT → 11 MIRROR RETURN → O₀&lt;/code&gt;&lt;span&gt;Pink bleibt ortsfester Binder. Zwei grüne Balken am oberen rechten L-Frame wippen gegensinnig; sieben Außenfelder pulsen nacheinander, elf Front-Diagonalfelder heben zur Ecke und elf Right-Diagonalfelder geben die Folge gespiegelt an O₀ zurück. Es ist ein sechssekündiger View-Clip und keine etablierte NLK-Shell- oder Bewegungsdynamik.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;IHARA × ROSE C5 · DIRECTED RETURN&lt;/b&gt;&lt;code&gt;FIELDS → 0→2→4→1→3→0 → WHITE → O₀ → GHOST&lt;/code&gt;&lt;span&gt;Fünf deklarierte Frontfelder tragen die exakte Rosenroute +2 mod 5. Ihre fünf Kanten repräsentieren zehn gerichtete Zustände; der ausgewählte Walk besitzt null unmittelbare Rückläufe nach der Hashimoto-Regel. Danach pulsen RETURN_WHITE außen, O₀ Orange innen und die ortsfesten Ghost-Witnesses. Dies ist ein lokaler Adapter zur bestehenden Ihara-/Rose-Arbeit, keine neue Ihara-Aussage.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;KEYSTONE 9 · WHITE / ALU / YELLOW RETURN&lt;/b&gt;&lt;code&gt;WHITE → A → L → U → B/ALU → YELLOW 9 → WHITE&lt;/code&gt;&lt;span&gt;Der endliche Clip skaliert ausschließlich vorhandene Nodes: drei weiße r8c8-Return-Felder, die pinken A/L/U-Endpunkte, den pinken B-Corner und den gelben Euler-Flächenwitness. Gelb 9 bezeichnet nur das mittlere Paket der exakten Zähllinse 8·64=512 und 9·64=576; keine neue Zahlenidentität und kein physikalischer Pulse.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;KEYSTONE ADDRESS CARD · L-SEAM / 121 / 2·3·5 / 0&lt;/b&gt;&lt;code&gt;11×11=121 · P₁,P₂,P₃=2,3,5 · ↑/→ · WHITE r8c8 · O₀&lt;/code&gt;&lt;span&gt;Die gelbe Randfigur wird als ALGO-L-Naht gelesen, die ersten drei Marker der vorhandenen P13→41-Diagonale als 2·3·5 und White r8c8 als Return-Gate. Schwarze Schlitze sind nur Zwischenräume der Kartenansicht. 0/Red Balloon bleibt eine offene Owner-Lesung der O₀-Apertur; keine neue Identität oder Operatorbindung.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;CORNER COORDINATES · SEMANTIC / GEOMETRIC SPLIT&lt;/b&gt;&lt;code&gt;C=(IA,LR,OU) · O₀=(0,0,0) · J(v)=−v&lt;/code&gt;&lt;span&gt;Acht echte 3D-Hotspots tragen ALU, ALO, ARU, ARO, ILU, ILO, IRU und IRO. Der vorhandene B/ALU-Witness liegt geometrisch bei normiert (+++), sein semantischer Record ALU bei (---); die Janus-Inversion wird deshalb als expliziter View-Adapter geführt. Fibonacci-Geländer ist mit Seeds 1,1 definiert; die konkrete Euler-Treppe bleibt bis zur Operatorwahl OPEN.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ilau-equation&quot;&gt;&lt;b&gt;INSIDE / FUGE / INSIDE′ · SIDE BIT&lt;/b&gt;&lt;code&gt;AM/XY = INSIDE · VM/YZ = SEAM · PM/ZX = INSIDE′&lt;/code&gt;&lt;span&gt;AM startet die orange/weiße Inside–Out-Lesung in der 15H-Kamera. VM startet den gerichteten Ihara–Rose-Walk als Fuge. PM startet Ghost 3+1 in der 21H-Kamera als Inside′-Witness. Das Seitenbit unterscheidet Source und Return; die drei Labels bleiben Displayprojektionen, keine kanonischen Operatoren.&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;glb-actions&quot;&gt;&lt;button type=&quot;button&quot; data-player-fullscreen&gt;3D PLAYER GROSS / VOLLBILD ⛶&lt;/button&gt;&lt;a href=&quot;../assets/game-of-worlds-play/ioi-world-cube/a0_ioi_game_of_worlds_r0.glb&quot; download&gt;GLB LADEN ↓&lt;/a&gt;&lt;/div&gt;
          &lt;div class=&quot;ilau-boundary&quot;&gt;&lt;b&gt;R0 / SOURCE-BOUND:&lt;/b&gt; Der GLB ist ein adressierbares Inspektions- und Erzählobjekt nach dem bestehenden GAME-4-LIFE-/Game-of-Worlds-Buildermuster. Ein Legendenklick dimmt die übrigen Materialgruppen, pulsiert die gewählte Gruppe dreimal und hält sie danach im Solo-Fokus. Violet, Red, Ghost 3+1, Inside–Out, Edelweiß und Keystone 9 bleiben getrennte View-Clips. Ihara×Rose bindet fünf vorhandene Frontfeld-Adressen an den exakten C5-Schritt +2 mod 5, führt zehn gerichtete Zustände und zeigt einen Walk ohne Sofort-Rücklauf; White, O₀ und Ghost schließen die deklarierte Return-Ansicht. Keystone 9 ist eine reine Paket-/Zähllinse über vorhandene Nodes; weder 9 noch Euler noch ALU=25 werden zu 2501 umdefiniert. AM/Inside, VM/Fuge und PM/Inside′ sind ein View-/Side-Bit-Vertrag, keine kanonische AM/VM/PM-Dynamik. H5 bleibt die offene Prime-Foldings-Hypothese und wird nicht zur Rosenbrücke umgebunden. Keine neue Ihara-Aussage, Game-Dynamik, NLK-Shell, physische Brücke oder Publikationsfreigabe. Der aktuelle SHA-256 steht im gebundenen GLB-Manifest.&lt;/div&gt;
        &lt;/section&gt;
        &lt;h4 class=&quot;cube-secondary-title&quot;&gt;Separate Nebenlinse · Rubik-Permutation / Six-Face Q-Bit&lt;/h4&gt;
        &lt;p&gt;Der folgende 3×3-Permutationscube bleibt als bereits gebundener A0-Vergleich erhalten. Er ist nicht der hier gemeinte 11×11×11-Binomial-Cube und darf weder dessen Pascal-Zerlegung noch dessen rote/pinke Corner-Rolle ersetzen.&lt;/p&gt;
        &lt;div class=&quot;cube-counts&quot; aria-label=&quot;Exakte Cube-Zählungen&quot;&gt;
          &lt;div class=&quot;cube-count&quot;&gt;&lt;b&gt;8 × 3 = 24&lt;/b&gt;&lt;span&gt;acht Ecksteine · je drei sichtbare Facelets&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;cube-count&quot;&gt;&lt;b&gt;12 × 2 = 24&lt;/b&gt;&lt;span&gt;zwölf Kantensteine · je zwei sichtbare Facelets&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;cube-count&quot;&gt;&lt;b&gt;6 × 1 = 6&lt;/b&gt;&lt;span&gt;sechs feste Mittelfelder · je ein sichtbares Facelet&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;cube-count&quot;&gt;&lt;b&gt;54 = 6 × 9&lt;/b&gt;&lt;span&gt;24 + 24 + 6 · jede Fläche: 4 Ecken + 4 Kanten + 1 Mitte&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;section class=&quot;deck-cube-ledger&quot; id=&quot;deck-cube-ledger&quot; aria-labelledby=&quot;deck-cube-ledger-title&quot;&gt;
          &lt;h4 id=&quot;deck-cube-ledger-title&quot;&gt;Deck ↔ Cube Ledger · deterministic count and return audit&lt;/h4&gt;
          &lt;p&gt;Der Audit prüft eine deklarierte 54-zu-54-Adressierung und sechs elementare Flächendrehungen. Gleiche Mächtigkeit wird dabei nicht als natürliche oder physikalische Identität gewertet.&lt;/p&gt;
          &lt;div class=&quot;deck-cube-tests&quot;&gt;
            &lt;div class=&quot;deck-cube-test&quot;&gt;&lt;b&gt;3³ = 27 = 20 + 6 + 1&lt;/b&gt;&lt;span&gt;8 Ecken + 12 Kanten = 20 bewegliche Cubies; dazu sechs Zentren und ein Core.&lt;/span&gt;&lt;span class=&quot;pass&quot;&gt;PASS · EXACT COUNT&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;deck-cube-test&quot;&gt;&lt;b&gt;52 + 2J = 54&lt;/b&gt;&lt;span&gt;48 Nicht-Anker-Karten plus 4 Asse und 2 Joker entsprechen 48 beweglichen und 6 festen Facelets.&lt;/span&gt;&lt;span class=&quot;pass&quot;&gt;PASS · BIJECTION EXISTS&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;deck-cube-test&quot;&gt;&lt;b&gt;R,L,U,D,F,B · q⁴ = id&lt;/b&gt;&lt;span&gt;Jede getestete Vierteldrehung permutiert alle 54 Slots, bewegt 20 Facelets und kehrt nach vier Schritten exakt zurück.&lt;/span&gt;&lt;span class=&quot;pass&quot;&gt;PASS · EXACT RETURN&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;deck-cube-test&quot;&gt;&lt;b&gt;9|11 ↔ 11|9&lt;/b&gt;&lt;span&gt;Der Seitentausch ist involutiv, aber 9|11 ist nicht typidentisch mit der geometrischen Rubik-Teilung 8 Ecken | 12 Kanten.&lt;/span&gt;&lt;span class=&quot;negative&quot;&gt;EXPECTED NON-IDENTITY · MINIMUM 1 CROSSING&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;deck-cube-map&quot;&gt;&lt;span&gt;&lt;b&gt;48 ORDINARY CARDS&lt;/b&gt;&lt;br&gt;24 declared corner-facelet slots + 24 declared edge-facelet slots&lt;/span&gt;&lt;strong&gt;↔&lt;/strong&gt;&lt;span&gt;&lt;b&gt;4 ACES + 2 JOKERS&lt;/b&gt;&lt;br&gt;6 fixed face-center anchors · U D L R F B&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;deck-cube-verdict&quot;&gt;&lt;b&gt;RESULT · PASS WITH EXPECTED NON-IDENTITY:&lt;/b&gt; Die Karten↔Facelet-Bijektion und der vierfache Quarter-Turn-Return sind exakt. Die 9|11-Lesung ist ein gültiger geordneter 20er-Schnitt, aber keine Ecke/Kante-Typzerlegung. &lt;code&gt;33 = 3×11&lt;/code&gt; ist als Zählbrücke exakt; ein eigener 33ᵣ-Cube-Operator bleibt in diesem Audit undefiniert.&lt;/div&gt;
          &lt;div class=&quot;base-prime-lens&quot; id=&quot;base-prime-address-lens&quot; aria-labelledby=&quot;base-prime-address-title&quot;&gt;
            &lt;h5 id=&quot;base-prime-address-title&quot;&gt;BASE TRANSLATION / PRIME ADDRESS · DECLARED DECIMAL PARSER&lt;/h5&gt;
            &lt;p&gt;Die beiden Binomial-Cube-Ansichten werden als ausgewähltes Paar gelesen. Kubikwert, Basisdarstellung und Primindex sind exakt; der Dezimalsplit und die Subtraktion 101 sind deklarierte Post-hoc-Adressoperatoren.&lt;/p&gt;
            &lt;div class=&quot;base-prime-grid&quot;&gt;
              &lt;div class=&quot;base-prime-card&quot;&gt;&lt;b&gt;(12+1)³ · BASE-12 RETURN&lt;/b&gt;&lt;code&gt;13³ = 2197₁₀ = 1331₁₂&lt;br&gt;21|97 = 3·p₄ | p₂₅&lt;/code&gt;&lt;span&gt;Die Ziffern 1–3–3–1 folgen in Basis 12 exakt aus der binomischen Entwicklung.&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;base-prime-card&quot;&gt;&lt;b&gt;PRIME-INDEX ADDRESS&lt;/b&gt;&lt;code&gt;2|19|7 → p₁|p₈|p₄ → 184&lt;br&gt;184 − 101 = 83 = p₂₃&lt;/code&gt;&lt;span&gt;Der Parser ist vollständig deklariert, aber nicht basisinvariant und nicht als natürliche Prime-Mechanik behauptet.&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;base-prime-card&quot;&gt;&lt;b&gt;(16+7)³ · SECOND CUBE&lt;/b&gt;&lt;code&gt;23³ = 12167₁₀ = 2F87₁₆&lt;br&gt;12|1|67 · 67 = p₁₉&lt;/code&gt;&lt;span&gt;Der zweite Cube gibt den Index 19 zurück, der im ersten Split als mittleres Primsegment vorkommt.&lt;/span&gt;&lt;/div&gt;
              &lt;div class=&quot;base-prime-card&quot;&gt;&lt;b&gt;CAPACITY DELTA / PACK&lt;/b&gt;&lt;code&gt;23³ − 13³ = 9970&lt;br&gt;9970 = 10·997 · 997 = p₁₆₈&lt;/code&gt;&lt;span&gt;Adressfelder: Prefix +10, Mitte 1→1, Suffix 97→67 = −30; Gesamt +10000−30.&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;address-chain&quot;&gt;13³ → 2|19|7 → 1|8|4 → 184−101 → p₂₃ → 23³ → 12|1|p₁₉ → &lt;strong&gt;19&lt;/strong&gt;&lt;/div&gt;
            &lt;div class=&quot;deck-cube-verdict&quot;&gt;&lt;b&gt;FINITE CENSUS · EXPECTED NON-UNIQUENESS:&lt;/b&gt; Unter der eingefrorenen Regel „Kubikzahl von n enthält eine innere Dezimalziffer 1 und der folgende Suffix ist prim, ohne führende Null“ existieren für &lt;code&gt;2≤n≤100&lt;/code&gt; acht Treffer: &lt;code&gt;8, 13, 17, 23, 49, 58, 73, 83&lt;/code&gt;. Das Paar 13/23 ist daher eine ausgewählte geschlossene Lesung, keine Einzigartigkeit. Die räumliche &lt;code&gt;1+3+3+1=8&lt;/code&gt;-Explosion ist ein Tesseract-Echo; keine Tesserakt-Geometrie oder 4D-Identität.&lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;div class=&quot;cube-bit-panel&quot;&gt;
          &lt;div class=&quot;cube-bit-control&quot;&gt;
            &lt;h4&gt;Six-Face Q-Bit Gate · 2⁶ = 64&lt;/h4&gt;
            &lt;p&gt;Schalte die sechs Flächenbits U, D, L, R, F und B. Das ist ein endlicher Face-Center-Record, nicht der vollständige Bewegungszustand des Puzzles.&lt;/p&gt;
            &lt;div class=&quot;cube-bit-buttons&quot; role=&quot;group&quot; aria-label=&quot;Sechs binäre Flächenbits&quot;&gt;
              &lt;button type=&quot;button&quot; data-cube-bit=&quot;0&quot; aria-pressed=&quot;false&quot;&gt;U · 0&lt;/button&gt;
              &lt;button type=&quot;button&quot; data-cube-bit=&quot;1&quot; aria-pressed=&quot;false&quot;&gt;D · 0&lt;/button&gt;
              &lt;button type=&quot;button&quot; data-cube-bit=&quot;2&quot; aria-pressed=&quot;false&quot;&gt;L · 0&lt;/button&gt;
              &lt;button type=&quot;button&quot; data-cube-bit=&quot;3&quot; aria-pressed=&quot;false&quot;&gt;R · 0&lt;/button&gt;
              &lt;button type=&quot;button&quot; data-cube-bit=&quot;4&quot; aria-pressed=&quot;false&quot;&gt;F · 0&lt;/button&gt;
              &lt;button type=&quot;button&quot; data-cube-bit=&quot;5&quot; aria-pressed=&quot;false&quot;&gt;B · 0&lt;/button&gt;
            &lt;/div&gt;
            &lt;div class=&quot;cube-bit-readout&quot;&gt;&lt;span id=&quot;cube-bit-word&quot;&gt;000000&lt;/span&gt;&lt;span id=&quot;cube-bit-index&quot;&gt;state 0 / 63&lt;/span&gt;&lt;span id=&quot;cube-bit-signed&quot;&gt;− − − − − −&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cube-bit-ledger&quot;&gt;
            &lt;h4&gt;Bit, Tri-State und Mitteljoint getrennt halten&lt;/h4&gt;
            &lt;p&gt;Der Ausdruck &lt;code&gt;±0,1&lt;/code&gt; braucht einen festgelegten Zustandstyp. Drei verschiedene Lesarten führen zu verschiedenen Räumen.&lt;/p&gt;
            &lt;div class=&quot;cube-type-table&quot;&gt;
              &lt;div&gt;&lt;b&gt;BINÄR&lt;/b&gt;&lt;span&gt;&lt;code&gt;bᵢ∈{0,1}&lt;/code&gt; auf sechs Flächen → &lt;code&gt;2⁶=64&lt;/code&gt; Records.&lt;/span&gt;&lt;/div&gt;
              &lt;div&gt;&lt;b&gt;SIGNED BINARY&lt;/b&gt;&lt;span&gt;&lt;code&gt;sᵢ∈{−1,+1}&lt;/code&gt; → ebenfalls &lt;code&gt;2⁶=64&lt;/code&gt;; 0 ist dann kein Zustand.&lt;/span&gt;&lt;/div&gt;
              &lt;div&gt;&lt;b&gt;TRINARY&lt;/b&gt;&lt;span&gt;&lt;code&gt;qᵢ∈{−1,0,+1}&lt;/code&gt; → &lt;code&gt;3⁶=729&lt;/code&gt;, nicht 64.&lt;/span&gt;&lt;/div&gt;
              &lt;div&gt;&lt;b&gt;CORNER LAYER&lt;/b&gt;&lt;span&gt;&lt;code&gt;8×3=24&lt;/code&gt; zählt Eck-Facelets; es ist keine Zustandszahl des Six-Bit Gates.&lt;/span&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;cube-return-bench&quot; aria-labelledby=&quot;cube-return-title&quot;&gt;
          &lt;div class=&quot;cube-return-visual&quot;&gt;
            &lt;h4 id=&quot;cube-return-title&quot;&gt;Two-Face Return · vorhandener ALGO-Witness&lt;/h4&gt;
            &lt;p&gt;Die sechs 3×3-Flächen werden hier nur als Orientierungsnetz gezeigt. Cyan markiert &lt;code&gt;U&lt;/code&gt;, Pink &lt;code&gt;R&lt;/code&gt;; die tatsächliche 54-Facelet-Permutation und ihr Receipt bleiben im bestehenden Orientation Controller Bench.&lt;/p&gt;
            &lt;div class=&quot;cube-net&quot; role=&quot;img&quot; aria-label=&quot;Netz aus sechs Würfelflächen; U und R sind als die beiden Flächen des Kommutators markiert&quot;&gt;
              &lt;div class=&quot;cube-face-mini&quot; data-face=&quot;U&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;b&gt;U&lt;/b&gt;&lt;/div&gt;
              &lt;div class=&quot;cube-face-mini&quot; data-face=&quot;L&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;b&gt;L&lt;/b&gt;&lt;/div&gt;
              &lt;div class=&quot;cube-face-mini&quot; data-face=&quot;F&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;b&gt;F&lt;/b&gt;&lt;/div&gt;
              &lt;div class=&quot;cube-face-mini&quot; data-face=&quot;R&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;b&gt;R&lt;/b&gt;&lt;/div&gt;
              &lt;div class=&quot;cube-face-mini&quot; data-face=&quot;B&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;b&gt;B&lt;/b&gt;&lt;/div&gt;
              &lt;div class=&quot;cube-face-mini&quot; data-face=&quot;D&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;b&gt;D&lt;/b&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cube-return-control&quot;&gt;
            &lt;h4&gt;Ein Operatorwort wiederholen, bis die Identität zurückkehrt&lt;/h4&gt;
            &lt;p&gt;Ein Tick ist der Zwei-Flächen-Kommutator &lt;code&gt;[R,U]=R U R⁻¹ U⁻¹&lt;/code&gt;. Das bestehende finite Cube-Audit weist für genau dieses Wort Ordnung 6 nach: sechs Ticks beziehungsweise 24 Vierteldrehungen schließen den vollständigen Facelet-Record.&lt;/p&gt;
            &lt;div class=&quot;cube-return-word&quot;&gt;[R,U]&lt;sup id=&quot;cube-return-power&quot;&gt;0&lt;/sup&gt; = &lt;span id=&quot;cube-return-word-state&quot;&gt;identity&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;cube-return-rail&quot; aria-label=&quot;Sieben Positionen von Ausgangszustand null bis Return bei sechs&quot;&gt;
              &lt;span class=&quot;cube-return-tick&quot; data-cube-tick=&quot;0&quot; aria-current=&quot;step&quot;&gt;0 · I&lt;/span&gt;
              &lt;span class=&quot;cube-return-tick&quot; data-cube-tick=&quot;1&quot;&gt;1&lt;/span&gt;
              &lt;span class=&quot;cube-return-tick&quot; data-cube-tick=&quot;2&quot;&gt;2&lt;/span&gt;
              &lt;span class=&quot;cube-return-tick&quot; data-cube-tick=&quot;3&quot;&gt;3&lt;/span&gt;
              &lt;span class=&quot;cube-return-tick&quot; data-cube-tick=&quot;4&quot;&gt;4&lt;/span&gt;
              &lt;span class=&quot;cube-return-tick&quot; data-cube-tick=&quot;5&quot;&gt;5&lt;/span&gt;
              &lt;span class=&quot;cube-return-tick&quot; data-cube-tick=&quot;6&quot;&gt;6 · I&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;cube-return-actions&quot;&gt;&lt;button type=&quot;button&quot; id=&quot;cube-return-step&quot;&gt;+ 1 ALGO TICK&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;cube-return-run&quot;&gt;RUN TO RETURN&lt;/button&gt;&lt;button type=&quot;button&quot; id=&quot;cube-return-reset&quot;&gt;RESET&lt;/button&gt;&lt;/div&gt;
            &lt;div class=&quot;cube-return-readout&quot; aria-live=&quot;polite&quot;&gt;&lt;span id=&quot;cube-return-ticks&quot;&gt;n = 0 / 6&lt;/span&gt;&lt;span id=&quot;cube-return-turns&quot;&gt;0 quarter turns&lt;/span&gt;&lt;span id=&quot;cube-return-state&quot;&gt;IDENTITY · CLOSED&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;cube-return-note&quot;&gt;&lt;strong&gt;Wichtig:&lt;/strong&gt; „Immer zwei Seiten drehen“ bestimmt noch keine Periode. Erst das genaue geordnete Wort samt Drehrichtung definiert die Permutation. Für andere Wörter kann die Return-Zeit anders sein; endlich ist sie, weil jede legale Zugfolge eine Permutation einer endlichen Zustandsmenge ist.&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;cube-boundary&quot;&gt;&lt;strong&gt;Center / Joint Boundary:&lt;/strong&gt; Der geometrische Würfel besitzt exakt 6 Flächen, 12 Kanten und 8 Ecken; &lt;code&gt;8−12+6=2&lt;/code&gt;. Ein inneres Kugel- oder Kompassjoint kann als siebte konstruktive Rolle modelliert werden, gehört aber nicht als siebte Fläche zur Würfeloberfläche. &lt;code&gt;6+1=7&lt;/code&gt; zählt sechs Flächenrollen plus ein Center-Joint; &lt;code&gt;6+7=13&lt;/code&gt; ist bei Beschriftung des Centers mit 7 eine exakte Labelsumme, keine Komponentenanzahl. Reale Cube-Mechanismen variieren; „kugelförmiger Hohlraum“ und „Kugelgelenk“ bleiben ohne konkrete Bauform eine mechanische Analogie.&lt;/div&gt;
        &lt;p class=&quot;cube-sources&quot;&gt;&lt;strong&gt;Sources / Return:&lt;/strong&gt; &lt;a href=&quot;https://themathematics.app/app/worlds/cubes-app?v=d1c5147f4af2&quot;&gt;The Mathematics · Visual Cubes / The Binomial Cube&lt;/a&gt; · Owner screenshot 02.11.2026 · &lt;a href=&quot;../A0_ORIENTATION_CONTROLLER_BENCH.html#sixFaceRainbowTube&quot;&gt;NEXAH Bench · separate 54-Facelet Cube Orbit, [R,U]⁶ Return und Receipt&lt;/a&gt; · &lt;a href=&quot;../A0_ORIENTATION_CONTROLLER_BENCH.html#tesaLissajousWindowRouter&quot;&gt;NEXAH Bench · separates Six-Bit Gate&lt;/a&gt; · &lt;a href=&quot;https://rubiks.com/solve-guide&quot;&gt;Rubik’s official guide · center, edge and corner piece roles&lt;/a&gt; · &lt;a href=&quot;https://mathworld.wolfram.com/Cube.html&quot;&gt;MathWorld · cube V/E/F counts&lt;/a&gt;.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;protocol-section&quot; id=&quot;q4-antipode-ledger&quot; aria-labelledby=&quot;q4-antipode-title&quot;&gt;
    &lt;div class=&quot;protocol-head&quot;&gt;&lt;div class=&quot;protocol-no&quot;&gt;03c / Q4 WINDOW&lt;/div&gt;&lt;div&gt;&lt;h2 id=&quot;q4-antipode-title&quot;&gt;Antipoden und Fenster · die Buchhaltung wird sichtbar.&lt;/h2&gt;&lt;p&gt;Der Cube öffnet hier keinen neuen Carrier. Er reicht in den vorhandenen Q4-Prüfstand weiter: Dürer und Khajuraho bleiben getrennte Platzierungen; Komplement, Fensteradresse, Randregel, Residual und Return werden gemeinsam gelesen.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;protocol-grid&quot;&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;DÜRER · PLANAR&lt;/span&gt;&lt;h3&gt;x ↔ 17−x · R180&lt;/h3&gt;&lt;p&gt;Zeilen, Spalten und beide Hauptdiagonalen ergeben 34. Gegenüberliegende Zellen ergänzen sich zu 17. Die planaren 2×2-Fenster sind jedoch nicht alle gleich: der Carrier hält Magie, nicht Fensteruniformität.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;KHAJURAHO · TOROIDAL&lt;/span&gt;&lt;h3&gt;v ↔ 15−v · T(2,2)&lt;/h3&gt;&lt;p&gt;Alle toroidalen 2×2-Fenster summieren sich zu 34. Die toroidalen 3×3-Fenster erzeugen die Werte 69…84 genau einmal. Antipode bedeutet hier deklarierter Gegenoperator – nicht universell „immer gegenüber“ ohne Carriervertrag.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;VIEW CONTROL&lt;/span&gt;&lt;h3&gt;Blue ↔ Pink · same carrier, different cut&lt;/h3&gt;&lt;p&gt;Blue und Pink bleiben zwei Ansichten desselben gebundenen Körpers. Ihre Farben, Kameras und Wortwerte dürfen verschieden sein; der Return muss Carrier-Adresse und View-Tag getrennt bewahren.&lt;/p&gt;&lt;/article&gt;
      &lt;article class=&quot;protocol-card&quot;&gt;&lt;span class=&quot;tag&quot;&gt;WORD FIXTURES · DE&lt;/span&gt;&lt;h3&gt;LUX 57 / 11 · PINK 50 / 10 · BLUE 40 / 7&lt;/h3&gt;&lt;p&gt;Jeweils &lt;code&gt;A1Z26 / Scrabble DE&lt;/code&gt;, ohne Bonusfelder: LUX = 57/11, PINK = 50/10, BLUE = 40/7. Das sind reproduzierbare Buchstabenprojektionen. Bei LUX bleibt nur &lt;code&gt;L×L+1=2501&lt;/code&gt; die gebundene Adressrechnung; U gehört zum Wortbild.&lt;/p&gt;&lt;/article&gt;
    &lt;/div&gt;
    &lt;div class=&quot;protocol-ledger&quot;&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;Q4-01&lt;/b&gt;&lt;strong&gt;ANTIPODE PASS&lt;/strong&gt;&lt;span&gt;Dürer: &lt;code&gt;x+R180(x)=17&lt;/code&gt;. Khajuraho: &lt;code&gt;v+T(2,2)(v)=15&lt;/code&gt;. Zwei exakte, carriergebundene Involutionen; keine gemeinsame natürliche Identität.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;Q4-02&lt;/b&gt;&lt;strong&gt;WINDOW PASS / NEGATIVE CONTROL&lt;/strong&gt;&lt;span&gt;Khajuraho toroidal 2×2 = 34 für alle 16 Adressen; Dürer planar 2×2 variiert. Genau diese Differenz ist der Kontrollbefund.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;protocol-row&quot;&gt;&lt;b&gt;Q4-03&lt;/b&gt;&lt;strong&gt;PROJECTION PASS&lt;/strong&gt;&lt;span&gt;LUX, PINK und BLUE laufen im vorhandenen KV-/TESA-Codec. A1Z26, Scrabblewert, KV-Signatur und vollständige Adresse bleiben getrennte Readouts; nur die Volladresse liefert den eindeutigen Wort-Return.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;cube-sources&quot;&gt;&lt;strong&gt;Source-bound routes:&lt;/strong&gt; &lt;a href=&quot;../A0_Q4_MAGIC_SQUARE_JOINT_AUDIT.html&quot;&gt;Q4 Audit öffnen ↗&lt;/a&gt; · &lt;a href=&quot;../A0_ORIENTATION_CONTROLLER_BENCH.html#coupledWindowHub&quot;&gt;Moving Aperture · Coupled Window ↗&lt;/a&gt; · &lt;a href=&quot;../A0_BLUE_PINK_DODECA_CELL_RETURN.html#cells&quot;&gt;Blue / Pink Carrier ↗&lt;/a&gt; · &lt;a href=&quot;../A0_WERKBANK.html#numberTowerOrientationLens&quot;&gt;LUX Source Lens ↗&lt;/a&gt;&lt;/p&gt;
