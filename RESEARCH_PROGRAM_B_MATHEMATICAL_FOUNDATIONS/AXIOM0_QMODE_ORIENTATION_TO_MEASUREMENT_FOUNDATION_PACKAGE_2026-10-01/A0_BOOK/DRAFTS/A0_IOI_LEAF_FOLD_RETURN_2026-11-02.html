        &#x27;vinyl-single&#x27;: &#x27;V2 · SINGLE / EP · VINYL · 7″ · 45 · ANALOG&#x27;,
        &#x27;vinyl-manual&#x27;: &#x27;V3 · MANUAL VINYL · FORMAT × UI TEMPO · ANALOG&#x27;,
        &#x27;shellac-78&#x27;: &#x27;S1 · SCHELLACK · 10″ · 78 · GRAMMOPHON&#x27;,
        &#x27;shellac-manual&#x27;: &#x27;S2 · HAND / MANUAL · WIND / READ · GRAMMOPHON&#x27;,
        digital: &#x27;D1 · DIGITAL CLASS · CD / TRACK OR STREAM / QUEUE&#x27;
      };
      const h8Spectra = {
        newton: &#x27;N · AM · NEWTON · SPECTRAL DECOMPOSITION · VIEW ONLY&#x27;,
        leibniz: &#x27;L · VM · LEIBNIZ · RELATIONAL ORDER · VIEW ONLY&#x27;,
        goethe: &#x27;G · PM · GOETHE · BOUNDARY APPEARANCE · VIEW ONLY&#x27;
      };
      const h8ModeButtons = [...root.querySelectorAll(&#x27;[data-h8-mode]&#x27;)];
      const h8SpectrumButtons = [...root.querySelectorAll(&#x27;[data-h8-spectrum]&#x27;)];
      let h8Mode = &#x27;vinyl-lp&#x27;;
      let h8Spectrum = &#x27;leibniz&#x27;;

      function renderH8DeckLens() {
        h8ModeButtons.forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.h8Mode === h8Mode)));
        h8SpectrumButtons.forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.h8Spectrum === h8Spectrum)));
        root.querySelector(&#x27;#h8-mode-readout&#x27;).textContent = h8Modes[h8Mode];
        root.querySelector(&#x27;#h8-spectrum-readout&#x27;).textContent = h8Spectra[h8Spectrum];
      }

      h8ModeButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; { h8Mode = button.dataset.h8Mode; renderH8DeckLens(); }));
      h8SpectrumButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; { h8Spectrum = button.dataset.h8Spectrum; renderH8DeckLens(); }));
      renderH8DeckLens();

      const leafTourSteps = [
        { target: &#x27;#ioi-fold-state&#x27;, label: &#x27;A–O–A′ → 1–0–1&#x27;, copy: &#x27;Beginne am Source-Record. Die Null ist die sichtbare Fuge; das Seitenbit bleibt für den eindeutigen Return separat erhalten.&#x27;, setup: () =&gt; { slider.value = &#x27;0&#x27;; slider.dispatchEvent(new Event(&#x27;input&#x27;, { bubbles:true })); } },
        { target: &#x27;#qcut-title&#x27;, label: &#x27;Q18 → Q90 · orientierter Schnitt&#x27;, copy: &#x27;Der Q-Cut dreht eine deklarierte Linie um O. Die Demo stellt Q90 als fünften 18°-Schritt ein; die Ihara-Lesart bleibt ausdrücklich Analogie.&#x27;, setup: () =&gt; { qcutStep.value = &#x27;5&#x27;; qcutStep.dispatchEvent(new Event(&#x27;input&#x27;, { bubbles:true })); } },
        { target: &#x27;#leaf-fold-tour&#x27;, label: &#x27;IOI / Q90 × Prime Foldings · Open Book&#x27;, copy: &#x27;Die zweite HTML-Quelle öffnet Buchstaben-/Silbenlinse und AL→Cube→PINKY-Progression. Öffne sie als eigene Quelle und kehre anschließend zur Cube-Station zurück.&#x27; },
        { target: &#x27;#glb-world-title&#x27;, label: &#x27;Edelweiss · L-Frame wobble / mirror return&#x27;, copy: &#x27;Hier ist das Edelweiss: Der GLB-Carrier spielt BINDER → 7 OUTER → 11 LIFT → 11 MIRROR RETURN → O₀. Der Cube bleibt Pivot und Carrier, nicht eine dritte Sprachquelle.&#x27; },
        { target: &#x27;#h4-h5-two-hand-bridge&#x27;, label: &#x27;Two Hands Turn One Cube&#x27;, copy: &#x27;Die C5-Kantenhand und die gesetzte Prime-/Composite-Anzeige teilen einen endlichen 20-Tick-Displayreturn. H4 und H5 bleiben darüber hinaus offen.&#x27; },
        { target: &#x27;#h8-record-deck-mode-lens&#x27;, label: &#x27;H8 · AM / VM / PM · 3+2+1&#x27;, copy: &#x27;Deck, Club und Control Room werden als sechs getypte Positionen gelesen. RPM-Labels, Spektrumslinsen und Aperture-Stack bleiben getrennte Felder.&#x27; },
        { target: &#x27;#protocol-ledger&#x27;, label: &#x27;Ledger · documentary return&#x27;, copy: &#x27;Die Tour endet im Ledger: exakte endliche Resultate, deklarierte Modelle und offene Hypothesen bleiben sichtbar getrennt.&#x27; }
      ];
      const leafTourButtons = [...root.querySelectorAll(&#x27;[data-leaf-tour-step]&#x27;)];
      const leafCommonStart = root.querySelector(&#x27;#leaf-common-start&#x27;);
      const leafTour = root.querySelector(&#x27;#leaf-fold-tour&#x27;);
      const leafTourOpenBook = root.querySelector(&#x27;#leaf-tour-open-book&#x27;);
      const leafTourStart = root.querySelector(&#x27;#leaf-tour-start&#x27;);
      const leafTourAuto = root.querySelector(&#x27;#leaf-tour-auto&#x27;);
      const leafTourStop = root.querySelector(&#x27;#leaf-tour-stop&#x27;);
      const leafTourPhase = root.querySelector(&#x27;#leaf-tour-phase&#x27;);
      const leafTourAction = root.querySelector(&#x27;#leaf-tour-action&#x27;);
      const leafTourProgress = root.querySelector(&#x27;#leaf-tour-progress&#x27;);
      let leafTourIndex = 0;
      let leafTourRunning = false;
      let leafTourPlaying = false;
      let leafTourTimer = null;
      let leafTourCameraToken = 0;
      let leafTourRenderToken = 0;
      let leafTourActionToken = 0;
      let leafTourActionTimers = [];
      let leafTourEdelweissActive = false;
      const leafTourReducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;

      leafCommonStart?.addEventListener(&#x27;click&#x27;, event =&gt; {
        event.preventDefault();
        const href = leafCommonStart.href;
        try {
          window.top.location.href = href;
        } catch (_) {
          window.open(href, &#x27;_top&#x27;);
        }
      });

      function clearLeafTourTimer() {
        if (leafTourTimer) window.clearTimeout(leafTourTimer);
        leafTourTimer = null;
      }

      function setLeafTourPlaying(playing) {
        leafTourPlaying = playing;
        clearLeafTourTimer();
        leafTourAuto.setAttribute(&#x27;aria-pressed&#x27;, String(playing));
        leafTourAuto.textContent = playing ? &#x27;Ⅱ PLAY ALL PAUSIEREN&#x27; : &#x27;▶ PLAY ALL FORTSETZEN&#x27;;
      }

      function clearLeafTourActionTimers() {
        leafTourActionTimers.forEach(timer =&gt; window.clearTimeout(timer));
        leafTourActionTimers = [];
      }

      function cancelLeafTourAction(label = &#x27;LIVE-AKTION GESTOPPT&#x27;) {
        leafTourActionToken += 1;
        clearLeafTourActionTimers();
        if (breathing) stopBreath(&#x27;TOUR · PAUSE&#x27;);
        stopTwoHandRun();
        root.querySelectorAll(&#x27;.tour-ledger-pulse&#x27;).forEach(node =&gt; node.classList.remove(&#x27;tour-ledger-pulse&#x27;));
        if (leafTourEdelweissActive) {
          const pause = root.querySelector(&#x27;#ioi-world-pause&#x27;);
          if (pause &amp;&amp; pause.getAttribute(&#x27;aria-pressed&#x27;) !== &#x27;true&#x27;) pause.click();
          leafTourEdelweissActive = false;
        }
        if (leafTourAction) leafTourAction.textContent = label;
      }

      function leafTourDelay(ms, token) {
        return new Promise(resolve =&gt; {
          const timer = window.setTimeout(() =&gt; resolve(token === leafTourActionToken), ms);
          leafTourActionTimers.push(timer);
        });
      }

      async function playLeafTourInstrument(index) {
        cancelLeafTourAction(&#x27;LIVE-AKTION WIRD VORBEREITET&#x27;);
        const token = leafTourActionToken;
        if (index === 0) {
          leafTourAction.textContent = &#x27;LIVE · 101 ATEM · CARO → CON–DAO → AU–NA&#x27;;
          if (!breathing) root.querySelector(&#x27;#number-game-breathe&#x27;)?.click();
          if (!await leafTourDelay(5800,token)) return false;
          if (breathing) stopBreath(&#x27;TOUR · 101 RETURN&#x27;);
        } else if (index === 1) {
          leafTourAction.textContent = &#x27;LIVE · Q-CUT · 0° → 18° → 36° → 90° → 180° → 360° → Q90&#x27;;
          for (const step of [0,1,2,5,10,20,5]) {
            if (token !== leafTourActionToken) return false;
            qcutStep.value = String(step);
            renderQCut(step);
            if (!await leafTourDelay(420,token)) return false;
          }
        } else if (index === 2) {
          leafTourAction.textContent = &#x27;SOURCE WINDOW · OPEN BOOK BLEIBT OPTIONAL · PLAY ALL LÄUFT WEITER&#x27;;
          if (!await leafTourDelay(2600,token)) return false;
        } else if (index === 3) {
          leafTourAction.textContent = &#x27;LIVE · EDELWEISS · BINDER → 7 OUTER → 11 LIFT → 11 MIRROR RETURN → O₀&#x27;;
          const edelweiss = root.querySelector(&#x27;[data-glb-animation=&quot;EDELWEISS_L_FRAME_WOBBLE&quot;]&#x27;);
          edelweiss?.click();
          leafTourEdelweissActive = true;
          if (!await leafTourDelay(5600,token)) return false;
        } else if (index === 4) {
          leafTourAction.textContent = &#x27;LIVE · TWO HANDS · 20 TICKS BIS ZUM GEMEINSAMEN RETURN&#x27;;
          root.querySelector(&#x27;#two-hand-run-return&#x27;)?.click();
          if (!await leafTourDelay(4700,token)) return false;
        } else if (index === 5) {
          leafTourAction.textContent = &#x27;LIVE · H8 PLATTENDECK · 3 VINYL + 2 SCHELLACK + 1 DIGITAL · N/L/G&#x27;;
          for (const button of h8ModeButtons) {
            if (token !== leafTourActionToken) return false;
            h8Mode = button.dataset.h8Mode;
            renderH8DeckLens();
            if (!await leafTourDelay(360,token)) return false;
          }
          for (const button of h8SpectrumButtons) {
            if (token !== leafTourActionToken) return false;
            h8Spectrum = button.dataset.h8Spectrum;
            renderH8DeckLens();
            if (!await leafTourDelay(460,token)) return false;
          }
        } else if (index === 6) {
          leafTourAction.textContent = &#x27;LIVE · LEDGER RETURN · BEOBACHTUNG ≠ MODELL ≠ HYPOTHESE&#x27;;
          const entries = [...root.querySelectorAll(&#x27;#protocol-ledger .protocol-ledger &gt; div&#x27;)].slice(0,8);
          for (const entry of entries) {
            if (token !== leafTourActionToken) return false;
            entry.classList.add(&#x27;tour-ledger-pulse&#x27;);
            if (!await leafTourDelay(280,token)) return false;
            entry.classList.remove(&#x27;tour-ledger-pulse&#x27;);
          }
        }
        return token === leafTourActionToken;
      }

      function moveLeafTourCamera(target) {
        const token = ++leafTourCameraToken;
        if (!target) return Promise.resolve();
        const focusTarget = target.closest(&#x27;.qcut, .cube-lens, .protocol-section, .ioi-stage, .leaf-tour&#x27;) || target;
        root.querySelectorAll(&#x27;.tour-focus&#x27;).forEach(node =&gt; node.classList.remove(&#x27;tour-focus&#x27;));
        focusTarget.classList.add(&#x27;tour-focus&#x27;);
        leafTour.dataset.tourPhase = &#x27;moving&#x27;;
        leafTourPhase.textContent = &#x27;KAMERA FÄHRT · ERKLÄRUNG BLEIBT SICHTBAR&#x27;;
        const startY = window.scrollY;
        const rect = focusTarget.getBoundingClientRect();
        const maxY = Math.max(0,document.documentElement.scrollHeight - window.innerHeight);
        const targetY = Math.max(0,Math.min(maxY,startY + rect.top - window.innerHeight * .26));
        const distance = targetY - startY;
        if (leafTourReducedMotion || Math.abs(distance) &lt; 2) {
          window.scrollTo(0,targetY);
          return Promise.resolve();
        }
        return new Promise(resolve =&gt; {
          const duration = Math.min(1400,Math.max(850,Math.abs(distance) * .22));
          const started = performance.now();
          const frame = now =&gt; {
            if (token !== leafTourCameraToken) return resolve();
            const t = Math.min(1,(now - started) / duration);
            const eased = t &lt; .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2,3) / 2;
            window.scrollTo(0,startY + distance * eased);
            if (t &lt; 1) requestAnimationFrame(frame); else resolve();
          };
          requestAnimationFrame(frame);
        });
      }

      function scheduleLeafTourAdvance() {
        clearLeafTourTimer();
        if (!leafTourPlaying) return;
        if (leafTourIndex === leafTourSteps.length - 1) {
          setLeafTourPlaying(false);
          leafTourPhase.textContent = &#x27;PLAY ALL BEENDET · LEDGER BLEIBT MARKIERT&#x27;;
          leafTourAction.textContent = &#x27;RETURN ERREICHT · ALLE SIEBEN STATIONEN WURDEN BEDIENT&#x27;;
          return;
        }
        leafTourTimer = window.setTimeout(() =&gt; {
          leafTourIndex += 1;
          renderLeafTour({ move:true });
        },leafTourIndex === 2 ? 1800 : 1200);
      }

      async function renderLeafTour({ move = leafTourRunning } = {}) {
        const renderToken = ++leafTourRenderToken;
        const step = leafTourSteps[leafTourIndex];
        root.querySelectorAll(&#x27;.tour-focus&#x27;).forEach(node =&gt; node.classList.remove(&#x27;tour-focus&#x27;));
        leafTourButtons.forEach((button, index) =&gt; index === leafTourIndex ? button.setAttribute(&#x27;aria-current&#x27;, &#x27;step&#x27;) : button.removeAttribute(&#x27;aria-current&#x27;));
        root.querySelector(&#x27;#leaf-tour-index&#x27;).textContent = `${String(leafTourIndex + 1).padStart(2, &#x27;0&#x27;)}/07`;
        root.querySelector(&#x27;#leaf-tour-label&#x27;).textContent = step.label;
        root.querySelector(&#x27;#leaf-tour-copy&#x27;).textContent = step.copy;
        leafTourProgress.style.width = `${((leafTourIndex + 1) / leafTourSteps.length) * 100}%`;
        root.querySelector(&#x27;#leaf-tour-prev&#x27;).disabled = leafTourIndex === 0;
        root.querySelector(&#x27;#leaf-tour-next&#x27;).disabled = leafTourIndex === leafTourSteps.length - 1;
        leafTourOpenBook.hidden = leafTourIndex !== 2;
        step.setup?.();
        const target = root.querySelector(step.target);
        if (leafTourRunning) {
          leafTourPhase.textContent = `STATION ${String(leafTourIndex + 1).padStart(2, &#x27;0&#x27;)} · ${leafTourPlaying ? &#x27;PLAY ALL&#x27; : &#x27;MANUELL&#x27;}`;
          if (move) await moveLeafTourCamera(target);
          if (renderToken !== leafTourRenderToken || !leafTourRunning) return;
          leafTour.dataset.tourPhase = &#x27;ready&#x27;;
          leafTourPhase.textContent = `STATION ${String(leafTourIndex + 1).padStart(2, &#x27;0&#x27;)} · LIVE-INSTRUMENT WIRD BEDIENT`;
          const actionCompleted = await playLeafTourInstrument(leafTourIndex);
          if (!actionCompleted || renderToken !== leafTourRenderToken || !leafTourRunning) return;
          leafTourPhase.textContent = `STATION ${String(leafTourIndex + 1).padStart(2, &#x27;0&#x27;)} ABGESPIELT · ${leafTourPlaying ? &#x27;NÄCHSTER STOPP FOLGT&#x27; : &#x27;MANUELLE STEUERUNG&#x27;}`;
          scheduleLeafTourAdvance();
        }
      }

      function startLeafTour(auto = true) {
        leafTourRunning = true;
        leafTour.dataset.tourActive = &#x27;true&#x27;;
        leafTourStart.hidden = true;
        leafTourAuto.hidden = false;
        leafTourStop.hidden = false;
        setLeafTourPlaying(auto);
        renderLeafTour({ move:true });
      }

      function stopLeafTour() {
        leafTourRunning = false;
        setLeafTourPlaying(false);
        cancelLeafTourAction(&#x27;PLAY ALL BEENDET · STATION BLEIBT VORGEWÄHLT&#x27;);
        leafTourCameraToken += 1;
        leafTourRenderToken += 1;
        leafTour.dataset.tourActive = &#x27;false&#x27;;
        leafTour.dataset.tourPhase = &#x27;ready&#x27;;
        leafTourStart.hidden = false;
        leafTourAuto.hidden = true;
        leafTourStop.hidden = true;
        root.querySelectorAll(&#x27;.tour-focus&#x27;).forEach(node =&gt; node.classList.remove(&#x27;tour-focus&#x27;));
        leafTourPhase.textContent = &#x27;PAUSIERT · STATION BLEIBT VORGEWÄHLT&#x27;;
      }

      leafTourStart.addEventListener(&#x27;click&#x27;, () =&gt; startLeafTour(true));
      leafTourAuto.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (leafTourPlaying) {
          setLeafTourPlaying(false);
          cancelLeafTourAction(&#x27;PLAY ALL PAUSIERT · LIVE-AKTION GESTOPPT&#x27;);
          leafTourPhase.textContent = &#x27;PAUSE · MIT PLAY ALL FORTSETZEN&#x27;;
        } else {
          setLeafTourPlaying(true);
          renderLeafTour({ move:false });
        }
      });
      leafTourStop.addEventListener(&#x27;click&#x27;, stopLeafTour);
      leafTourButtons.forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; { cancelLeafTourAction(&#x27;MANUELLER STATIONSWECHSEL&#x27;); leafTourIndex = Number(button.dataset.leafTourStep); if (!leafTourRunning) startLeafTour(false); else renderLeafTour({ move:true }); }));
      root.querySelector(&#x27;#leaf-tour-prev&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { setLeafTourPlaying(false); cancelLeafTourAction(&#x27;MANUELLER STATIONSWECHSEL&#x27;); leafTourIndex = Math.max(0, leafTourIndex - 1); renderLeafTour({ move:true }); });
      root.querySelector(&#x27;#leaf-tour-next&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { cancelLeafTourAction(&#x27;MANUELLER STATIONSWECHSEL&#x27;); leafTourIndex = Math.min(leafTourSteps.length - 1, leafTourIndex + 1); renderLeafTour({ move:true }); });
      const leafTourHash = (() =&gt; { try { return window.parent.location.hash || window.location.hash; } catch (_) { return window.location.hash; } })();
      if (leafTourHash === &#x27;#leaf-tour-cube&#x27;) leafTourIndex = 3;
      renderLeafTour({ move:false });

      const twoHandRoute = [0,2,4,1,3];
      const twoHandCandidates = [
        { label: &#x27;P13&#x27;, cube: &#x27;13³=2197&#x27;, type: &#x27;PRIME&#x27; },
        { label: &#x27;P17&#x27;, cube: &#x27;17³=4913&#x27;, type: &#x27;PRIME&#x27; },
        { label: &#x27;P23&#x27;, cube: &#x27;23³=12167&#x27;, type: &#x27;PRIME&#x27; },
        { label: &#x27;C21&#x27;, cube: &#x27;21³=9261&#x27;, type: &#x27;COMPOSITE CONTROL&#x27; }
      ];
      let twoHandLeft = 0;
      let twoHandRight = 0;
      let twoHandTick = 0;
      let twoHandTimer = null;

      function renderTwoHands(pulse) {
        const current = twoHandRoute[twoHandLeft];
        const next = twoHandRoute[(twoHandLeft + 1) % twoHandRoute.length];
        const fold = twoHandCandidates[twoHandRight];
        const closed = twoHandLeft === 0 &amp;&amp; twoHandRight === 0;
        root.querySelector(&#x27;#two-hand-left-readout&#x27;).textContent = `${current}→${next} · EDGE ${twoHandLeft}/5`;
        root.querySelector(&#x27;#two-hand-right-readout&#x27;).textContent = `${fold.label} · ${fold.cube} · ${twoHandRight}/4`;
        root.querySelector(&#x27;#two-hand-cube-record&#x27;).textContent = `E${twoHandLeft} · ${fold.label}`;
        root.querySelector(&#x27;#two-hand-tick&#x27;).textContent = twoHandTick == null ? &#x27;MANUAL · —/20&#x27; : `${twoHandTick} / 20`;
        root.querySelector(&#x27;#two-hand-return&#x27;).textContent = closed ? &#x27;SOURCE · CLOSED&#x27; : `OPEN · E${twoHandLeft}/${fold.label}`;
        root.querySelector(&#x27;#two-hand-return-card&#x27;).classList.toggle(&#x27;pass&#x27;,closed);
        root.querySelector(&#x27;#two-hand-boundary&#x27;).innerHTML = `&lt;b&gt;R0 / TWO-SOURCE LENS:&lt;/b&gt; Aktuell führt H4 &lt;code&gt;${current}→${next}&lt;/code&gt;; H5 zeigt &lt;code&gt;${fold.label} · ${fold.type}&lt;/code&gt;. Exakt ist nur der endliche Controller: C5 besitzt Periode 5, die vierteilige Kandidatenanzeige Periode 4 und ihr gekoppeltes Produkt Periode 20. ${closed ? &#x27;Beide Anzeigen stehen wieder am Source-Record.&#x27; : &#x27;Der gemeinsame Record ist offen.&#x27;} H4 bleibt über diese lokale C5-Instanz hinaus offen; H5 bleibt ohne präregistrierte Vorhersageregel offen.`;
        if (pulse) {
          const leftArrow = root.querySelector(&#x27;#two-hand-left-arrow&#x27;);
          const rightArrow = root.querySelector(&#x27;#two-hand-right-arrow&#x27;);
          leftArrow.classList.add(&#x27;active&#x27;);
          rightArrow.classList.add(&#x27;active&#x27;);
          setTimeout(() =&gt; { leftArrow.classList.remove(&#x27;active&#x27;); rightArrow.classList.remove(&#x27;active&#x27;); },180);
        }
      }

      function stopTwoHandRun() {
        if (twoHandTimer != null) clearInterval(twoHandTimer);
        twoHandTimer = null;
      }

      function stepTwoHands() {
        twoHandLeft = (twoHandLeft + 1) % 5;
        twoHandRight = (twoHandRight + 1) % 4;
        twoHandTick = twoHandTick == null ? 1 : (twoHandTick + 1) % 20;
        renderTwoHands(true);
      }

      root.querySelector(&#x27;#two-hand-left-step&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { stopTwoHandRun(); twoHandLeft = (twoHandLeft + 1) % 5; twoHandTick = null; renderTwoHands(true); });
      root.querySelector(&#x27;#two-hand-left-reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { stopTwoHandRun(); twoHandLeft = 0; twoHandTick = null; renderTwoHands(false); });
      root.querySelector(&#x27;#two-hand-right-step&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { stopTwoHandRun(); twoHandRight = (twoHandRight + 1) % 4; twoHandTick = null; renderTwoHands(true); });
      root.querySelector(&#x27;#two-hand-right-reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { stopTwoHandRun(); twoHandRight = 0; twoHandTick = null; renderTwoHands(false); });
      root.querySelector(&#x27;#two-hand-coupled-step&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { stopTwoHandRun(); stepTwoHands(); });
      root.querySelector(&#x27;#two-hand-reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { stopTwoHandRun(); twoHandLeft = 0; twoHandRight = 0; twoHandTick = 0; renderTwoHands(false); });
      root.querySelector(&#x27;#two-hand-run-return&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        stopTwoHandRun();
        let remaining = 1;
        while (remaining &lt;= 20 &amp;&amp; ((twoHandLeft + remaining) % 5 !== 0 || (twoHandRight + remaining) % 4 !== 0)) remaining += 1;
        let elapsed = 0;
        twoHandTick = 0;
        twoHandTimer = setInterval(() =&gt; {
          stepTwoHands();
          elapsed += 1;
          if (elapsed &gt;= remaining) { stopTwoHandRun(); twoHandTick = 20; renderTwoHands(false); }
        },220);
      });
      renderTwoHands(false);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  const isShare = document.documentElement.classList.contains(
    "visualization-share-root",
  );
  let viewportHeight = globalThis.innerHeight;
  let sizeFingerprint = null;
  let sizeWriteTimeout;
  let lastSize = null;
  let pendingSize = null;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }

  } catch {
    storage = null;
  }

    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }

  };

    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {

        return;
      }

        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,

      if (isShare) {

        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {

    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();

<script>
(() => {
  const shell = document.querySelector('#leaf-reader-shell');
  const frame = document.querySelector('#codex-visualization');
  const mode = document.querySelector('#leaf-reader-mode');
  const play = document.querySelector('#leaf-reader-play');
  const fullscreen = document.querySelector('#leaf-reader-fullscreen');

  function innerDocument() {
    try { return frame.contentDocument || frame.contentWindow?.document || null; }
    catch { return null; }
  }

  function setReading(active) {
    shell.dataset.reading = String(active);
    mode.setAttribute('aria-pressed', String(active));
    mode.textContent = active ? 'READER SCHLIESSEN' : 'LESEMODUS';
    const doc = innerDocument();
    if (!doc) return;
    let style = doc.querySelector('#leaf-reader-mode-style');
    if (!style) {
      style = doc.createElement('style');
      style.id = 'leaf-reader-mode-style';
      style.textContent = `
        #ioi-leaf-fold.leaf-reader-active{max-width:960px!important;padding-left:clamp(22px,6vw,76px)!important;padding-right:clamp(22px,6vw,76px)!important}
        #ioi-leaf-fold.leaf-reader-active .a0-lead{max-width:72ch!important;font-size:19px!important;line-height:1.72!important}
        #ioi-leaf-fold.leaf-reader-active .protocol-head p,#ioi-leaf-fold.leaf-reader-active .protocol-card p,#ioi-leaf-fold.leaf-reader-active .protocol-card li{font-size:14px!important;line-height:1.68!important}
        #ioi-leaf-fold.leaf-reader-active .protocol-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
        @media(max-width:760px){#ioi-leaf-fold.leaf-reader-active .protocol-grid{grid-template-columns:1fr!important}}
      `;
      doc.head.appendChild(style);
    }
    doc.querySelector('#ioi-leaf-fold')?.classList.toggle('leaf-reader-active', active);
  }

  mode.addEventListener('click', () => setReading(shell.dataset.reading !== 'true'));
  play.addEventListener('click', () => {
    setReading(false);
    const doc = innerDocument();
    const target = doc?.querySelector('#leaf-tour-start');
    if (target) {
      target.click();
      play.textContent = 'PLAY ALL LÄUFT · 7 STOPS';
    } else {
      play.textContent = 'PLAYER LÄDT …';
    }
  });
  fullscreen.addEventListener('click', async () => {
    if (!document.fullscreenElement) await shell.requestFullscreen?.();
    else await document.exitFullscreen?.();
  });
  document.addEventListener('fullscreenchange', () => {
    fullscreen.textContent = document.fullscreenElement ? 'VOLLBILD SCHLIESSEN ×' : 'VOLLBILD ⛶';
  });
  frame.addEventListener('load', () => {
    setReading(shell.dataset.reading === 'true');
    play.textContent = '▶ PLAY ALL';
  });
})();
