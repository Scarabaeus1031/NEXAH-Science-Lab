}

.form-select:focus-visible {
  border-color: var(--ring);

}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;

.form-range::-webkit-slider-runnable-track {

.form-range:focus-visible::-webkit-slider-thumb {

}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);

.form-range:disabled {

.btn:not(.btn-primary, .viz-tile):is(

.btn:focus-visible,
.nav-link:focus-visible {

@media (pointer: coarse) {

  &lt;svg class=&quot;tqi-stage&quot; role=&quot;img&quot; aria-labelledby=&quot;tqi-title tqi-desc&quot;&gt;
    &lt;title id=&quot;tqi-title&quot;&gt;Interaktiver Tessarec mit Q-Grad-Achse, diagonalem Jota-Schnitt, farbigem Einstrom und Perle&lt;/title&gt;
    &lt;desc id=&quot;tqi-desc&quot;&gt;Ein projizierter vierdimensionaler Träger enthält einen dreidimensionalen Würfelschnitt, einen Zylinder mit acht Zustandsadressen und eine kugelförmige Perle. Die Q-Achse verschiebt den Layer. Jota dreht den diagonalen Schnitt. Ein farbiger Strom verbindet den roten Außenzeugen über Cut und Gate mit der Perle.&lt;/desc&gt;

  &lt;p class=&quot;tqi-detail text-small&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;tessarec-q-iota&#x27;);
      const svg = root.querySelector(&#x27;.tqi-stage&#x27;);
      const qInput = root.querySelector(&#x27;#tqi-q&#x27;);
      const thetaInput = root.querySelector(&#x27;#tqi-theta&#x27;);
      const depthInput = root.querySelector(&#x27;#tqi-depth&#x27;);
      const flowInput = root.querySelector(&#x27;#tqi-flow&#x27;);
      const qValue = root.querySelector(&#x27;.tqi-q-value&#x27;);
      const thetaValue = root.querySelector(&#x27;.tqi-theta-value&#x27;);
      const depthValue = root.querySelector(&#x27;.tqi-depth-value&#x27;);
      const flowValue = root.querySelector(&#x27;.tqi-flow-value&#x27;);
      const detail = root.querySelector(&#x27;.tqi-detail&#x27;);
      const directionButtons = [...root.querySelectorAll(&#x27;[data-direction]&#x27;)];
      const orbitButton = root.querySelector(&#x27;[data-orbit]&#x27;);
      const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
      let q = 0;
      let theta = 35;
      let depth = 0;
      let flow = 72;
      let direction = 1;
      let orbitRunning = false;
      let orbitGeometry = null;

      const make = (tag, attrs = {}, content = &#x27;&#x27;) =&gt; {
        const el = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([key, value]) =&gt; el.setAttribute(key, value));
        if (content) el.textContent = content;
        svg.appendChild(el);
        return el;
      };
      const line = (x1, y1, x2, y2, cls) =&gt; make(&#x27;line&#x27;, { x1, y1, x2, y2, class: cls });
      const textAt = (x, y, content, cls = &#x27;&#x27;, anchor = &#x27;middle&#x27;) =&gt; make(&#x27;text&#x27;, { x, y, class: cls, &#x27;text-anchor&#x27;: anchor }, content);
      const polygon = (pts, cls) =&gt; make(&#x27;polygon&#x27;, { points: pts.map((p) =&gt; p.join(&#x27;,&#x27;)).join(&#x27; &#x27;), class: cls });
      const path = (d, cls) =&gt; make(&#x27;path&#x27;, { d, class: cls });

      function pointOnQuadratic(p0, p1, p2, t) {
        const a = (1 - t) * (1 - t);
        const b = 2 * (1 - t) * t;
        const c = t * t;
        return [a*p0[0] + b*p1[0] + c*p2[0], a*p0[1] + b*p1[1] + c*p2[1]];
      }

      function arrowHead(x, y, angle, cls) {
        const size = 9;
        const backX = x - Math.cos(angle) * size;
        const backY = y - Math.sin(angle) * size;
        polygon([
          [x, y],
          [backX + Math.sin(angle) * 4.5, backY - Math.cos(angle) * 4.5],
          [backX - Math.sin(angle) * 4.5, backY + Math.cos(angle) * 4.5]
        ], cls);
      }

      function drawCube(cx, cy, side, dx, dy) {
        const h = side / 2;
        const front = [[cx-h,cy-h],[cx+h,cy-h],[cx+h,cy+h],[cx-h,cy+h]];
        const back = front.map(([x,y]) =&gt; [x+dx,y+dy]);
        const drawLoop = (pts, cls) =&gt; {
          pts.forEach((p, i) =&gt; {
            const n = pts[(i + 1) % pts.length];
            line(p[0], p[1], n[0], n[1], cls);
          });
        };
        drawLoop(back, &#x27;tqi-hidden&#x27;);
        front.forEach((p, i) =&gt; line(p[0], p[1], back[i][0], back[i][1], &#x27;tqi-structure&#x27;));
        drawLoop(front, &#x27;tqi-structure&#x27;);
        return { front, back };
      }

      function drawStates(x, y, compact) {
        const gap = compact ? 20 : 24;
        const r = compact ? 3.5 : 4;
        textAt(x, y - 17, &#x27;Q₄ · 8 ↔ 16 Sign-States&#x27;, &#x27;tqi-muted&#x27;, &#x27;start&#x27;);
        for (let i = 0; i &lt; 8; i += 1) {
          const px = x + i * gap;
          line(px, y, px, y + 22, &#x27;tqi-link&#x27;);
          make(&#x27;circle&#x27;, { cx: px, cy: y, r, class: q &lt;= 0 ? &#x27;tqi-state-active&#x27; : &#x27;tqi-state&#x27; });
          make(&#x27;circle&#x27;, { cx: px, cy: y + 22, r, class: q &gt;= 0 ? &#x27;tqi-state-active&#x27; : &#x27;tqi-state&#x27; });
        }
        textAt(x + 8 * gap + 5, y + 4, &#x27;q−&#x27;, &#x27;tqi-muted&#x27;, &#x27;start&#x27;);
        textAt(x + 8 * gap + 5, y + 26, &#x27;q+&#x27;, &#x27;tqi-muted&#x27;, &#x27;start&#x27;);
      }

      function draw() {
        const width = Math.max(320, Math.round(root.getBoundingClientRect().width));
        const compact = width &lt; 560;
        const height = compact ? 540 : 500;
        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
        svg.setAttribute(&#x27;height&#x27;, height);
        while (svg.lastChild &amp;&amp; ![&#x27;title&#x27;, &#x27;desc&#x27;].includes(svg.lastChild.tagName)) svg.removeChild(svg.lastChild);

        const cx = width / 2;
        const cubeSide = compact ? Math.min(210, width * 0.62) : Math.min(300, width * 0.38);
        const cubeCy = compact ? 245 : 230;
        const dx = compact ? 36 : 56;
        const dy = compact ? -26 : -40;
        const cube = drawCube(cx - dx / 2, cubeCy, cubeSide, dx, dy);
        const half = cubeSide / 2;
        const qNorm = q / 100;
        const sliceY = cubeCy + qNorm * half * 0.72;
        const pearlR = compact ? 53 : 70;
        const pearlCx = cx;
        const pearlCy = sliceY - dy * 0.18;

        const slice = [
          [cx-half-dx/2, sliceY],
          [cx+half-dx/2, sliceY],
