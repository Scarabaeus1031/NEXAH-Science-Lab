}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,

  ) {

  }

  .form-check-input::after {

    left: 50%;

    height: 44px;

  }

  .form-check-label {

    min-width: 44px;

  }

  .form-range {

    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

    margin-top: 12px;
  }

        { id: &#x27;H₁&#x27;, name: &#x27;DAY&#x27;, period: 0.9999998937, display: &#x27;24 h&#x27;, kind: &#x27;BEAT&#x27;, color: &#x27;var(--viz-series-1)&#x27; },
        { id: &#x27;H₂&#x27;, name: &#x27;MOON&#x27;, period: 29.530588214, display: &#x27;29.5306 d&#x27;, kind: &#x27;BEAT&#x27;, color: &#x27;var(--viz-series-2)&#x27; },
        { id: &#x27;H₃&#x27;, name: &#x27;YEAR&#x27;, period: 365.256363004, display: &#x27;365.256 d&#x27;, kind: &#x27;BASE&#x27;, color: &#x27;var(--viz-series-3)&#x27; },
        { id: &#x27;H₄&#x27;, name: &#x27;NODES&#x27;, period: 18.613 * 365.2422, display: &#x27;18.613 y&#x27;, kind: &#x27;BASE&#x27;, color: &#x27;var(--viz-series-4)&#x27; },
        { id: &#x27;H₅&#x27;, name: &#x27;PRECESSION&#x27;, period: 25772 * 365.2422, display: &#x27;≈25,772 y&#x27;, kind: &#x27;BASE&#x27;, color: &#x27;var(--viz-series-5)&#x27; }
      ];
      const baseClocks = [
        { id: &#x27;T₁&#x27;, name: &#x27;SIDEREAL SPIN&#x27;, period: 0.9972695663, display: &#x27;0.997270 d&#x27;, kind: &#x27;BASE&#x27;, color: &#x27;var(--viz-series-1)&#x27; },
        { id: &#x27;T₂&#x27;, name: &#x27;MOON SID.&#x27;, period: 27.321661, display: &#x27;27.3217 d&#x27;, kind: &#x27;BASE&#x27;, color: &#x27;var(--viz-series-2)&#x27; },
        { id: &#x27;T₃&#x27;, name: &#x27;YEAR&#x27;, period: 365.256363004, display: &#x27;365.256 d&#x27;, kind: &#x27;BASE&#x27;, color: &#x27;var(--viz-series-3)&#x27; },
        { id: &#x27;T₄&#x27;, name: &#x27;NODES&#x27;, period: 18.613 * 365.2422, display: &#x27;18.613 y&#x27;, kind: &#x27;BASE&#x27;, color: &#x27;var(--viz-series-4)&#x27; },
        { id: &#x27;T₅&#x27;, name: &#x27;PRECESSION&#x27;, period: 25772 * 365.2422, display: &#x27;≈25,772 y&#x27;, kind: &#x27;BASE&#x27;, color: &#x27;var(--viz-series-5)&#x27; }
      ];
      const stageDescriptions = {
        base: &#x27;BASE Tⱼ · fünf physische Grundperioden vor der Beat-Ableitung.&#x27;,
        beats: &#x27;BEATS · Sonnentag und synodischer Monat entstehen als Differenzphasen.&#x27;,
        h: &#x27;Hⱼ · fünf vergleichbare Phasenringe; 1 Hz bezeichnet nur den normierten Anzeigeumlauf.&#x27;,
        q: &#x27;Q°(t₀) · ein lokales Jetzt schneidet alle fünf ungleichen Zyklen.&#x27;,
        pi: &#x27;ΠQ · die fünf gelesenen Phasen werden beobachterrelativ projiziert.&#x27;,
        trace: &#x27;TRACE · die Projektion wird als zeitgeordnete Spur gehalten.&#x27;,
        mask: &#x27;MASK · eine Repräsentationsschicht bestimmt sichtbar, zurückhaltbar und rekonstruierbar.&#x27;,
        record: &#x27;T³(q) · der projizierte Zustand ist ein Record des Schnitts, nicht das ganze Feld.&#x27;
      };
      let t0 = Number(timeInput.value);
      let displayOffset = 0;
      let running = false;
      let activeStage = &#x27;q&#x27;;
      let viewMode = &#x27;readout&#x27;;
      let janusHour = 0;
      let janusRunning = false;
      const janusGates = [3, 6, 9, 12, 24, 36, 42, 48];
      let gateIndex = -1;

      heldToggle.addEventListener(&#x27;click&#x27;, () =&gt; {
        const expanded = heldToggle.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
        heldToggle.setAttribute(&#x27;aria-expanded&#x27;, String(!expanded));
        heldToggle.textContent = `HELD READING · ${expanded ? &#x27;OFF&#x27; : &#x27;ON&#x27;}`;
        heldReading.hidden = expanded;
      });

      const make = (tag, attrs = {}, content = &#x27;&#x27;) =&gt; {
        const el = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([key, value]) =&gt; el.setAttribute(key, value));
        if (content) el.textContent = content;
        svg.appendChild(el);
        return el;
      };
      const line = (x1, y1, x2, y2, cls = &#x27;&#x27;, style = &#x27;&#x27;) =&gt; make(&#x27;line&#x27;, { x1, y1, x2, y2, class: cls, style });
      const textAt = (x, y, content, cls = &#x27;&#x27;, anchor = &#x27;start&#x27;, style = &#x27;&#x27;) =&gt; make(&#x27;text&#x27;, { x, y, class: cls, &#x27;text-anchor&#x27;: anchor, style }, content);
      const path = (d, cls = &#x27;&#x27;, style = &#x27;&#x27;) =&gt; make(&#x27;path&#x27;, { d, class: cls, style });
      const circle = (cx, cy, r, cls = &#x27;&#x27;, style = &#x27;&#x27;) =&gt; make(&#x27;circle&#x27;, { cx, cy, r, class: cls, style });

      function arrow(x, y, angle, cls) {
        const size = 8;
        const bx = x - Math.cos(angle) * size;
        const by = y - Math.sin(angle) * size;
        make(&#x27;polygon&#x27;, {
          points: `${x},${y} ${bx + Math.sin(angle)*4},${by - Math.cos(angle)*4} ${bx - Math.sin(angle)*4},${by + Math.cos(angle)*4}`,
          class: cls
        });
      }

      function cube(cx, cy, side) {
        const h = side / 2;
        const dx = side * 0.18;
        const dy = -side * 0.13;
        const front = [[cx-h,cy-h],[cx+h,cy-h],[cx+h,cy+h],[cx-h,cy+h]];
        const back = front.map(([x,y]) =&gt; [x+dx,y+dy]);
        [front, back].forEach((face) =&gt; face.forEach((p, i) =&gt; {
          const n = face[(i+1)%4];
          line(p[0], p[1], n[0], n[1], face === back ? &#x27;fhq-soft&#x27; : &#x27;fhq-structure&#x27;);
        }));
        front.forEach((p, i) =&gt; line(p[0], p[1], back[i][0], back[i][1], &#x27;fhq-structure&#x27;));
      }

      function draw() {
        const width = Math.max(320, Math.round(root.getBoundingClientRect().width));
        const compact = width &lt; 680;
        const triptych = viewMode === &#x27;triptych&#x27;;
        const loom = !triptych &amp;&amp; (compact || viewMode === &#x27;loom&#x27;);
        const height = triptych ? (compact ? 1060 : 700) : loom ? 1000 : 620;
        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
        svg.setAttribute(&#x27;height&#x27;, height);
        while (svg.lastChild &amp;&amp; ![&#x27;title&#x27;, &#x27;desc&#x27;].includes(svg.lastChild.tagName)) svg.removeChild(svg.lastChild);

        const bankLeft = compact ? 10 : 22;
        const clockX = compact ? Math.min(125, width * 0.36) : Math.min(190, width * 0.20);
        const qX = loom ? width - (compact ? 42 : 58) : Math.min(455, width * 0.47);
        const startY = 150;
        const rowGap = compact ? 92 : 82;
        const radius = compact ? 25 : 27;
        const qTop = startY - 44;
        const qBottom = startY + rowGap * 4 + 44;

        const timelineX0 = bankLeft;
        const timelineX1 = width - 24;
        const timelineY = 57;
        const timelineW = timelineX1 - timelineX0;
        const halves = [
          { a: 0, b: 12, label: &#x27;DAY 1&#x27;, cls: &#x27;fhq-day&#x27; },
          { a: 12, b: 24, label: &#x27;NIGHT 1&#x27;, cls: &#x27;fhq-night&#x27; },
          { a: 24, b: 36, label: &#x27;DAY 2&#x27;, cls: &#x27;fhq-day&#x27; },
          { a: 36, b: 48, label: &#x27;NIGHT 2&#x27;, cls: &#x27;fhq-night&#x27; }
        ];
        halves.forEach((half) =&gt; {
          const x = timelineX0 + timelineW * half.a / 48;
          const w = timelineW * (half.b-half.a) / 48;
          make(&#x27;rect&#x27;, { x, y: timelineY-18, width: w, height: 36, class: half.cls });
          textAt(x+w/2, timelineY+4, half.label, &#x27;fhq-muted&#x27;, &#x27;middle&#x27;);
        });
        line(timelineX0, timelineY+22, timelineX1, timelineY+22, &#x27;fhq-structure&#x27;);
        janusGates.forEach((hour) =&gt; {
          const x = timelineX0 + timelineW * hour/48;
          line(x, timelineY+17, x, timelineY+28, hour === janusHour ? &#x27;fhq-q&#x27; : &#x27;fhq-structure&#x27;);
          textAt(x, timelineY+42, `${hour}`, hour === janusHour ? &#x27;fhq-label&#x27; : &#x27;fhq-muted&#x27;, hour === 48 ? &#x27;end&#x27; : &#x27;middle&#x27;);
        });
        const hingeX = timelineX0 + timelineW/2;
        line(hingeX, timelineY-25, hingeX, timelineY+29, &#x27;fhq-q&#x27;);
        textAt(hingeX, timelineY-31, &#x27;24 h · JANUS HINGE&#x27;, &#x27;fhq-label&#x27;, &#x27;middle&#x27;);
        const janusX = timelineX0 + timelineW * janusHour/48;
        circle(janusX, timelineY+22, 6, &#x27;fhq-q-dot&#x27;);
        textAt(timelineX0, timelineY-31, &#x27;×H · 0–48 h&#x27;, &#x27;fhq-label&#x27;);

        if (triptych) {
          const panelW = compact ? width-36 : (width-72)/3;
          const panelH = compact ? 250 : 455;
          const panelXs = compact ? [18, 18, 18] : [18, 36+panelW, 54+panelW*2];
          const panelYs = compact ? [130, 445, 760] : [132, 132, 132];
          const headings = [&#x27;I · LIGHT / WEAVE&#x27;, &#x27;II · SHADOW / 180°&#x27;, &#x27;III · RECORD / RETURN&#x27;];
          panelXs.forEach((x, i) =&gt; {
            const y = panelYs[i];
            textAt(x, y, headings[i], &#x27;fhq-label&#x27;);
            line(x, y+14, x+panelW, y+14, &#x27;fhq-structure&#x27;);
          });

          const lx = panelXs[0];
          const ly = panelYs[0];
          const loomTop = ly+62;
          const loomBottom = ly+panelH-45;
          textAt(lx+panelW/2, ly+38, &#x27;Hⱼ · WEBSTUHL&#x27;, &#x27;fhq-muted&#x27;, &#x27;middle&#x27;);
          line(lx+28, loomTop, lx+panelW-28, loomTop, &#x27;fhq-structure&#x27;);
          line(lx+28, loomBottom, lx+panelW-28, loomBottom, &#x27;fhq-structure&#x27;);
          breathClocks.forEach((clock, i) =&gt; {
            const x = lx+45 + i*(panelW-90)/4;
            const sway = Math.sin((janusHour/48)*Math.PI*2+i)*14;
            path(`M ${x} ${loomTop} C ${x+sway} ${loomTop+55}, ${x-sway} ${loomBottom-55}, ${x} ${loomBottom}`, &#x27;&#x27;, `fill:none;stroke:${clock.color};stroke-width:2`);
            circle(x, loomTop, 4, &#x27;&#x27;, `fill:${clock.color}`);
            circle(x, loomBottom, 4, &#x27;&#x27;, `fill:${clock.color}`);
            textAt(x, loomBottom+22, `H${i+1}`, &#x27;fhq-muted&#x27;, &#x27;middle&#x27;);
          });
          line(lx+panelW/2, loomTop-18, lx+panelW/2, loomBottom+8, &#x27;fhq-q&#x27;);
          textAt(lx+panelW/2, loomTop-26, &#x27;Q° CUT&#x27;, &#x27;fhq-label&#x27;, &#x27;middle&#x27;);

          const sx = panelXs[1];
          const sy = panelYs[1];
          const scx = sx+panelW/2;
          const scy = sy+(compact ? 112 : 180);
          const sr = compact ? 43 : Math.min(58, panelW*0.18);
          circle(scx-sr*0.85, scy, sr, &#x27;fhq-pearl&#x27;);
          line(scx+sr*0.18, scy-sr*1.45, scx+sr*0.18, scy+sr*1.45, &#x27;fhq-q&#x27;);
          path(`M ${scx+sr*0.2} ${scy-sr*0.72} Q ${scx+sr*1.02} ${scy-sr*0.42} ${scx+sr*1.38} ${scy} Q ${scx+sr*1.02} ${scy+sr*0.42} ${scx+sr*0.2} ${scy+sr*0.72} Z`, &#x27;fhq-shadow&#x27;);
          line(scx-sr*1.75, scy-sr*0.95, scx+sr*0.18, scy-sr*0.45, &#x27;fhq-soft&#x27;);
          line(scx-sr*1.75, scy+sr*0.95, scx+sr*0.18, scy+sr*0.45, &#x27;fhq-soft&#x27;);
          textAt(scx-sr*1.75, scy-sr*1.12, &#x27;LIGHT&#x27;, &#x27;fhq-label&#x27;);
          textAt(scx+sr*1.42, scy+4, &#x27;SHADOW&#x27;, &#x27;fhq-label&#x27;);

          const arcCy = compact ? sy+panelH-20 : sy+panelH-42;
          const arcR = compact ? Math.min(74, panelW*0.3) : Math.min(125, panelW*0.4);
          path(`M ${scx-arcR} ${arcCy} A ${arcR} ${arcR} 0 0 1 ${scx+arcR} ${arcCy}`, &#x27;fhq-q&#x27;);
          const cumulative = [0];
          janusGates.reduce((sum, gate) =&gt; {
            const next = sum+gate;
            cumulative.push(next);
            return next;
          }, 0);
          cumulative.forEach((degree, i) =&gt; {
            const angle = Math.PI - degree*Math.PI/180;
            const x = scx + Math.cos(angle)*arcR;
            const y = arcCy - Math.sin(angle)*arcR;
            circle(x, y, i === 0 || i === cumulative.length-1 ? 5 : 3.5, i === cumulative.length-1 ? &#x27;fhq-q-dot&#x27; : &#x27;&#x27;, i === cumulative.length-1 ? &#x27;&#x27; : &#x27;fill:var(--foreground)&#x27;);
          });
          textAt(scx, arcCy+23, &#x27;3+6+9+12+24+36+42+48 = 180°&#x27;, &#x27;fhq-label&#x27;, &#x27;middle&#x27;);

          const rx = panelXs[2];
          const ry = panelYs[2];
          const recordX = rx+20;
          const recordY = ry+(compact ? 62 : 92);
          const recordW = panelW-40;
          const recordH = compact ? 90 : 125;
          make(&#x27;rect&#x27;, { x: recordX, y: recordY, width: recordW, height: recordH, class: &#x27;fhq-record-box&#x27; });
          const maskX = recordX+recordW*0.42;
          make(&#x27;rect&#x27;, { x: maskX, y: recordY, width: recordW*0.2, height: recordH, class: &#x27;fhq-mask&#x27; });
          let recordD = `M ${recordX+10} ${recordY+recordH/2}`;
          for (let i=0; i&lt;=64; i+=1) {
            const u=i/64;
            const x=recordX+10+u*(recordW-20);
            const wave=Math.sin(u*Math.PI*10+janusHour*0.08)*0.6+Math.sin(u*Math.PI*22)*0.22;
            recordD += ` L ${x} ${recordY+recordH/2-wave*recordH*0.24}`;
          }
          path(recordD, &#x27;fhq-record&#x27;);
          textAt(recordX, recordY-12, &#x27;TRACE → MASK → RECORD&#x27;, &#x27;fhq-muted&#x27;);
          const returnY = ry+panelH-40;
          path(`M ${recordX+recordW} ${recordY+recordH+24} C ${recordX+recordW} ${returnY}, ${recordX+18} ${returnY}, ${recordX+18} ${recordY+recordH+24}`, &#x27;fhq-return&#x27;);
          arrow(recordX+18, recordY+recordH+24, -Math.PI/2, &#x27;fhq-return&#x27;);
          textAt(rx+panelW/2, returnY+20, &#x27;RETURN · RE-FEED&#x27;, &#x27;fhq-label&#x27;, &#x27;middle&#x27;);

          if (!compact) {
            const bridgeY = sy+panelH+62;
            path(`M ${rx+panelW/2} ${ry+panelH+28} C ${rx+panelW/2} ${bridgeY}, ${lx+panelW/2} ${bridgeY}, ${lx+panelW/2} ${ly+panelH+14}`, &#x27;fhq-return&#x27;);
            arrow(lx+panelW/2, ly+panelH+14, -Math.PI/2, &#x27;fhq-return&#x27;);
          }

          timeValue.textContent = `${t0.toFixed(1)} d`;
          stagePanel.textContent = activeStage === &#x27;mask&#x27; ? stageDescriptions.mask : &#x27;TRIPTYCHON · Licht erzeugt die Projektion, der Schatten hält die Maske, der Record kehrt als Faden zurück.&#x27;;
          if (!running &amp;&amp; !janusRunning) detail.textContent = `3+6+9+12+24+36+42+48 = 180° · SHADOW ist die aktive Mittelansicht.`;
          return;
        }

        const clocks = activeStage === &#x27;base&#x27; ? baseClocks : breathClocks;
        textAt(bankLeft, 22, activeStage === &#x27;base&#x27; ? &#x27;BASE CLOCKS Tⱼ&#x27; : &#x27;DISPLAY RHYTHMS Hⱼ&#x27;, &#x27;fhq-label&#x27;);
        textAt(qX, 22, &#x27;Q°(t₀)&#x27;, &#x27;fhq-label&#x27;, &#x27;middle&#x27;);
        line(qX, qTop, qX, qBottom, &#x27;fhq-q&#x27;);
        arrow(qX, qTop, -Math.PI/2, &#x27;fhq-q&#x27;);

        const cutPoints = [];
        clocks.forEach((clock, index) =&gt; {
          const y = startY + index * rowGap;
          const baseTurns = (t0 + janusHour/24) / clock.period;
          const phaseTurns = ((baseTurns + displayOffset) % 1 + 1) % 1;
          const phase = phaseTurns * Math.PI * 2 - Math.PI / 2;
          const degrees = phaseTurns * 360;
          const markerX = clockX + Math.cos(phase) * radius;
          const markerY = y + Math.sin(phase) * radius;
          const emphasized = activeStage === &#x27;h&#x27; || (activeStage === &#x27;beats&#x27; &amp;&amp; index &lt; 2) || activeStage === &#x27;base&#x27;;
          const style = `stroke:${clock.color};${emphasized ? &#x27;stroke-width:2.5&#x27; : &#x27;&#x27;}`;
          const fillStyle = `fill:${clock.color};stroke:var(--background);stroke-width:1.5`;

          textAt(bankLeft, y - 7, `${clock.id}  ${clock.name}`, &#x27;fhq-label&#x27;);
          textAt(bankLeft, y + 12, `${clock.display} · ${clock.kind}`, &#x27;fhq-muted&#x27;);
          circle(clockX, y, radius, &#x27;fhq-structure&#x27;, style);
          line(clockX, y, markerX, markerY, &#x27;&#x27;, style);
          circle(markerX, markerY, 5, &#x27;&#x27;, fillStyle);
          path(`M ${clockX+radius+9} ${y} C ${clockX+radius+35} ${y}, ${qX-42} ${y}, ${qX} ${y}`, &#x27;fhq-soft&#x27;, style);
          circle(qX, y, 5, &#x27;fhq-q-dot&#x27;);
          const phaseTextX = compact ? qX - 9 : qX + 12;
          const phaseAnchor = compact ? &#x27;end&#x27; : &#x27;start&#x27;;
          textAt(phaseTextX, y - 10, `φⱼ ${degrees.toFixed(index &gt; 2 ? 2 : 1)}°`, &#x27;fhq-muted&#x27;, phaseAnchor);
          cutPoints.push([qX, y, clock.color]);
        });

        if (activeStage === &#x27;q&#x27;) {
          line(qX-7, qTop+4, qX-7, qBottom-4, &#x27;fhq-focus&#x27;);
        }

        const projY = loom ? 690 : 330;
        const projX = loom ? width * (compact ? 0.42 : 0.56) : Math.min(width * 0.69, qX + 270);
        const pearlR = compact ? 54 : 62;
        cutPoints.forEach(([x, y, color], index) =&gt; {
          const targetY = projY + (index - 2) * 7;
          path(`M ${x+5} ${y} C ${x+50} ${y}, ${projX-pearlR-48} ${targetY}, ${projX-pearlR} ${targetY}`, &#x27;fhq-soft&#x27;, `stroke:${color}`);
        });

        cube(projX, projY, compact ? 155 : 185);
        make(&#x27;ellipse&#x27;, { cx: projX, cy: projY, rx: pearlR*1.55, ry: pearlR*0.75, class: &#x27;fhq-structure&#x27; });
        circle(projX, projY, pearlR, &#x27;fhq-pearl&#x27;);
        if (activeStage === &#x27;pi&#x27;) circle(projX, projY, pearlR+10, &#x27;fhq-focus&#x27;);
        make(&#x27;ellipse&#x27;, { cx: projX, cy: projY, rx: pearlR, ry: pearlR*0.3, class: &#x27;fhq-soft&#x27; });
        line(projX, projY-pearlR-58, projX, projY+pearlR+58, &#x27;fhq-q&#x27;);
        line(projX-pearlR*1.25, projY+pearlR*0.72, projX+pearlR*1.25, projY-pearlR*0.72, &#x27;fhq-cut&#x27;);
        textAt(projX, projY+4, &#x27;Φπ&#x27;, &#x27;fhq-label&#x27;, &#x27;middle&#x27;);
        textAt(projX, projY-pearlR-70, &#x27;T⁴ CARRIER&#x27;, &#x27;fhq-label&#x27;, &#x27;middle&#x27;);
        textAt(projX+pearlR*1.12, projY-pearlR*0.72-8, &#x27;ι · IOTA CUT&#x27;, &#x27;fhq-muted&#x27;, &#x27;start&#x27;);
        textAt(projX, projY+pearlR+80, &#x27;T³(q) · PROJECTED STATE&#x27;, &#x27;fhq-label&#x27;, &#x27;middle&#x27;);

        const recordX = loom ? width * 0.15 : Math.min(width-155, projX+170);
        const recordY = loom ? 850 : projY-58;
        const recordW = loom ? width * 0.70 : Math.max(110, width-recordX-28);
        const recordH = 116;
        make(&#x27;rect&#x27;, { x: recordX, y: recordY, width: recordW, height: recordH, rx: 0, class: &#x27;fhq-record-box&#x27; });
        if (activeStage === &#x27;mask&#x27;) {
          make(&#x27;rect&#x27;, { x: recordX+recordW*0.38, y: recordY, width: recordW*0.28, height: recordH, class: &#x27;fhq-mask&#x27; });
          line(recordX+recordW*0.38, recordY, recordX+recordW*0.38, recordY+recordH, &#x27;fhq-q&#x27;);
          line(recordX+recordW*0.66, recordY, recordX+recordW*0.66, recordY+recordH, &#x27;fhq-q&#x27;);
        }
        const midY = recordY + recordH/2;
        const amp = Math.min(24, recordH*0.22);
        let d = `M ${recordX+12} ${midY}`;
        for (let i = 0; i &lt;= 72; i += 1) {
          const u = i/72;
          const x = recordX+12 + u*(recordW-24);
          const wave = Math.sin(u*Math.PI*8 + t0*0.035)*0.58 + Math.sin(u*Math.PI*18 + t0*0.09)*0.28;
          d += ` L ${x} ${midY-wave*amp}`;
        }
        path(d, activeStage === &#x27;trace&#x27; ? &#x27;fhq-record fhq-focus&#x27; : &#x27;fhq-record&#x27;);

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
