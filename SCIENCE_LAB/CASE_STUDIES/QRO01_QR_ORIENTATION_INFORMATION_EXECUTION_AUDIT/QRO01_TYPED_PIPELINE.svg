<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="520"><rect width="1700" height="520" fill="#f8fafc"/><text x="60" y="60" font-family="Arial" font-size="36" font-weight="700" fill="#172033">QRO-01 · TYPED QR PIPELINE</text><rect x="60" y="120" width="220" height="90" rx="12" fill="#334155"/><text x="170" y="174" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">CARRIER</text><path d="M280 165 H315" stroke="#172033" stroke-width="4"/><path d="M308 157 L320 165 L308 173" fill="none" stroke="#172033" stroke-width="4"/><rect x="330" y="120" width="220" height="90" rx="12" fill="#2563eb"/><text x="440" y="174" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">CAPTURE</text><path d="M550 165 H585" stroke="#172033" stroke-width="4"/><path d="M578 157 L590 165 L578 173" fill="none" stroke="#172033" stroke-width="4"/><rect x="600" y="120" width="220" height="90" rx="12" fill="#0f766e"/><text x="710" y="174" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">ORIENT / SAMPLE</text><path d="M820 165 H855" stroke="#172033" stroke-width="4"/><path d="M848 157 L860 165 L848 173" fill="none" stroke="#172033" stroke-width="4"/><rect x="870" y="120" width="220" height="90" rx="12" fill="#b45309"/><text x="980" y="174" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">DECODE</text><path d="M1090 165 H1125" stroke="#172033" stroke-width="4"/><path d="M1118 157 L1130 165 L1118 173" fill="none" stroke="#172033" stroke-width="4"/><rect x="1140" y="120" width="220" height="90" rx="12" fill="#7e22ce"/><text x="1250" y="174" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">PAYLOAD</text><path d="M1360 165 H1395" stroke="#172033" stroke-width="4"/><path d="M1388 157 L1400 165 L1388 173" fill="none" stroke="#172033" stroke-width="4"/><rect x="1410" y="120" width="220" height="90" rx="12" fill="#be123c"/><text x="1520" y="174" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">EXECUTE?</text><text x="60" y="285" font-family="Arial" font-size="27" font-weight="700" fill="#172033">CARRIER ≠ INFORMATION ≠ EXECUTION</text><text x="60" y="335" font-family="Arial" font-size="24" fill="#334155">Reference and spatial position enable decoding; they do not supply payload semantics.</text><text x="60" y="385" font-family="Arial" font-size="24" fill="#334155">Decoded content remains inert unless an explicit policy and execution environment produce an event.</text><text x="60" y="455" font-family="Arial" font-size="23" font-weight="700" fill="#7e22ce">RESULT: PARTIAL TYPING · QR-SPECIFIC SPECIALIZATIONS REQUIRED · NO NEW OPERATOR</text></svg>