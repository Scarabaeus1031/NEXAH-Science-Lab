<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">GARC-01 same graph, two embeddings</title>
  <desc id="desc">Two drawings of the same three-leaf star graph have different local angles at their central vertex.</desc>
  <rect width="1000" height="480" fill="#fafafa"/>
  <style>
    .edge{stroke:#334155;stroke-width:5;stroke-linecap:round}.node{fill:#fff;stroke:#0f766e;stroke-width:4}.center{fill:#f59e0b}.label{font:22px system-ui,sans-serif;fill:#0f172a}.small{font:18px system-ui,sans-serif;fill:#475569}.arc{fill:none;stroke:#e11d48;stroke-width:4}
  </style>
  <text x="250" y="45" text-anchor="middle" class="label">Embedding 1</text>
  <text x="750" y="45" text-anchor="middle" class="label">Embedding 2</text>
  <g>
    <line class="edge" x1="250" y1="250" x2="390" y2="250"/><line class="edge" x1="250" y1="250" x2="250" y2="110"/><line class="edge" x1="250" y1="250" x2="110" y2="250"/>
    <circle class="node center" cx="250" cy="250" r="13"/><circle class="node" cx="390" cy="250" r="13"/><circle class="node" cx="250" cy="110" r="13"/><circle class="node" cx="110" cy="250" r="13"/>
    <path class="arc" d="M 305 250 A 55 55 0 0 0 250 195"/><text x="292" y="206" class="small">90°</text>
    <text x="250" y="420" text-anchor="middle" class="small">degree sequence: 3,1,1,1</text>
  </g>
  <g>
    <line class="edge" x1="750" y1="250" x2="890" y2="250"/><line class="edge" x1="750" y1="250" x2="850" y2="150"/><line class="edge" x1="750" y1="250" x2="650" y2="150"/>
    <circle class="node center" cx="750" cy="250" r="13"/><circle class="node" cx="890" cy="250" r="13"/><circle class="node" cx="850" cy="150" r="13"/><circle class="node" cx="650" cy="150" r="13"/>
    <path class="arc" d="M 805 250 A 55 55 0 0 0 789 211"/><text x="816" y="211" class="small">45°</text>
    <text x="750" y="420" text-anchor="middle" class="small">degree sequence: 3,1,1,1</text>
  </g>
  <text x="500" y="462" text-anchor="middle" class="label">Same abstract graph; different embedded Euclidean angles</text>
</svg>
