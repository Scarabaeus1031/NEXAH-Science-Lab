<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">ETRI-01 transform invariant map</title>
  <desc id="desc">Reflection re-embeds one graph, while adding a perpendicular creates an augmented graph.</desc>
  <rect width="1200" height="700" fill="#fafafa"/>
  <style>
    .box{fill:#fff;stroke:#0f766e;stroke-width:3}.aug{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)}.title{font:27px system-ui,sans-serif;fill:#0f172a}.text{font:20px system-ui,sans-serif;fill:#0f172a}.small{font:17px system-ui,sans-serif;fill:#475569}.micro{font:15px system-ui,sans-serif;fill:#475569}.edge{stroke:#334155;stroke-width:4}.mirror{stroke:#2563eb;stroke-width:3;stroke-dasharray:9 7}.lot{stroke:#c2410c;stroke-width:4}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="600" y="42" text-anchor="middle" class="title">Re-embedding and graph augmentation are different operations</text>
  <text x="315" y="92" text-anchor="middle" class="text">REFLECTION: SAME GRAPH G</text>
  <g>
    <rect class="box" x="70" y="120" width="190" height="65" rx="12"/><text x="165" y="160" text-anchor="middle" class="text">ORIGINAL E1</text>
    <path class="arrow" d="M260 152 H355"/><text x="308" y="135" text-anchor="middle" class="small">reflection T</text>
    <rect class="box" x="360" y="120" width="190" height="65" rx="12"/><text x="455" y="160" text-anchor="middle" class="text">REFLECTED E2</text>
    <line class="edge" x1="115" y1="300" x2="215" y2="300"/><line class="edge" x1="115" y1="300" x2="180" y2="220"/><line class="edge" x1="215" y1="300" x2="180" y2="220"/>
    <line class="mirror" x1="315" y1="205" x2="315" y2="330"/>
    <line class="edge" x1="415" y1="300" x2="515" y2="300"/><line class="edge" x1="415" y1="300" x2="450" y2="220"/><line class="edge" x1="515" y1="300" x2="450" y2="220"/>
    <text x="315" y="355" text-anchor="middle" class="micro">coordinates and orientation change</text>
    <text x="315" y="378" text-anchor="middle" class="micro">adjacency and unsigned angles survive</text>
  </g>
  <text x="890" y="92" text-anchor="middle" class="text">ADD LOT: G → G+</text>
  <g>
    <rect class="box" x="650" y="120" width="190" height="65" rx="12"/><text x="745" y="160" text-anchor="middle" class="text">TRIANGLE G</text>
    <path class="arrow" d="M840 152 H935"/><text x="888" y="135" text-anchor="middle" class="small">add H, PH</text>
    <rect class="aug" x="940" y="120" width="190" height="65" rx="12"/><text x="1035" y="160" text-anchor="middle" class="text">AUGMENTED G+</text>
    <line class="edge" x1="695" y1="300" x2="795" y2="300"/><line class="edge" x1="695" y1="300" x2="750" y2="220"/><line class="edge" x1="795" y1="300" x2="750" y2="220"/>
    <line class="edge" x1="985" y1="300" x2="1085" y2="300"/><line class="edge" x1="985" y1="300" x2="1040" y2="220"/><line class="edge" x1="1085" y1="300" x2="1040" y2="220"/><line class="lot" x1="1040" y1="220" x2="1040" y2="300"/>
    <text x="890" y="355" text-anchor="middle" class="micro">new vertex, incidence and edges</text>
    <text x="890" y="378" text-anchor="middle" class="micro">counts, degrees and cycles change</text>
  </g>
  <rect class="box" x="315" y="470" width="570" height="90" rx="14"/><text x="600" y="510" text-anchor="middle" class="text">RE-EMBEDDING OF G ≠ AUGMENTATION G → G+</text><text x="600" y="540" text-anchor="middle" class="micro">A transform maps existing objects; augmentation introduces new geometry.</text>
  <text x="600" y="640" text-anchor="middle" class="small">Neutral Euclidean construction · no symbolic semantics · no measurement event</text>
</svg>
