<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">GAVP-01 operation type map</title>
  <desc id="desc">A neutral map asks what changed across structure, geometry and view, and separates augmentation, transformation, partition, observation and viewing.</desc>
  <rect width="1300" height="760" fill="#fafafa"/>
  <style>
    .box{fill:#fff;stroke:#0f766e;stroke-width:3}.head{fill:#fff7ed;stroke:#c2410c;stroke-width:3}.view{fill:#eff6ff;stroke:#1d4ed8;stroke-width:3}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)}.title{font:28px system-ui,sans-serif;fill:#0f172a}.text{font:19px system-ui,sans-serif;fill:#0f172a}.small{font:16px system-ui,sans-serif;fill:#475569}.neq{font:20px system-ui,sans-serif;font-weight:600;fill:#991b1b}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="650" y="42" text-anchor="middle" class="title">WHAT CHANGED?</text>
  <rect class="head" x="510" y="70" width="280" height="65" rx="14"/><text x="650" y="110" text-anchor="middle" class="text">REGISTERED SOURCE</text>
  <path class="arrow" d="M650 135 V185 H220 V220"/><path class="arrow" d="M650 185 V220"/><path class="arrow" d="M650 185 H1080 V220"/>
  <g class="text" text-anchor="middle">
    <rect class="box" x="105" y="220" width="230" height="70" rx="12"/><text x="220" y="251">G ?</text><text x="220" y="276" class="small">SOURCE STRUCTURE</text>
    <rect class="box" x="535" y="220" width="230" height="70" rx="12"/><text x="650" y="251">E ?</text><text x="650" y="276" class="small">GEOMETRY</text>
    <rect class="view" x="965" y="220" width="230" height="70" rx="12"/><text x="1080" y="251">V ?</text><text x="1080" y="276" class="small">VIEW</text>
  </g>
  <path class="arrow" d="M220 290 V350"/><path class="arrow" d="M650 290 V350"/><path class="arrow" d="M1080 290 V350"/>
  <g class="text" text-anchor="middle">
    <rect class="box" x="105" y="350" width="230" height="65" rx="12"/><text x="220" y="390">AUGMENTATION</text>
    <rect class="box" x="535" y="350" width="230" height="65" rx="12"/><text x="650" y="390">TRANSFORM</text>
    <rect class="view" x="965" y="350" width="230" height="65" rx="12"/><text x="1080" y="390">OBSERVE / VIEW</text>
  </g>
  <rect class="box" x="535" y="470" width="230" height="65" rx="12"/><text x="650" y="510" text-anchor="middle" class="text">PARTITION RESULT</text>
  <path class="arrow" d="M335 382 C440 382 440 502 530 502"/><path class="arrow" d="M1080 415 C1080 520 830 502 770 502"/>
  <text x="650" y="600" text-anchor="middle" class="neq">AUGMENT ≠ TRANSFORM ≠ PARTITION ≠ OBSERVE ≠ VIEW</text>
  <text x="650" y="640" text-anchor="middle" class="small">Operation rule · application event · result object · provenance record remain distinct.</text>
  <text x="650" y="705" text-anchor="middle" class="text">SEE THE RELATION. KEEP THE DIFFERENCE. TYPE THE CHANGE.</text>
</svg>
