<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">AREV-01 relation-to-view pipeline</title>
  <desc id="desc">Neutral typed pipeline from anchor through rays, junction, embedding and metric angle to view, plus the same-graph different-angle control.</desc>
  <rect width="1200" height="560" fill="#fafafa"/>
  <style>
    .box{fill:#fff;stroke:#0f766e;stroke-width:3;rx:14}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#m)}.title{font:26px system-ui,sans-serif;fill:#0f172a}.text{font:20px system-ui,sans-serif;fill:#0f172a}.small{font:17px system-ui,sans-serif;fill:#475569}.edge{stroke:#334155;stroke-width:4}.node{fill:#f59e0b;stroke:#0f766e;stroke-width:3}.arc{stroke:#e11d48;stroke-width:3;fill:none}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
  <text x="600" y="42" text-anchor="middle" class="title">Typed relation-to-view pipeline</text>
  <g class="text" text-anchor="middle">
    <rect class="box" x="35" y="90" width="150" height="70"/><text x="110" y="133">ANCHOR</text>
    <rect class="box" x="235" y="90" width="150" height="70"/><text x="310" y="133">RAYS</text>
    <rect class="box" x="435" y="90" width="150" height="70"/><text x="510" y="133">V / Y</text>
    <rect class="box" x="635" y="90" width="150" height="70"/><text x="710" y="133">EMBEDDING</text>
    <rect class="box" x="835" y="90" width="150" height="70"/><text x="910" y="133">ANGLE</text>
    <rect class="box" x="1035" y="90" width="130" height="70"/><text x="1100" y="133">VIEW</text>
  </g>
  <path class="arrow" d="M185 125 H230"/><path class="arrow" d="M385 125 H430"/><path class="arrow" d="M585 125 H630"/><path class="arrow" d="M785 125 H830"/><path class="arrow" d="M985 125 H1030"/>
  <text x="600" y="215" text-anchor="middle" class="small">Graph incidence precedes embedding; metric angle precedes observed view.</text>
  <text x="600" y="270" text-anchor="middle" class="title">Same graph, different embeddings</text>
  <g>
    <text x="160" y="350" text-anchor="middle" class="text">same G: K₁,₃</text>
    <path class="arrow" d="M235 343 H350"/>
    <text x="430" y="320" text-anchor="middle" class="text">E1</text>
    <line class="edge" x1="430" y1="410" x2="500" y2="410"/><line class="edge" x1="430" y1="410" x2="430" y2="340"/><line class="edge" x1="430" y1="410" x2="360" y2="410"/><circle class="node" cx="430" cy="410" r="10"/>
    <path class="arc" d="M470 410 A40 40 0 0 0 430 370"/><text x="470" y="375" class="small">90°</text>
    <path class="arrow" d="M535 343 H650"/>
    <text x="730" y="320" text-anchor="middle" class="text">E2</text>
    <line class="edge" x1="730" y1="410" x2="800" y2="410"/><line class="edge" x1="730" y1="410" x2="780" y2="360"/><line class="edge" x1="730" y1="410" x2="680" y2="360"/><circle class="node" cx="730" cy="410" r="10"/>
    <path class="arc" d="M770 410 A40 40 0 0 0 758 382"/><text x="780" y="382" class="small">45°</text>
    <text x="980" y="350" text-anchor="middle" class="text">degree 3 unchanged</text>
  </g>
  <text x="600" y="530" text-anchor="middle" class="small">No symbolic semantics · no quaternion claim · no implementation</text>
</svg>
