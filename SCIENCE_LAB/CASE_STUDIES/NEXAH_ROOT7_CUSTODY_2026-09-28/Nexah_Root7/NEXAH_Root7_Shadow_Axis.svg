<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">√7 und die Shadow Axis: 4D-Vektor und 3D-Projektion</title>
<desc id="desc">Rechtwinklige metrische Skizze: Die Projektion (2,1,1) hat Länge √6. Eine senkrechte vierte Koordinate der Länge 1 ergibt für (2,1,1,1) die volle Länge √7. √7 ist keine Strecke zwischen Eckpunkten des dreidimensionalen Einheitsgitters.</desc>
<rect width="1200" height="760" fill="#0d1724"/>
<text x="70" y="85" fill="#f1f4f8" font-family="DejaVu Sans,sans-serif" font-size="43" font-weight="bold">√7 · Shadow Axis</text>
<text x="70" y="125" fill="#a7bad0" font-family="DejaVu Sans,sans-serif" font-size="22">Eine exakte Projektion – keine verborgene Kante im 3D-Würfel</text>

<rect x="70" y="165" width="1060" height="430" rx="24" fill="#142439" stroke="#35506a" stroke-width="2"/>
<text x="110" y="220" fill="#d9e6f4" font-family="DejaVu Sans,sans-serif" font-size="22">Metrischer Schnitt durch die 4D-Konstruktion</text>

<!-- Scale: 200 pixels per unit; the base is sqrt(6)*200. -->
<line x1="225" y1="490" x2="714.898" y2="490" stroke="#55c8df" stroke-width="8" stroke-linecap="round"/>
<line x1="714.898" y1="490" x2="714.898" y2="290" stroke="#e9a955" stroke-width="8" stroke-linecap="round"/>
<line x1="225" y1="490" x2="714.898" y2="290" stroke="#ed73a1" stroke-width="8" stroke-linecap="round"/>
<path d="M 689 490 L 689 464 L 714.898 464" fill="none" stroke="#dce5ef" stroke-width="2"/>

<circle cx="225" cy="490" r="9" fill="#f6f8fa"/>
<circle cx="714.898" cy="490" r="9" fill="#55c8df"/>
<circle cx="714.898" cy="290" r="9" fill="#ed73a1"/>
<text x="187" y="532" fill="#f1f4f8" font-family="DejaVu Sans,sans-serif" font-size="22">O</text>
<text x="692" y="536" fill="#d7f6fc" font-family="DejaVu Sans,sans-serif" font-size="21">P = (2,1,1)</text>
<text x="731" y="282" fill="#ffe1eb" font-family="DejaVu Sans,sans-serif" font-size="21">Q = (2,1,1,1)</text>

<rect x="407" y="506" width="132" height="49" rx="13" fill="#1a4558"/>
<text x="426" y="541" fill="#aef1ff" font-family="DejaVu Sans,sans-serif" font-size="29" font-weight="bold">√6</text>
<text x="502" y="541" fill="#c5e1ea" font-family="DejaVu Sans,sans-serif" font-size="16">3D</text>
<rect x="430" y="347" width="141" height="47" rx="13" fill="#563046"/>
<text x="448" y="380" fill="#ffd0e0" font-family="DejaVu Sans,sans-serif" font-size="27" font-weight="bold">√7</text>
<text x="511" y="380" fill="#f5cedb" font-family="DejaVu Sans,sans-serif" font-size="16">4D</text>
<text x="735" y="397" fill="#ffc98a" font-family="DejaVu Sans,sans-serif" font-size="21">w = 1</text>
<text x="735" y="425" fill="#ffc98a" font-family="DejaVu Sans,sans-serif" font-size="18">Shadow Axis</text>

<text x="71" y="647" fill="#f1f4f8" font-family="DejaVu Sans,sans-serif" font-size="24">2² + 1² + 1² = 6</text>
<text x="439" y="647" fill="#f1f4f8" font-family="DejaVu Sans,sans-serif" font-size="24">6 + 1² = 7</text>
<text x="70" y="700" fill="#a7bad0" font-family="DejaVu Sans,sans-serif" font-size="20">3D-Gitter: kein x² + y² + z² = 7 mit ganzzahligen x, y, z.</text>
<text x="70" y="731" fill="#a7bad0" font-family="DejaVu Sans,sans-serif" font-size="18">Die senkrechte Linie steht für eine zusätzliche Koordinate; die Skizze zeigt Längen, keine perspektivische 4D-Abbildung.</text>
</svg>
