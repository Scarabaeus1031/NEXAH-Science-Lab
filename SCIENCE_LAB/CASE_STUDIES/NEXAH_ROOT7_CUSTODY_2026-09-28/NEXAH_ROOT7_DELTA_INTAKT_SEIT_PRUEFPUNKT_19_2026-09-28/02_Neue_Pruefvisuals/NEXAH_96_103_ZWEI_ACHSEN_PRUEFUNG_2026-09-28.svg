<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
<title id="title">Zwei Achsen auf der Möbius Cubic Chain 96 bis 103</title>
<desc id="desc">Exakte Zahlengerade mit dem Primzahlpaar 97 und 101 um 99 sowie dem Primzahlpaar 97 und 103 um 100. Die Achse verschiebt sich um eins, während der rechte Endpunkt um zwei wandert.</desc>
<defs><style>
text{font-family:Inter,Arial,Helvetica,sans-serif;fill:#e9f2fc}.title{font-size:39px;font-weight:750}.sub{font-size:18px;fill:#afc1d6}.h{font-size:25px;font-weight:700}.tiny{font-size:16px;fill:#a8c0d9}.num{font-size:31px;font-weight:750}.cyan{fill:#5bdded}.gold{fill:#ffd06d}.rose{fill:#f592b7}.panel{fill:#112138;stroke:#2a485c;stroke-width:2}.axis{stroke-width:4;stroke-dasharray:8 8}.arc{fill:none;stroke-width:5;stroke-linecap:round}
</style><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a7bcd1"/></marker></defs>
<rect width="1400" height="800" fill="#081422"/>
<text x="60" y="73" class="title">96 → 101: zwei benachbarte Achsen</text>
<text x="60" y="106" class="sub">Abgleich mit „Möbius Cubic Chain“ und „Janus Prime Axis 97–103“ · geprüfte Zahlbeziehungen</text>
<rect x="50" y="134" width="1300" height="394" rx="18" class="panel"/>
<text x="77" y="175" class="h">Gleiche Zahlengerade · unterschiedliche Schnitte</text>
<path d="M155 346H1230" stroke="#7794ad" stroke-width="3" marker-end="url(#ar)"/>
<path d="M575 220V471" class="axis" stroke="#ffd06d"/><path d="M715 220V471" class="axis" stroke="#f592b7"/>
<path d="M295 276Q575 176 855 276" class="arc" stroke="#ffd06d"/>
<path d="M295 416Q715 536 1135 416" class="arc" stroke="#f592b7"/>
<text x="485" y="205" class="tiny gold">Hinge: 97 ↔ 101 · Mitte 99</text>
<text x="597" y="442" class="tiny rose">Janus: 97 ↔ 103 · Mitte 100</text>
<g text-anchor="middle">
<text x="155" y="333" class="num">96</text><text x="295" y="333" class="num cyan">97</text><text x="435" y="333" class="num">98</text><text x="575" y="333" class="num gold">99</text><text x="715" y="333" class="num rose">100</text><text x="855" y="333" class="num cyan">101</text><text x="995" y="333" class="num">102</text><text x="1135" y="333" class="num cyan">103</text>
<text x="155" y="377" class="tiny">−3</text><text x="295" y="377" class="tiny">−2</text><text x="435" y="377" class="tiny">−1</text><text x="575" y="377" class="tiny gold">0</text><text x="715" y="377" class="tiny rose">+1</text><text x="855" y="377" class="tiny">+2</text><text x="995" y="377" class="tiny">+3</text><text x="1135" y="377" class="tiny">+4</text>
</g>
<text x="73" y="510" class="tiny">Reste relativ zu 99 (mod 33): −3, −2, −1, 0, +1, +2, +3, +4</text>

<rect x="50" y="552" width="625" height="194" rx="18" class="panel"/><rect x="696" y="552" width="654" height="194" rx="18" class="panel"/>
<text x="78" y="595" class="h gold">Achsenwechsel +1</text>
<text x="78" y="634" class="sub">99 = 3 × 33 = 9 × 11; 100 = 99 + 1.</text>
<text x="78" y="670" class="sub">97 bleibt links. Rechts: 101 → 103 (+2).</text>
<text x="78" y="708" class="tiny">Kein Verschieben des gesamten Zahlenpaares.</text>
<text x="725" y="595" class="h rose">Grenze der Interpretation</text>
<text x="725" y="634" class="sub">101 = P₂₆ kann Ausgangspunkt des 101-Kanals sein.</text>
<text x="725" y="670" class="sub">„Möbius“, „Zeitlücke“ und „Fold“ brauchen</text>
<text x="725" y="699" class="sub">je einen definierten Operator oder Zustandswechsel.</text>
<text x="58" y="785" class="tiny">Geprüft: 97, 101, 103 sind prim; die Mittelpunkte sind 99 und 100. Ein 404-Gate folgt daraus nicht automatisch.</text>
</svg>
