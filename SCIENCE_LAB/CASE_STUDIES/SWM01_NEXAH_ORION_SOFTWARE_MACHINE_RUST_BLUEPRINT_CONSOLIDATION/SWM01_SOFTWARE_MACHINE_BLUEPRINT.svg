<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">SWM-01 Software Machine Blueprint</title>
  <desc id="desc">A non-authoritative diagram separating source, structure, observation, view, comparison, result, event, history, provenance and return-family assessment.</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.box{fill:#fff;stroke:#283241;stroke-width:2}.branch{fill:#eef5ff}.measure{fill:#f1fbf5}.result{fill:#fff7e8}.history{fill:#f4effc}.t{font:600 18px system-ui,sans-serif;fill:#17202c}.s{font:14px system-ui,sans-serif;fill:#344052}.tiny{font:12px system-ui,sans-serif;fill:#4a5565}.line{stroke:#536273;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke:#7a6b91;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#536273"/></marker>
  </defs>
  <rect class="bg" width="1200" height="900"/>
  <text class="t" x="600" y="40" text-anchor="middle">SWM-01 — Provenance-Preserving Typed Blueprint</text>
  <rect class="box" x="410" y="65" width="380" height="70" rx="10"/>
  <text class="t" x="600" y="95" text-anchor="middle">REGISTERED SOURCE + STATE</text>
  <text class="s" x="600" y="119" text-anchor="middle">ObjectId · RevisionRef · ProvenanceRecord</text>
  <path class="line" d="M520 135 L300 185"/><path class="line" d="M680 135 L900 185"/>
  <rect class="box branch" x="90" y="185" width="420" height="145" rx="12"/>
  <text class="t" x="300" y="218" text-anchor="middle">STRUCTURE / GEOMETRY</text>
  <text class="s" x="300" y="249" text-anchor="middle">Graph · Relation · Constraint</text>
  <text class="s" x="300" y="276" text-anchor="middle">Anchor · Ray · Edge · Junction</text>
  <text class="s" x="300" y="303" text-anchor="middle">Embedding · Frame · Metric</text>
  <rect class="box measure" x="690" y="185" width="420" height="145" rx="12"/>
  <text class="t" x="900" y="218" text-anchor="middle">OBSERVATION / MEASUREMENT</text>
  <text class="s" x="900" y="249" text-anchor="middle">ObservationMap · ObservableDefinition</text>
  <text class="s" x="900" y="276" text-anchor="middle">MeasurementEvent · MeasurementValue</text>
  <text class="s" x="900" y="303" text-anchor="middle">Readout</text>
  <path class="line" d="M300 330 L505 385"/><path class="line" d="M900 330 L695 385"/>
  <rect class="box" x="405" y="370" width="390" height="78" rx="10"/>
  <text class="t" x="600" y="401" text-anchor="middle">VIEW</text>
  <text class="s" x="600" y="428" text-anchor="middle">GeometrySource | MeasurementSource | CompositeSource</text>
  <path class="line" d="M600 448 L600 495"/>
  <rect class="box" x="450" y="495" width="300" height="70" rx="10"/>
  <text class="t" x="600" y="525" text-anchor="middle">COMPARE EVENT</text>
  <text class="s" x="600" y="549" text-anchor="middle">declared rule + criterion</text>
  <path class="line" d="M515 565 L275 615"/><path class="line" d="M600 565 L600 615"/><path class="line" d="M685 565 L925 615"/>
  <rect class="box result" x="110" y="615" width="330" height="90" rx="10"/>
  <text class="t" x="275" y="648" text-anchor="middle">INVARIANT / DIFFERENCE</text><text class="s" x="275" y="680" text-anchor="middle">Residual under declared model only</text>
  <rect class="box result" x="435" y="615" width="330" height="90" rx="10"/>
  <text class="t" x="600" y="648" text-anchor="middle">AMBIGUITY / ABSTAIN</text><text class="s" x="600" y="680" text-anchor="middle">no forced selection</text>
  <rect class="box result" x="760" y="615" width="330" height="90" rx="10"/>
  <text class="t" x="925" y="648" text-anchor="middle">RECONSTRUCT / DECIDE</text><text class="s" x="925" y="680" text-anchor="middle">separate rule, event and result</text>
  <path class="line" d="M275 705 L460 755"/><path class="line" d="M600 705 L600 755"/><path class="line" d="M925 705 L740 755"/>
  <rect class="box history" x="300" y="755" width="600" height="90" rx="10"/>
  <text class="t" x="600" y="788" text-anchor="middle">EVENT → RESULT → HISTORY + PROVENANCE</text>
  <text class="s" x="600" y="819" text-anchor="middle">ReturnAssessment · Reset · Repeat · Restart (history retained)</text>
  <path class="dash" d="M300 800 C110 800,110 100,410 100"/>
  <text class="tiny" x="142" y="455" transform="rotate(-90 142 455)">return may satisfy a state criterion; it never erases the path</text>
  <text class="tiny" x="600" y="880" text-anchor="middle">DOCUMENTARY BLUEPRINT ONLY · NO RUST SOURCE · NO ORION ACTIVATION</text>
</svg>
