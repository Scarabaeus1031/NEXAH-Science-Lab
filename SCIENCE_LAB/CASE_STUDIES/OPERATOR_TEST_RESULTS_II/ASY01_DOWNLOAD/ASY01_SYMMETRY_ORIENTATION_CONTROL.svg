<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<rect width="1500" height="760" fill="#f4f7fb"/>
<text x="750" y="70" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#182431">ASY-01 · SYMMETRY / ORIENTATION CONTROL</text>
<text x="750" y="112" text-anchor="middle" font-family="Arial" font-size="22" fill="#536879">Static geometry distinguishes orientation — not motion</text>
<g transform="translate(250 330)"><circle r="120" fill="none" stroke="#2477c5" stroke-width="8"/><text y="185" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#182431">S0 · SO(2)</text><text y="220" text-anchor="middle" font-family="Arial" font-size="20" fill="#536879">orientation unresolved</text></g>
<g transform="translate(750 330)"><circle r="120" fill="none" stroke="#2477c5" stroke-width="8"/><rect x="115" y="-24" width="70" height="48" fill="#e58b00"/><text y="185" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#182431">S1 · C1</text><text y="220" text-anchor="middle" font-family="Arial" font-size="20" fill="#536879">registered orientation identifiable</text></g>
<g transform="translate(1250 330)"><circle r="120" fill="none" stroke="#2477c5" stroke-width="8"/><rect x="115" y="-24" width="70" height="48" fill="#e58b00"/><rect x="-185" y="-24" width="70" height="48" fill="#e58b00"/><text y="185" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#182431">S2 · C2</text><text y="220" text-anchor="middle" font-family="Arial" font-size="20" fill="#536879">orientation only modulo 180°</text></g>
<path d="M405 330 H565" stroke="#536879" stroke-width="5" marker-end="url(#a)"/><text x="485" y="300" text-anchor="middle" font-family="Arial" font-size="20" fill="#536879">add one feature</text>
<path d="M905 330 H1065" stroke="#536879" stroke-width="5" marker-end="url(#a)"/><text x="985" y="300" text-anchor="middle" font-family="Arial" font-size="20" fill="#536879">duplicate opposite</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#536879"/></marker></defs>
<rect x="120" y="610" width="1260" height="95" rx="18" fill="#fff" stroke="#2477c5" stroke-width="4"/>
<text x="750" y="650" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#182431">ASYMMETRY → ORIENTATION INFORMATION</text>
<text x="750" y="685" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#b4234d">ASYMMETRY ↛ MOTION</text>
</svg>