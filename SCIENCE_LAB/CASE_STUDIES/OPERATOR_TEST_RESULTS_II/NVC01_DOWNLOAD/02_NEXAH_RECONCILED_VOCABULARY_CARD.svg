<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2400" viewBox="0 0 1800 2400">
<defs><style>
.t{font-family:Arial,sans-serif;fill:#172033}.h{font-weight:700}.small{font-size:24px}.body{font-size:27px}.sub{font-size:34px}.title{font-size:62px}.mono{font-family:Menlo,monospace;font-size:23px}.box{stroke-width:3}.pill{font-size:23px;font-weight:700}.muted{fill:#536274}
</style></defs><rect width="1800" height="2400" fill="#f4f7fb"/>
<text x="900" y="90" text-anchor="middle" class="t title h">NEXAH — RECONCILED VOCABULARY</text>
<text x="900" y="138" text-anchor="middle" class="t sub">WHAT SURVIVED — WHAT IT IS — WHAT WE NEED</text>
<text x="900" y="185" text-anchor="middle" class="t body h" fill="#155e75">SEE THE RELATION. KEEP THE DIFFERENCE.</text>

<rect x="70" y="230" width="1660" height="250" rx="22" fill="#e6eef8" stroke="#315a87" class="box"/>
<text x="105" y="278" class="t sub h">I · TYPES / THINGS</text>
<text x="105" y="325" class="t body">OBJECT / ID · STATE / OBS · ORIENTATION · PROVENANCE</text>
<text x="105" y="365" class="t body">GENERATION · EXECUTION · TRACE</text>
<text x="105" y="418" class="t small h">STATE ≠ IDENTITY   ·   TRACE ≠ PROVENANCE   ·   EXECUTION ≠ OPERATOR</text>
<text x="105" y="452" class="t small h">ORIENTATION ≠ MOTION   ·   GENERATION ≠ TRANSFORMATION</text>

<rect x="70" y="510" width="1660" height="620" rx="22" fill="#eaf6ee" stroke="#287a48" class="box"/>
<text x="105" y="558" class="t sub h">II · OPERATORS — 14</text>
<text x="105" y="605" class="t small h">DISTINGUISH / DIFFERENTIATE</text><text x="620" y="605" class="t body">BRANCH · COPY</text>
<text x="105" y="660" class="t small h">PRESERVE / REORIENT</text><text x="620" y="660" class="t body">REFLECT · ROTATE · TRANSLATE · SCALE</text>
<text x="105" y="715" class="t small h">RELATE / BIND</text><text x="620" y="715" class="t body">BIND · CONVERGE</text>
<text x="105" y="770" class="t small h">REPRESENT / OBSERVE</text><text x="620" y="770" class="t body">PROJECT · OBSERVE</text>
<text x="105" y="825" class="t small h">CONTEXT-DEPENDENT EFFECT</text><text x="620" y="825" class="t body">TRANSFORM · REPEAT · NORMALIZE · CORRECT</text>
<line x1="105" y1="865" x2="1690" y2="865" stroke="#70a786" stroke-width="2"/>
<text x="105" y="910" class="t small">REFLECT: carrier → reflected carrier     ROTATE: oriented carrier → reoriented carrier</text>
<text x="105" y="950" class="t small">BRANCH: state → addressable descendants     COPY: object → copy candidate</text>
<text x="105" y="990" class="t small">PROJECT: carrier → representation     OBSERVE: state → observation / OBS</text>
<text x="105" y="1030" class="t small">BIND: relation → addressable relation     CONVERGE: paths → shared-target relation</text>
<text x="105" y="1070" class="t small h">Presentation groups are not new operator types. BREAK is not introduced.</text>

<rect x="70" y="1160" width="1660" height="330" rx="22" fill="#fff5da" stroke="#b87708" class="box"/>
<text x="105" y="1208" class="t sub h">III · RELATIONS / CONDITIONS / RESULTS — 7</text>
<text x="105" y="1255" class="t body">CONSTRAINT · PROJECTION · EQUIVALENCE · DERIVATION</text>
<text x="105" y="1295" class="t body">RETURN_RELATION · INVERSE_RELATION · OBSERVATION</text>
<text x="105" y="1350" class="t small h">PROJECT ≠ PROJECTION   ·   DERIVATION ≠ TRANSFORMATION</text>
<text x="105" y="1388" class="t small h">CONSTRAINT ≠ FILTERING EXECUTION   ·   INVERSE_RELATION ≠ EXECUTED RETURN</text>
<text x="105" y="1445" class="t body h">RECORDS: TRACE · OBS</text>

<rect x="70" y="1520" width="1660" height="265" rx="22" fill="#f1e8fa" stroke="#7e3aac" class="box"/>
<text x="105" y="1568" class="t sub h">IV · CONTEXT-DEPENDENT</text>
<text x="105" y="1620" class="t body">RETURN · GATE · FILTER · INVERSE</text>
<text x="105" y="1670" class="t small">Each requires an explicit use-site type: rule, path/event, predicate, selection, boundary, or relation.</text>
<text x="105" y="1725" class="t sub h" fill="#7e3aac">RETURN ≠ INVERSE</text>

<rect x="70" y="1815" width="1660" height="335" rx="22" fill="#edf0f4" stroke="#657386" class="box"/>
<text x="105" y="1863" class="t sub h">V · EXPRESSION / HISTORICAL QUARANTINE</text>
<text x="105" y="1912" class="t small h">PRESERVED WITHOUT FORMAL PROMOTION</text>
<text x="105" y="1953" class="t small">water · tree · beak · bridge · mirror · stream · island · flow · Scarab · Cicada · Janus</text>
<text x="105" y="1988" class="t small">Elevator · resonance · golden ratio · Möbius</text>
<text x="105" y="2042" class="t small h">QUARANTINED SYLLABLES — FORMAL MAPPING: NONE</text>
<text x="105" y="2083" class="t small">NO · NA · BEL · NABEL · CON · ZE · ZO · EI · EU · DAO · THETA · PHI</text>
<text x="105" y="2123" class="t small h">NO GRAMMAR · NO ETYMOLOGY · NO OPERATOR MAPPING</text>

<rect x="70" y="2180" width="1660" height="145" rx="18" fill="#172033"/>
<text x="105" y="2225" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="white">WHAT IS IT? · HOW IS IT ORIENTED? · WHAT HAPPENED? · WHERE DID IT COME FROM?</text>
<text x="105" y="2270" font-family="Arial,sans-serif" font-size="24" fill="#bfe6ef">FOUR-QUESTION COVERAGE: COMPLETE   ·   NEUTRAL RELABEL: PASSED</text>
<text x="105" y="2307" font-family="Arial,sans-serif" font-size="23" fill="white">TYPES DEFINE. OPERATORS ACT. EXECUTIONS HAPPEN. TRACES ATTEST.</text>

<text x="900" y="2370" text-anchor="middle" class="t body h">EXPRESSION IS PRESERVED. FORMAL MEANING IS EARNED.</text>
<text x="900" y="2398" text-anchor="middle" class="t small muted">OVI-01 · OVR-01 · IOTB-01 — closed sources · bounded reference card</text>
</svg>