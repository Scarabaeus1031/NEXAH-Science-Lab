<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">RC1 Publication Gate — NEXAH Science Lab</title>
  <desc id="desc">Scientific status plate showing two exact replay passes, one isolated Study-2 hash divergence, and a fail-closed publication gate.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0" stop-color="#07182c"/>
      <stop offset="1" stop-color="#020a14"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#b77a2c"/>
      <stop offset="0.5" stop-color="#efbd67"/>
      <stop offset="1" stop-color="#9d6324"/>
    </linearGradient>
    <linearGradient id="ivory" x1="0" x2="1">
      <stop offset="0" stop-color="#e9e2d4"/>
      <stop offset="0.5" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#d7d0c4"/>
    </linearGradient>
    <marker id="arrowGold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#d99a3d"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#4a9dff"/>
    </marker>
    <style>
      .gold { fill:#e0a64d; }
      .ivory { fill:#f4efe6; }
      .blue { fill:#579ff7; }
      .amber { fill:#efaa38; }
      .line { fill:none; stroke:#bd8135; stroke-width:2; }
      .line-blue { fill:none; stroke:#438ee8; stroke-width:2; }
      .hair { fill:none; stroke:#936027; stroke-width:1; }
      .panel { fill:#04101e; fill-opacity:.76; stroke:#b9792d; stroke-width:2; }
      text { font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif; }
      .caps { letter-spacing:5px; }
      .smallcaps { letter-spacing:3px; }
      .micro { font-size:16px; }
      .small { font-size:20px; }
      .body { font-size:23px; }
      .module { font-size:22px; font-weight:600; letter-spacing:2px; }
    </style>
  </defs>

  <rect width="1600" height="1600" fill="url(#bg)"/>
  <rect x="18" y="18" width="1564" height="1564" class="line" stroke-width="3"/>
  <rect x="34" y="34" width="1532" height="1532" class="hair"/>

  <!-- Header -->
  <path d="M76 65L122 40L168 65V116L122 142L76 116Z M122 40L94 114L151 114Z M94 114L122 80L151 114" class="line" stroke-width="4"/>
  <circle cx="122" cy="91" r="18" class="line" stroke-width="4"/>
  <path d="M1425 55Q1460 38 1495 55V122Q1460 105 1425 122ZM1495 55Q1530 38 1545 55V122Q1520 105 1495 122Z" class="line" stroke-width="4"/>
  <text x="800" y="93" text-anchor="middle" font-size="61" font-weight="500" letter-spacing="17" fill="url(#gold)">NEXAH</text>
  <text x="800" y="136" text-anchor="middle" font-size="31" class="caps ivory">SCIENCE LAB</text>
  <text x="800" y="171" text-anchor="middle" font-size="16" class="smallcaps gold">DOCUMENTATION · REPRODUCIBILITY · PUBLICATION GATE</text>
  <path d="M18 190H1582" class="hair"/>

  <!-- Precision instrument -->
  <g opacity=".38">
    <circle cx="800" cy="420" r="275" class="line-blue" stroke-width="1"/>
    <circle cx="800" cy="420" r="230" class="hair"/>
    <circle cx="800" cy="420" r="190" class="line-blue" stroke-width="1" stroke-dasharray="3 9"/>
    <path d="M410 420H1190M800 205V635" class="line-blue" stroke-width="1"/>
    <path d="M505 340Q800 620 1095 340" class="line-blue" stroke-dasharray="8 8"/>
    <circle cx="510" cy="340" r="21" class="line-blue"/><circle cx="800" cy="600" r="21" class="line-blue"/><circle cx="1090" cy="340" r="21" class="line-blue"/>
    <text x="510" y="348" text-anchor="middle" class="small blue">1</text><text x="800" y="608" text-anchor="middle" class="small blue">2</text><text x="1090" y="348" text-anchor="middle" class="small blue">3</text>
  </g>

  <text x="800" y="370" text-anchor="middle" font-size="176" font-weight="650" fill="url(#ivory)">RC1</text>
  <text x="800" y="424" text-anchor="middle" font-size="42" font-weight="600" class="caps gold">PUBLICATION GATE</text>
  <text x="800" y="478" text-anchor="middle" font-size="25" class="caps ivory">SCIENCE PRESERVED.</text>
  <text x="800" y="517" text-anchor="middle" font-size="25" class="caps blue">REPLAY DIVERGENCE ISOLATED.</text>
  <text x="800" y="556" text-anchor="middle" font-size="25" class="caps ivory">PUBLICATION PAUSED.</text>

  <!-- Three-study strip -->
  <rect x="55" y="630" width="1490" height="130" class="panel"/>
  <path d="M535 630V760M1065 630V760" class="hair"/>
  <g text-anchor="middle">
    <text x="295" y="671" class="module blue">STUDY 1</text>
    <circle cx="216" cy="714" r="20" class="line-blue"/><path d="M205 714L213 722L228 705" class="line-blue" stroke-width="3"/>
    <text x="320" y="722" class="module ivory">REPLAY PASS</text>

    <text x="800" y="669" class="module amber">STUDY 2</text>
    <path d="M640 697L655 712L640 727L625 712Z" class="line" stroke="#efaa38"/>
    <text x="820" y="716" class="module amber">HASH DIVERGENCE</text>
    <text x="800" y="742" class="small amber">Frozen: 589c2195…3af1 · Replay: 14a9afc0…</text>

    <text x="1305" y="671" class="module blue">STUDY 3</text>
    <circle cx="1226" cy="714" r="20" class="line-blue"/><path d="M1215 714L1223 722L1238 705" class="line-blue" stroke-width="3"/>
    <text x="1330" y="722" class="module ivory">REPLAY PASS</text>
  </g>

  <!-- Logic path -->
  <g>
    <rect x="72" y="800" width="260" height="76" rx="8" class="panel"/><text x="202" y="846" text-anchor="middle" class="module ivory">FROZEN RESULT</text>
    <path d="M332 838H400" class="line" marker-end="url(#arrowGold)"/>
    <rect x="405" y="800" width="260" height="76" rx="8" class="panel"/><text x="535" y="846" text-anchor="middle" class="module ivory">PORTABLE REPLAY</text>
    <path d="M665 838H733" class="line" marker-end="url(#arrowGold)"/>
    <rect x="738" y="800" width="280" height="76" rx="8" class="panel"/><text x="878" y="846" text-anchor="middle" class="module ivory">HASH COMPARISON</text>
    <path d="M1018 820H1285" class="line-blue" marker-end="url(#arrowBlue)"/>
    <path d="M1018 838H1285" fill="none" stroke="#efaa38" stroke-width="2" stroke-dasharray="10 8"/>
    <path d="M1018 856H1285" class="line-blue" marker-end="url(#arrowBlue)"/>
    <path d="M1268 829L1284 847M1284 829L1268 847" stroke="#efaa38" stroke-width="3"/>
    <rect x="1315" y="800" width="210" height="76" rx="8" class="panel"/><text x="1420" y="846" text-anchor="middle" class="module ivory">GATE</text>
  </g>
  <text x="800" y="906" text-anchor="middle" class="small ivory">Same divergence reproduced with the unchanged historical runner.</text>
  <text x="800" y="934" text-anchor="middle" class="small ivory">Portable adapter is not identified as the cause.</text>

  <!-- Five status modules -->
  <rect x="55" y="970" width="1490" height="126" rx="8" class="panel"/>
  <path d="M353 970V1096M651 970V1096M949 970V1096M1247 970V1096" class="hair"/>
  <g text-anchor="middle">
    <text x="204" y="1008" class="module gold">PRESERVE</text><text x="204" y="1040" class="small ivory">Frozen Science</text><text x="204" y="1074" class="module blue">PASS</text>
    <text x="502" y="1008" class="module gold">PROVENANCE</text><text x="502" y="1040" class="small ivory">Source Identity</text><text x="502" y="1074" class="module blue">PASS</text>
    <text x="800" y="1008" class="module gold">REPLAY</text><text x="800" y="1040" class="small ivory">Study 1 / 3</text><text x="800" y="1074" class="module blue">PASS</text>
    <text x="1098" y="1008" class="module gold">DIVERGENCE</text><text x="1098" y="1040" class="small ivory">Study 2</text><text x="1098" y="1074" class="module amber">OPEN</text>
    <text x="1396" y="1008" class="module gold">PUBLICATION</text><text x="1396" y="1040" class="small ivory">Fail-Closed Gate</text><text x="1396" y="1074" class="module blue">BLOCKED</text>
  </g>

  <!-- Evidence ledger -->
  <rect x="55" y="1112" width="1490" height="100" rx="8" class="panel"/>
  <path d="M353 1112V1212M651 1112V1212M949 1112V1212M1247 1112V1212" class="hair"/>
  <g text-anchor="middle">
    <text x="204" y="1152" font-size="34" class="blue">46</text><text x="204" y="1182" class="micro ivory">frozen allowlist sources unchanged</text>
    <text x="502" y="1152" font-size="34" class="blue">110</text><text x="502" y="1182" class="micro ivory">manifest entries verified</text>
    <text x="800" y="1152" font-size="34" class="blue">0</text><text x="800" y="1182" class="micro ivory">frozen scientific files modified</text>
    <text x="1098" y="1152" font-size="34" class="blue">2 / 3</text><text x="1098" y="1182" class="micro ivory">exact study replays pass</text>
    <text x="1396" y="1152" font-size="34" class="amber">1</text><text x="1396" y="1182" class="micro ivory">replay divergence unresolved</text>
  </g>

  <!-- Boundary and owner panels -->
  <rect x="55" y="1228" width="735" height="170" rx="8" class="panel"/>
  <text x="422" y="1262" text-anchor="middle" class="module gold">UNCHANGED</text>
  <g class="small ivory"><text x="88" y="1296">Mathematical novelty — <tspan class="blue">NONE</tspan></text><text x="88" y="1322">Algorithmic novelty — <tspan class="blue">NONE</tspan></text><text x="88" y="1348">Empirical novelty — <tspan class="blue">PARTIAL</tspan></text><text x="430" y="1296">Methodological novelty — <tspan class="blue">PLAUSIBLE</tspan></text><text x="430" y="1322">Scientific claim boundary — <tspan class="blue">PRESERVED</tspan></text></g>

  <rect x="810" y="1228" width="735" height="170" rx="8" class="panel"/>
  <text x="1178" y="1262" text-anchor="middle" class="module gold">OWNER ACTIONS REMAINING</text>
  <g class="small ivory"><text x="845" y="1300"><tspan class="amber">01 —</tspan> Confirm authorship &amp; citation</text><text x="845" y="1332"><tspan class="amber">02 —</tspan> Confirm research-artifact license scope</text><text x="845" y="1364"><tspan class="amber">03 —</tspan> Resolve or formally preserve Study-2 replay divergence</text></g>

  <!-- Closing statement and footer -->
  <text x="800" y="1442" text-anchor="middle" font-size="38" font-weight="650" letter-spacing="4" class="ivory">A FAILED GATE IS EVIDENCE.</text>
  <text x="800" y="1475" text-anchor="middle" class="small ivory">Nothing is silently repaired. · Nothing is promoted beyond the evidence.</text>
  <path d="M18 1500H1582" class="hair"/>
  <text x="800" y="1530" text-anchor="middle" class="smallcaps ivory">RC1 · OWNER PUBLICATION GATE</text>
  <text x="800" y="1558" text-anchor="middle" font-size="17" letter-spacing="3" class="blue">FINAL STATUS: PUBLICATION_GATE_BLOCKED_BY_REPLAY</text>
  <text x="800" y="1581" text-anchor="middle" font-size="14" letter-spacing="6" class="gold">PRESERVE · TEST · COMPARE · DOCUMENT · DECIDE</text>
</svg>
