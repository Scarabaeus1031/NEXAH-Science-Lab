$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.invalid/representation-ledger/v2.0.0"
title: Representation Ledger Edge V2
type: object
additionalProperties: false
required: [schema_version, record_id, lineage, source_boundary, operator_boundary, target_boundary, preservation_claims, loss_claims, collision_claims, uncertainty, invertibility, task_relevance, evidence, provenance_trace, epistemic_status, claim_history]
properties:
  schema_version: { const: "2.0.0" }
  record_id: { type: string, pattern: "^[A-Z0-9][A-Z0-9._-]{2,127}$" }
  lineage: { $ref: "#/$defs/lineage" }
  source_boundary: { $ref: "#/$defs/boundary" }
  operator_boundary: { $ref: "#/$defs/operator_boundary" }
  target_boundary: { $ref: "#/$defs/boundary" }
  preservation_claims:
    type: array
    items: { $ref: "#/$defs/preservation" }
  loss_claims:
    type: array
    items: { $ref: "#/$defs/loss" }
  collision_claims:
    type: array
    items: { $ref: "#/$defs/collision" }
  uncertainty:
    type: array
    items: { $ref: "#/$defs/uncertainty" }
  invertibility: { $ref: "#/$defs/invertibility" }
  task_relevance: { $ref: "#/$defs/task_relevance" }
  evidence:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/evidence" }
  provenance_trace: { $ref: "#/$defs/provenance_trace" }
  epistemic_status: { $ref: "#/$defs/epistemic_status" }
  claim_history:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/history_claim" }
allOf:
  - if:
      anyOf:
        - properties: { source_boundary: { properties: { resolution: { const: BOUNDARY_UNRESOLVED } }, required: [resolution] } }
        - properties: { operator_boundary: { properties: { resolution: { const: BOUNDARY_UNRESOLVED } }, required: [resolution] } }
        - properties: { target_boundary: { properties: { resolution: { const: BOUNDARY_UNRESOLVED } }, required: [resolution] } }
    then:
      properties:
        epistemic_status:
          properties:
            implementation_status: { not: { const: LOCATED } }
            claim_support_status: { not: { const: SUPPORTED } }
$defs:
  judgment:
    type: object
    additionalProperties: false
    required: [basis, assessor, rationale]
    properties:
      basis: { enum: [DETERMINISTIC, RULE_GUIDED, EXPERT_JUDGMENT, UNKNOWN] }
      assessor: { type: string, minLength: 1 }
      rationale: { type: string, minLength: 1 }
  lineage:
    type: object
    additionalProperties: false
    required: [revision, supersedes_record_id, history_policy, prior_claim_ids]
    properties:
      revision: { type: integer, minimum: 1 }
      supersedes_record_id: { type: [string, "null"] }
      history_policy: { const: APPEND_PRESERVING }
      prior_claim_ids:
        type: array
        uniqueItems: true
        items: { type: string }
  artifact:
    type: object
    additionalProperties: false
    required: [artifact_id, provenance_state]
    properties:
      artifact_id: { type: string, minLength: 1 }
      provenance_state: { enum: [KNOWN, PROVENANCE_UNAVAILABLE, UNKNOWN, NOT_APPLICABLE] }
      locator: { type: string }
      sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
      note: { type: string }
    allOf:
      - if: { properties: { provenance_state: { const: KNOWN } }, required: [provenance_state] }
        then: { required: [locator] }
  representation:
    type: object
    additionalProperties: false
    required: [class, subtype, contract_id, contract, qualifiers, artifacts]
    properties:
      class: { enum: [MODEL, ARRAY, FIELD, FEATURE_SET, PARTITION, EDGE_SET, GRAPH, RECORD, STATISTICAL_SUMMARY, CLASSIFICATION, MEASUREMENT, VISUALIZATION, DECISION, EXTENSION] }
      subtype: { type: string, minLength: 1 }
      contract_id: { type: string, minLength: 1 }
      contract: { type: string, minLength: 1 }
      qualifiers:
        type: object
        additionalProperties: false
        properties:
          grid_rank: { type: integer, minimum: 0 }
          coordinate_arrays: { type: boolean }
          value_kind: { enum: [SCALAR, INTEGER_LABEL, COORDINATE_PAIR, EDGE_PAIR, RECORD, STATUS, TIME_SERIES] }
          directed: { type: boolean }
          weighted: { type: boolean }
          labeled: { type: boolean }
          simple: { type: boolean }
          includes_isolated_nodes: { type: boolean }
          temporal: { type: boolean }
      artifacts:
        type: array
        items: { $ref: "#/$defs/artifact" }
  boundary:
    type: object
    additionalProperties: false
    required: [resolution, boundary_id, description, representations, judgment]
    properties:
      resolution: { enum: [RESOLVED, BOUNDARY_UNRESOLVED] }
      boundary_id: { type: string, minLength: 1 }
      description: { type: string, minLength: 1 }
      representations:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/representation" }
      judgment: { $ref: "#/$defs/judgment" }
  component:
    type: object
    additionalProperties: false
    required: [order, component_id, name, definition_ref, input_contract, output_contract, judgment]
    properties:
      order: { type: integer, minimum: 1 }
      component_id: { type: string, minLength: 1 }
      name: { type: string, minLength: 1 }
      definition_ref: { type: string, minLength: 1 }
      input_contract: { type: string, minLength: 1 }
      output_contract: { type: string, minLength: 1 }
      judgment: { $ref: "#/$defs/judgment" }
  assumption:
    type: object
    additionalProperties: false
    required: [key, statement, judgment]
    properties:
      key: { type: string, pattern: "^[a-z][a-z0-9_]*$" }
      statement: { type: string, minLength: 1 }
      judgment: { $ref: "#/$defs/judgment" }
  operator_boundary:
    type: object
    additionalProperties: false
    required: [resolution, unit_kind, operator_id, name, definition_ref, version, boundary_justification, components, parameters, assumptions, judgment]
    properties:
      resolution: { enum: [RESOLVED, BOUNDARY_UNRESOLVED] }
      unit_kind: { enum: [ATOMIC, COMPOSITE, BOUNDARY_UNRESOLVED] }
      operator_id: { type: string, minLength: 1 }
      name: { type: string, minLength: 1 }
      definition_ref: { type: string, minLength: 1 }
      version: { type: string, minLength: 1 }
      boundary_justification: { type: string, minLength: 1 }
      components:
        type: array
        items: { $ref: "#/$defs/component" }
      parameters: { type: object }
      assumptions:
        type: array
        items: { $ref: "#/$defs/assumption" }
      judgment: { $ref: "#/$defs/judgment" }
    allOf:
      - if: { properties: { unit_kind: { const: COMPOSITE } }, required: [unit_kind] }
        then: { properties: { components: { minItems: 2 } } }
      - if: { properties: { unit_kind: { const: ATOMIC } }, required: [unit_kind] }
        then: { properties: { components: { maxItems: 0 } } }
      - if: { properties: { resolution: { const: BOUNDARY_UNRESOLVED } }, required: [resolution] }
        then: { properties: { unit_kind: { const: BOUNDARY_UNRESOLVED } } }
  preservation:
    type: object
    additionalProperties: false
    required: [claim_id, object, criterion_type, criterion, result, evidence_refs, judgment]
    properties:
      claim_id: { type: string, minLength: 1 }
      object: { type: string, minLength: 1 }
      criterion_type: { enum: [EXACT_EQUALITY, TOLERANCE, EQUIVALENCE_RELATION, DETERMINISTIC_PROPERTY_TEST, EMPIRICAL_COMPARISON, EXTERNAL_TASK_CRITERION, PRESERVATION_NOT_ESTABLISHED] }
      criterion: { type: string, minLength: 1 }
      result: { enum: [PRESERVED, NOT_PRESERVED, PARTIAL, UNKNOWN, NOT_ESTABLISHED] }
      evidence_refs:
        type: array
        minItems: 1
        items: { type: string }
      judgment: { $ref: "#/$defs/judgment" }
    allOf:
      - if: { properties: { criterion_type: { const: PRESERVATION_NOT_ESTABLISHED } }, required: [criterion_type] }
        then: { properties: { result: { const: NOT_ESTABLISHED } } }
  loss:
    type: object
    additionalProperties: false
    required: [claim_id, object_or_distinction, category, criterion, result, evidence_refs, judgment]
    properties:
      claim_id: { type: string, minLength: 1 }
      object_or_distinction: { type: string, minLength: 1 }
      category: { enum: [STRUCTURAL, OBSERVED_INSTANCE, POTENTIAL, TASK_RELEVANT, UNKNOWN] }
      criterion: { type: string, minLength: 1 }
      result: { enum: [ESTABLISHED, NOT_ESTABLISHED, PARTIAL, UNKNOWN] }
      task_ref: { type: string }
      evidence_refs:
        type: array
        minItems: 1
        items: { type: string }
      judgment: { $ref: "#/$defs/judgment" }
    allOf:
      - if: { properties: { category: { const: TASK_RELEVANT } }, required: [category] }
        then: { required: [task_ref] }
  collision:
    type: object
    additionalProperties: false
    required: [claim_id, source_a_ref, source_b_ref, source_distinction_criterion, target_equivalence_criterion, result, evidence_refs, judgment]
    properties:
      claim_id: { type: string, minLength: 1 }
      source_a_ref: { type: string, minLength: 1 }
      source_b_ref: { type: string, minLength: 1 }
      source_distinction_criterion: { type: string, minLength: 1 }
      target_equivalence_criterion: { type: string, minLength: 1 }
      result: { enum: [COLLISION_OBSERVED, NO_COLLISION_OBSERVED, POTENTIAL_ONLY, UNKNOWN] }
      evidence_refs:
        type: array
        minItems: 1
        items: { type: string }
      judgment: { $ref: "#/$defs/judgment" }
  uncertainty:
    type: object
    additionalProperties: false
    required: [uncertainty_id, category, state, description, judgment]
    properties:
      uncertainty_id: { type: string, minLength: 1 }
      category: { enum: [NUMERICAL, SAMPLING, PARAMETER, MODEL, DISCRETIZATION, CLASSIFICATION, CALIBRATION, OTHER] }
      state: { enum: [QUANTIFIED, BOUNDED, NOT_QUANTIFIED, NOT_APPLICABLE, UNKNOWN] }
      description: { type: string, minLength: 1 }
      value: { type: number }
      unit: { type: string }
      method: { type: string }
      evidence_refs:
        type: array
        items: { type: string }
      judgment: { $ref: "#/$defs/judgment" }
    allOf:
      - if: { properties: { state: { enum: [QUANTIFIED, BOUNDED] } }, required: [state] }
        then:
          required: [value, method, evidence_refs]
          properties: { evidence_refs: { minItems: 1 } }
  invertibility:
    type: object
    additionalProperties: false
    required: [classification, declared_domain, criterion, evidence_refs, judgment]
    properties:
      classification: { enum: [EXACTLY_INVERTIBLE, CONDITIONALLY_INVERTIBLE, APPROXIMATELY_RECOVERABLE, MANY_TO_ONE, NONINVERTIBLE, UNKNOWN] }
      declared_domain: { type: string, minLength: 1 }
      criterion: { type: string, minLength: 1 }
      inverse_ref: { type: string }
      evidence_refs:
        type: array
        minItems: 1
        items: { type: string }
      judgment: { $ref: "#/$defs/judgment" }
  task_relevance:
    oneOf:
      - type: object
        additionalProperties: false
        required: [state]
        properties: { state: { const: UNDEFINED } }
      - type: object
        additionalProperties: false
        required: [state, task_id, task_source, task_owner, adequacy_criterion, decision_consequence]
        properties:
          state: { const: DEFINED }
          task_id: { type: string, minLength: 1 }
          task_source: { type: string, minLength: 1 }
          task_owner: { type: string, minLength: 1 }
          adequacy_criterion: { type: string, minLength: 1 }
          decision_consequence: { type: string, minLength: 1 }
  evidence:
    type: object
    additionalProperties: false
    required: [evidence_id, evidence_type, eligibility, integrity, locator, supports_claim_ids]
    properties:
      evidence_id: { type: string, minLength: 1 }
      evidence_type: { enum: [CODE, DATA, MATHEMATICS, EXTERNAL_REFERENCE, AUDIT, PROTOCOL, VISUAL] }
      eligibility: { enum: [TECHNICAL_SUPPORT, EXPLANATORY_ONLY, NONTECHNICAL_SYMBOLIC] }
      integrity: { enum: [LOCATED, HASH_CONFIRMED, REPLAY_CONFIRMED, PROVENANCE_UNAVAILABLE, UNKNOWN] }
      locator: { type: string }
      sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
      supports_claim_ids:
        type: array
        uniqueItems: true
        items: { type: string }
    allOf:
      - if: { properties: { eligibility: { enum: [EXPLANATORY_ONLY, NONTECHNICAL_SYMBOLIC] } }, required: [eligibility] }
        then: { properties: { supports_claim_ids: { maxItems: 0 } } }
      - if: { properties: { integrity: { enum: [HASH_CONFIRMED, REPLAY_CONFIRMED] } }, required: [integrity] }
        then: { required: [sha256] }
  trace_link:
    type: object
    additionalProperties: false
    required: [link_id, role, state, note]
    properties:
      link_id: { type: string, minLength: 1 }
      role: { enum: [CLAIM, ARTIFACT, IMPLEMENTATION, CONFIGURATION, INPUT, OUTPUT, AUDIT] }
      state: { enum: [LOCATED, HASH_CONFIRMED, REPLAY_CONFIRMED, PROVENANCE_UNAVAILABLE, UNKNOWN, NOT_APPLICABLE] }
      locator: { type: string }
      sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
      note: { type: string }
    allOf:
      - if: { properties: { state: { enum: [LOCATED, HASH_CONFIRMED, REPLAY_CONFIRMED] } }, required: [state] }
        then: { required: [locator] }
      - if: { properties: { state: { enum: [HASH_CONFIRMED, REPLAY_CONFIRMED] } }, required: [state] }
        then: { required: [sha256] }
  provenance_trace:
    type: object
    additionalProperties: false
    required: [links, sufficiency_judgment]
    properties:
      links:
        type: array
        minItems: 1
        items: { $ref: "#/$defs/trace_link" }
      sufficiency_judgment: { $ref: "#/$defs/judgment" }
  status_dimension:
    type: object
    additionalProperties: false
    required: [value, evidence_refs, judgment]
    properties:
      value: { type: string, minLength: 1 }
      evidence_refs:
        type: array
        items: { type: string }
      judgment: { $ref: "#/$defs/judgment" }
  epistemic_status:
    type: object
    additionalProperties: false
    required: [implementation_status, execution_status, reproducibility_status, provenance_status, claim_support_status, dimensions]
    properties:
      implementation_status: { enum: [LOCATED, PARTIAL, NOT_LOCATED, NOT_APPLICABLE, UNKNOWN] }
      execution_status: { enum: [NOT_EXECUTED, EXECUTED, REPRODUCED, FAILED, NOT_APPLICABLE, UNKNOWN] }
      reproducibility_status: { enum: [REPRODUCIBLE, PARTIAL, NOT_REPRODUCIBLE, NOT_TESTED, NOT_APPLICABLE, UNKNOWN] }
      provenance_status: { enum: [COMPLETE, PARTIAL, PROVENANCE_UNAVAILABLE, NOT_APPLICABLE, UNKNOWN] }
      claim_support_status: { enum: [SUPPORTED, PARTIAL, REJECTED, MIXED, NOT_ASSESSED, UNKNOWN] }
      dimensions:
        type: object
        additionalProperties: false
        required: [implementation, execution, reproducibility, provenance, claim_support]
        properties:
          implementation: { $ref: "#/$defs/status_dimension" }
          execution: { $ref: "#/$defs/status_dimension" }
          reproducibility: { $ref: "#/$defs/status_dimension" }
          provenance: { $ref: "#/$defs/status_dimension" }
          claim_support: { $ref: "#/$defs/status_dimension" }
  history_claim:
    type: object
    additionalProperties: false
    required: [claim_id, claim_type, statement, status, evidence_refs, supersedes, append_action, judgment]
    properties:
      claim_id: { type: string, minLength: 1 }
      claim_type: { enum: [EXECUTION, SCIENTIFIC_INTERPRETATION, BOUNDARY, PROVENANCE, PRESERVATION, LOSS] }
      statement: { type: string, minLength: 1 }
      status: { enum: [SUPPORTED, PARTIAL, REJECTED, NOT_ASSESSED, SUPERSEDED] }
      evidence_refs:
        type: array
        minItems: 1
        items: { type: string }
      supersedes:
        type: array
        uniqueItems: true
        items: { type: string }
      append_action: { enum: [CREATED, CARRIED_FORWARD] }
      judgment: { $ref: "#/$defs/judgment" }
