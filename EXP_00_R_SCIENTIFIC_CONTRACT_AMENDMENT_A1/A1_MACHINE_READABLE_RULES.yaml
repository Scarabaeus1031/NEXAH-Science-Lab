schema_version: "1.0"
amendment_id: "EXP00R-SCIENTIFIC-CONTRACT-A1-20260808"
status: "PROSPECTIVE_NOT_IMPLEMENTED_NOT_EXECUTED"
authoritative_v1:
  config_id: "EXP00R-ROSSLER-2REP-XCTRL-H1-FROZEN-20260808-v1"
  composite_sha256: "971d4d947366f54692f72bbf20ac89ac4fcf7d11d4654f65bd4bfc6e1658bc05"
scope:
  resolved_questions: ["N5", "PER_SEED_DOMINANCE", "NULL_PREDICTIVE_GAIN"]
  all_other_v1_rules: "UNCHANGED"

N5:
  type: "DETERMINISTIC_COORDINATE_EQUIVARIANCE_DIAGNOSTIC"
  stochastic_null: false
  matrix_registry:
    dimension: 3
    construction: "SIGNED_PERMUTATION"
    determinant: 1
    ordering: "LEXICOGRAPHIC_FLATTENED_ASCENDING"
    count: 12
    executions_per_matrix_per_tier: 1
  transform:
    state: "x_prime = Q @ x"
    every_training_path_state: true
    every_query_state: true
    actuator: "B_prime = Q @ B"
    scalar_action_labels: "UNCHANGED"
    standardizer_mean: "mu_prime = Q @ mu"
    standardizer_scale: "scale_prime[j] = scale[source_coordinate_selected_by_row_j_of_Q]"
    target_center: "c_prime = Q @ c"
    target_radius: "UNCHANGED"
    target_subset_reselected: false
    representations_refitted: ["TRAJECTORY", "LEARNED_FIELD"]
    state_valued_terminal_output: "inverse_register_with_Q_transpose_before_original_target_score"
    support: "REFIT_AND_EVALUATE_IN_TRANSFORMED_COORDINATES"
  ranking_comparison:
    action_count: 5
    statistic: "KENDALL_TAU_B"
    threshold_operator: ">="
    threshold: 0.99
    aggregation: "MINIMUM_OVER_TIERS_SEPARATELY_REPRESENTATIONS_QUERIES_MATRICES"
    undefined_both_constant_identical: 1.0
    undefined_other: 0.0
    missing_transformed_ranking: "FAIL"
  tiers:
    N5_SYNTH:
      stage: "PRE_AUTHORIZATION_PRE_SEED_RELEASE"
      data_population: "FIXED_NONREGISTERED_SYNTHETIC_FIXTURE"
      field_matrix:
        - [-0.2, -1.0, -0.1]
        - [1.0, -0.3, 0.0]
        - [0.2, 0.0, -0.4]
      actuator: [1.0, 0.0, 0.0]
      actions: [-0.5, -0.25, 0.0, 0.25, 0.5]
      integrator: "FIXED_STEP_RK4"
      dt: 0.005
      horizon: 1.0
      observation_interval: 0.05
      training_cartesian_axes:
        x: [-1.0, -0.5, 0.0, 0.5, 1.0]
        y: [-1.0, -0.5, 0.0, 0.5, 1.0]
        z: [-1.0, -0.5, 0.0, 0.5, 1.0]
      query_cartesian_axes:
        x: [-0.75, -0.25, 0.25, 0.75]
        y: [-0.6, -0.2, 0.2, 0.6]
        z: [-0.5, 0.0, 0.5]
      cartesian_order: "LEXICOGRAPHIC_X_Y_Z"
      target: "BUILD_ONCE_FROM_ORIGINAL_TRAINING_STATES_USING_FROZEN_V1_RULE"
      comparison_population: "ORIGINAL_JOINTLY_SUPPORTED_QUERIES"
      minimum_comparison_rows: 20
      failure_state: "IMPLEMENTATION_FAILURE"
      registered_execution_allowed_after_failure: false
    N5_RUN:
      stage_order:
        after: ["AUTHORIZED_REGISTERED_TRAINING_TABLE", "TARGET", "ORIGINAL_REPRESENTATION_FITS", "HELDOUT_QUERY_PREDICTIONS", "ORIGINAL_SUPPORT_ACCOUNTING"]
        before: ["INTERVENTION_OUTCOMES", "PRIMARY_REGRESSION", "N1", "N2", "N3", "N4", "SENSITIVITIES", "BOOTSTRAP", "CLASSIFICATION"]
      comparison_population: "ORIGINAL_UNTRANSFORMED_JOINTLY_SUPPORTED_HELDOUT_QUERIES_INCLUDING_ZERO_ACTION_CARRIERS"
      population_fixed_before_transformed_fit_inspection: true
      transformed_abstention_causes_failure: true
      failure_state: "INVALID_EXPERIMENT"
      proposition_effect: "VALIDITY_ONLY"

PER_SEED_DOMINANCE:
  carriers: ["TRAJECTORY", "LEARNED_FIELD"]
  population: "FROZEN_PRIMARY_JOINTLY_SUPPORTED_HELDOUT_ROWS_INCLUDING_ZERO_ACTION_CARRIERS"
  model_predictions: "SAME_FROZEN_PRIMARY_BASELINE_AND_AUGMENTED_MODELS_NO_PER_SEED_REFIT"
  probability_clip: [1.0e-15, 0.999999999999999]
  per_seed_baseline_loss: "L0[c,s] = mean_i_in_seed(binary_log_loss(y_i,p0_i))"
  per_seed_augmented_loss: "L1[c,s] = mean_i_in_seed(binary_log_loss(y_i,p1_i))"
  signed_gain: "d[c,s] = L0[c,s] - L1[c,s]"
  clip_gain: false
  seed_weight: "n[c,s] / N[c]"
  contribution: "g[c,s] = (n[c,s]/N[c]) * d[c,s]"
  aggregate: "G[c] = sum_s(g[c,s])"
  aggregate_identity_tolerance_absolute: 1.0e-12
  ranking:
    primary: "g_descending"
    tie_break: "seed_id_ascending"
  top_count: 3
  numerator: "D3[c] = sum_of_first_3_ranked_g"
  decision:
    if_aggregate_nonpositive: "FAIL_AGGREGATE_NONPOSITIVE"
    ratio_when_positive: "R[c] = D3[c] / G[c]"
    pass_operator: "<="
    pass_threshold: 0.50
    equality_passes: true
    both_carriers_required: true
  seeds_without_endpoint_variation: "INCLUDE_IN_LOG_LOSS; SEPARATE_ASSOCIATION_DIRECTION_ZERO"
  seeds_without_eligible_rows: "EXCLUDE_FROM_N_AND_REPORT_NONCONTRIBUTING"

NULL_PREDICTIVE_GAIN:
  stochastic_families: ["N1_ACTION_LABEL", "N2_RANK_PERMUTATION", "N3_STATE_MISMATCH", "N4_SUPPORT_MATCHED"]
  repetitions_per_family: 200
  required_statistics_per_repetition:
    agreement: ["MEAN_COHERENCE", "TOP_ACTION_AGREEMENT"]
    per_carrier: ["STANDARDIZED_COHERENCE_COEFFICIENT", "HELDOUT_LOG_LOSS_IMPROVEMENT"]
  missing_or_nonfinite_repetition: "INVALID_EXPERIMENT"
  comparison:
    direction: "OBSERVED_GREATER_THAN_NULL"
    adverse_tie: true
    exceedance_count: "k = count(T_null >= T_observed)"
    monte_carlo_p: "p = (1 + k) / 201"
    alpha: 0.025
    pass_operator: "<="
    maximum_exceedance_count_for_pass: 4
    descriptive_percentile:
      probability: 0.975
      method: "NEAREST_RANK"
      one_based_sorted_index: 195
      decision_authority: false
  proposition_mapping:
    P1:
      required_observed_statistics: ["MEAN_COHERENCE", "TOP_ACTION_AGREEMENT"]
      required_null_families: ["N1_ACTION_LABEL", "N2_RANK_PERMUTATION", "N3_STATE_MISMATCH", "N4_SUPPORT_MATCHED"]
      all_statistics_all_families_required: true
    P2:
      frozen_rule: "BOTH_CARRIERS_COEFFICIENT_POSITIVE_AND_CLUSTERED_95_PERCENT_INTERVAL_LOW_GREATER_THAN_ZERO"
      coefficient_null_comparison: "MANDATORY_DIAGNOSTIC_NO_PROPOSITION_EFFECT"
    P3:
      carriers: ["TRAJECTORY", "LEARNED_FIELD"]
      observed_log_loss_improvement_operator: ">"
      observed_log_loss_improvement_threshold: 0.0
      augmented_brier_operator: "<="
      augmented_brier_reference: "BASELINE_BRIER"
      required_null_families: ["N1_ACTION_LABEL", "N2_RANK_PERMUTATION", "N3_STATE_MISMATCH", "N4_SUPPORT_MATCHED"]
      all_carriers_all_families_required: true
    N5:
      effect: "VALIDITY_ONLY"
      monte_carlo_distribution: false

nonexecution:
  implementation_created: false
  authorization_created: false
  registered_data_accessed: false
  registered_experiment_executed: false
